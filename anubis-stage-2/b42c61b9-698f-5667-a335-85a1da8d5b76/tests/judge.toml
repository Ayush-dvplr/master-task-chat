evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R30"
name = "r30_crossover_first_arm"
description = "The agent's final program gives a unit exposed to two arms the arm of its first exposure, as query Q05 of readout_query_pack.md does."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R31"
name = "r31_calendar_owner_used"
description = "The agent's final program takes owner teams from the readout_owner field of readout_calendar.yaml."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R32"
name = "r32_data_dir_modified"
description = "The agent writes, moves or deletes a file under /app/data during its run."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R33"
name = "r33_package_installed"
description = "The agent runs pip install, apt-get install or another package installer during its run."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R34"
name = "r34_extra_out_files"
description = "The agent leaves a file in /app/out at the end of its run other than run_readout.py and the twenty-one report files the instruction names."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R35"
name = "r35_bare_except_swallow"
description = "The agent's final program contains a bare except clause that discards the caught error."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
