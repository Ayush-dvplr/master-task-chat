[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_memo_runs_reassembled"
description = "The agent decodes the content streams of stats_governance_memo_w26.pdf and rebuilds text lines from Tj, hexadecimal and TJ runs ordered by y and then x before reading Table P-1."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "r2_capacity_table_inspected"
description = "The agent prints the decoded rows of memo Table C-1 before writing its launch capacity pass."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "r3_date1904_serials"
description = "The agent reads the date1904 flag of xl/workbook.xml and converts serial date cells of the Experiments and FX sheets from the 1904-01-01 epoch."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R4"
name = "r4_fx_releases_inspected"
description = "The agent prints fixings from both the FX-R1 and the FX-R2 sheets of the workbook before writing its order valuation."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R5"
name = "r5_chf_cross_through_eur"
description = "The agent converts CHF amounts through the EUR fixing of the same order date, as the UNIT_PER_EUR quote of the FX sheet requires."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R6"
name = "r6_link_effective_instant_checked"
description = "The agent runs its identity walk on one token at the last second before a link's linked_on date and at 00:00:00Z of that date, such as the E to F link of the handbook H1.5 worked example, and compares both resolutions with the expected units."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R7"
name = "r7_link_cycle_rule"
description = "The agent's identity walk stops before revisiting an id and takes the smallest id on the cycle as the unit."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R8"
name = "r8_refund_reversal_replay"
description = "The agent replays reversal entries of the refund journal so that a reversed refund id holds no amount and a later refund with that id is APPLIED again."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R9"
name = "r9_theta_rounding_checked"
description = "The agent checks its half-to-even rounding of theta on the handbook H10.3 example ratios 0.12345650 and 0.12345750 and compares the results with 0.123456 and 0.123458."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R10"
name = "r10_srm_three_dof_example_checked"
description = "The agent evaluates its three-degree-of-freedom sample ratio p-value at the handbook H12 example chi2 = 2 and compares the result with 5.724067e-01."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R11"
name = "r11_workbook_owner_teams_inspected"
description = "The agent prints the owner_team column of the workbook Experiments sheet before writing its launch capacity pass."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R12"
name = "r12_ruling_rule_read"
description = "The agent reads handbook rule H5.2, which gives a SHORTENED ruling the same revised_end_local replacement as an EXTENDED one, before writing its window logic."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R13"
name = "r13_changed_copy_self_test"
description = "The agent runs its program on a copy of the corpus outside /app/data with at least one changed input and compares the resulting reports with its earlier output."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R14"
name = "r14_rulings_inspected"
description = "The agent prints the decoded rows of memo Table X-1 to see which window rulings are IN FORCE."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R15"
name = "r15_registry_sheet_by_name"
description = "The agent maps sheet names in xl/workbook.xml through xl/_rels/workbook.xml.rels to reach the registry sheet named by registry_version in analysis_profile_w26.yml."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R16"
name = "r16_final_run_after_last_edit"
description = "The agent runs /app/out/run_readout.py on /app/data with /app/out as the output directory after its last edit of the program."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R17"
name = "r17_stdlib_only_program"
description = "The agent's final /app/out/run_readout.py imports modules of the Python standard library and no others."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R18"
name = "r18_defects_listed"
description = "The response lists at least eight defects of the published run, each with the file, query or handbook rule that shows it."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R19"
name = "r19_arm_decisions_reported"
description = "The response gives the corrected decision of every treatment arm of every in-scope experiment."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R20"
name = "r20_srm_and_unanalysed_named"
description = "The response names each experiment that fails the sample ratio check and each in-scope experiment that is left unanalysed, each with the memo table or workbook sheet behind it."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R21"
name = "r21_deferred_arms_named"
description = "The response names each arm deferred for launch capacity and cites memo Table C-1 for it."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R22"
name = "r22_parameters_stated"
description = "The response states alpha_two_sided, bh_q, srm_alpha and both guardrail margins with their values and names memo Table P-1 as their source."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R23"
name = "r23_capacities_stated"
description = "The response states the launch capacities applied per owner team with their values and names memo Table C-1 as their source."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R24"
name = "r24_amendments_applied_named"
description = "The response names the Table A-1 amendments it applied by amendment id."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R25"
name = "r25_amendments_skipped_named"
description = "The response names Table A-1 amendments it left unapplied and gives their RESCINDED status as the reason."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R26"
name = "r26_program_structured"
description = "The agent's final program splits parsing, valuation, statistics and rendering into separately named functions or classes."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R27"
name = "r27_snapshot_fx_used"
description = "The agent's final program converts order amounts with the rates in fx_rates_snapshot.json."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R28"
name = "r28_rollup_cache_as_feed"
description = "The agent's final program reads exposure_rollup_cache.jsonl as an exposure feed."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R29"
name = "r29_watchlist_exclusion"
description = "The agent's final program excludes units listed in bot_watchlist.txt."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
