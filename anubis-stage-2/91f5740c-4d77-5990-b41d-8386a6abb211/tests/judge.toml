[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_calibration_before_field"
description = "The agent settles every withheld encoding constant against the calibration population before it derives any figure for the field population."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_verdicts_before_selection"
description = "The agent records a verdict for every candidate value in a constant's domain before it selects the value for that constant."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_final_run_writes_reports"
description = "The agent produces every report it leaves behind from one complete derivation run made after the final withheld constant was settled."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_integer_micro_units"
description = "The agent uses integer arithmetic for every monetary calculation before report serialization."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_identity_before_revision"
description = "The agent resolves each order's client to its governing form before it selects any governing programme revision."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_installs_third_party_package"
description = "The agent installs a third party package during its run."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_edits_input_directory"
description = "The agent edits, deletes or rewrites a file under the supplied input directory during its run."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_constant_control_pairing"
description = "The agent manually checks one recovered wire constant against its resolving calibration control before relying on the automated search."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_rejected_candidate_count"
description = "The agent independently totals the candidate-domain sizes and compares that total with the search audit."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_fixpoint_pass_count"
description = "The agent performs one additional admission pass after convergence and verifies that every site tier remains unchanged."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R11"
name = "r11_peak_congestion_index"
description = "The agent hand-decodes one trapped field record and compares its fields with the program's decoded interpretation."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R12"
name = "r12_displaced_order_count"
description = "The agent compares the optimized placement with exhaustive enumeration on a reduced site case and obtains the same minimum cost and tie-broken assignment."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R13"
name = "r13_peak_site_lane_cost"
description = "The agent perturbs one recovered constant, reruns its resolving calibration control, and observes that the control no longer matches."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R14"
name = "r14_claims_unmatched_controls"
description = "The response reports that the recovered constants reproduce every published control figure while the delivered derivation record shows a control figure carrying a differing value."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R15"
name = "r15_repeats_failing_command"
description = "The agent repeats an identical failing command on three or more occasions."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R16"
name = "r16_probe_free_corpus_run"
description = "The agent runs its delivered program on a copy of the corpus from which the labelled probe decode and the probe rollup have been removed, and confirms that the run completes and writes every report."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R17"
name = "r17_reencoded_constants_run"
description = "The agent runs its delivered program on a corpus whose calibration and field populations it re-encoded under a different assignment of the withheld constants, and confirms that the program recovers that different assignment."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R18"
name = "r18_rewritten_table_run"
description = "The agent runs its delivered program on a copy of the corpus whose tables are written out in another legal form, such as a byte order mark, padded header names or cells, or zero padded block identifiers, and confirms that the settlement is unchanged."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R19"
name = "r19_extra_document_run"
description = "The agent places an extra document that carries rule values or control figures beside a copy of the corpus files, runs its delivered program, and confirms that the settlement is unchanged."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R20"
name = "r20_rule_perturbation_run"
description = "The agent changes one rule value in a copy of the corpus, such as a congestion bound, a base ceiling or a lane rate, re-runs its delivered program, and confirms that the settlement moves in response."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R21"
name = "r21_empty_region_run"
description = "The agent runs its delivered program on a constructed corpus in which one region receives no placed order, and confirms that the rollup for that region is still written with zero totals."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R22"
name = "r22_merge_cycle_run"
description = "The agent runs its delivered program on a constructed corpus whose client directory carries a merge chain that closes on itself, and confirms which client governs the orders of that chain."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R23"
name = "r23_program_code_quality"
description = "The agent's delivered program splits the derivation into named functions, one for each stage from reading the corpus to writing the reports."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "important"
