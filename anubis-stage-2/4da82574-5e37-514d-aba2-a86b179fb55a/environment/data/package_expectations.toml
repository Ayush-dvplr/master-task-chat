# the shape the delivered archive has to carry.

[archive]
root_files = ["pyproject.toml"]
source_root = "src/bcrep"
tests_root = "tests"

[modules]
names = ["__init__", "__main__", "checkpointing", "compensation", "derived", "depends", "normalise", "ordering", "params", "publish", "reading", "replay", "transitions", "window"]

[runtime]
python_series = "3.12"
third_party_imports = 0
entry_point = "bcrep.__main__"
