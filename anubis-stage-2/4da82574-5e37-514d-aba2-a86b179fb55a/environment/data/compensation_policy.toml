# how a compensating event reverses the event it names.

[reversal_counter_map]
grant = "granted_cu"
retire = "retired_cu"
transfer = "transferred_cu"

[dispositions]
applied = "the target effect came off exactly once"
void_duplicate = "a later compensation names an already reversed target"
void_unapplied = "the named target never took effect in this run"

[counters]
void_rows_move_no_counter = true
reversed_counter = "reversed_cu"
compensation_counter = "compensations"
