# which paper governs when two papers disagree.

[registers]
stations = "station_register_frozen.csv"
stations_superseded = "station_register_current.csv"
scope = "topology_and_scope.xml"
scope_superseded = "topology_drafts.xml"
scales = "custody_parameter_workbook.xlsx"
scales_superseded = "legacy_scale_table.csv"
dependency_edges = "dependency_edges.psv"
dependency_edges_superseded = "the depends_on list inside each journal record"

[rule]
in_force = "a row whose revision exceeds the frozen register revision is a draft"
tie = "greatest revision at or below the frozen register revision"
workbook_sheet = "the sheet whose epoch key cell equals the header epoch key"
