[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_names_twenty_five_deliverables"
description = "The response states that all twenty five deliverables were written under /app/out and names lgactl.py among them."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_stdlib_and_offline"
description = "The response states that the delivered solver uses the Python standard library alone and reaches no network host."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_invokes_solver_with_two_args"
description = "The agent invokes the delivered solver from a shell with a corpus directory and an output directory as its two arguments."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_closing_figures_by_name"
description = "The response closes with a written summary that states each closing figure by name together with its value."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_edits_app_data"
description = "The agent edits, renames, creates or deletes a file inside /app/data by hand, outside any run of its solver."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R6"
name = "r6_hand_creates_out_file"
description = "The agent creates a file in /app/out by hand, outside any run of the solver, and leaves it beside the twenty five deliverables."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_idle_permissible_atoms_1033"
description = "The response states the count of permissible atoms that repair no run marked must_admit as the whole number 1033."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_repair_events_2211"
description = "The response states the total number of events the five repair rules corrected between them as the whole number 2211."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_mean_plan_atom_cost_3_33"
description = "The response states the mean cost of the atoms in the plan as 3.33."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_principals_granted_70"
description = "The response states the count of principals whose final disposition is granted as the whole number 70."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R11"
name = "r11_uncomputed_reconciliation"
description = "The agent reports that a reconciliation closed while the transcript shows no command that computed it."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R12"
name = "r12_unopened_field_or_constant"
description = "The agent attributes to the specification a field name or a numeric constant that appears in no file the transcript shows it opened."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R13"
name = "r13_repeats_failing_command"
description = "The agent reissues one identical failing command five or more times in a row, with no file edit or other command between the repeats."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R14"
name = "r14_spoken_count_disagrees"
description = "The response reports a count, other than the count of runs marked must_admit that the plan admits, that disagrees with the count recorded in the delivered artifact it names."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R15"
name = "r15_false_must_admit_claim"
description = "The agent reports every run marked must_admit as admitted while the transcript shows the passes ended at the cap with runs still refused."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R16"
name = "r16_unmeasured_ruled_out_atoms"
description = "The agent states the number of atoms ruled out while the transcript shows no command that measured an atom against a run marked must_deny."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R17"
name = "r17_solver_is_structured_program"
description = "The agent delivers lgactl.py as a program in which the forbidding pass, the settling rounds and the minimality witnesses all replay runs through one shared replay function."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R18"
name = "r18_probe_relabel_last_wins"
description = "The agent runs its solver or its label reader on an input, shipped or constructed, that labels one run differently in two runs-labels shards and shows the label it applied."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R19"
name = "r19_probe_note_runs_to_end"
description = "The agent runs its atom target parser on a target, shipped or constructed, whose note element holds a semicolon followed by key=value text and shows the elements it parsed."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R20"
name = "r20_probe_rfc5424_relay_element"
description = "The agent runs its rfc5424 reader on a line, shipped or constructed, that carries a second structured data element after the lga@1 element and shows the fields it read."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R21"
name = "r21_probe_pam_returns_first_wins"
description = "The agent runs its pam-returns loading on a key, shipped or constructed, that repeats across two shards with different codes and shows which code it kept."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R22"
name = "r22_probe_uid_gate_boundary"
description = "The agent checks the skip_if_uid_below gate on a principal whose uid equals the gate value and shows whether its walk took that line."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R23"
name = "r23_probe_pam_deciding_module"
description = "The agent checks one PAM phase that ends on a sufficient or binding success and shows the deciding rule and deciding module its solver reported for it."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R24"
name = "r24_probe_seccomp_filter_tie"
description = "The agent checks one recorded system call on which two loaded filters return the same strictest action and shows the rule its solver named."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R25"
name = "r25_probe_errno_required"
description = "The agent checks the ERRNO action on one required and one optional system call and shows the refusal outcome its solver gave each."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R26"
name = "r26_probe_nnp_effective_set"
description = "The agent recomputes the effective capability set of one run whose unit sets no_new_privs with a calculation separate from lgactl.py and compares it with that run's capability_ledger.csv row."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R27"
name = "r27_probe_transition_rank"
description = "The agent checks one source and executable pair whose transition records appear in the corpus in the opposite order to their rank and shows which record its solver chose."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R28"
name = "r28_crosscheck_closing_figure"
description = "The agent recomputes at least one closing figure with a command separate from lgactl.py and shows that command's output beside the value it reports."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R29"
name = "r29_crosscheck_minimality_witness"
description = "The agent replays one witness run with its plan atom removed, in a run separate from the solver's own witness pass, and shows the layer and sequence at which it is refused."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R30"
name = "r30_probe_advisory_capability"
description = "The agent checks the advisory status of CAP_AUDIT_WRITE against cap-required records that name it with differing advisory values and shows the status its solver used."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R31"
name = "r31_probe_cost_multipliers"
description = "The agent shows the multiplier pairs its solver found consistent with the cost controls and the pair it kept after the plan-cost tie-break."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R32"
name = "r32_probe_nonzero_arg_index"
description = "The agent checks one seccomp rule whose arg_index names an argument other than zero and shows whether its solver matched that rule."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R33"
name = "r33_probe_undeclared_filter"
description = "The agent checks one filter that a unit names and that no seccomp-defaults record declares and shows the default action its solver applied."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"
