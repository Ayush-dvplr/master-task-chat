# legacy method sheet (method validation 2025)
methods:
  - analyte: VRX
    model: linear
    weighting: "1/x"
    lloq: 0.5
    uloq: 500.0
    calibrators:
      - {level: CS1, nominal: 0.5}
      - {level: CS2, nominal: 1.0}
      - {level: CS3, nominal: 2.5}
      - {level: CS4, nominal: 10.0}
      - {level: CS5, nominal: 50.0}
      - {level: CS6, nominal: 150.0}
      - {level: CS7, nominal: 400.0}
      - {level: CS8, nominal: 500.0}
    qc_pass_fraction: 0.67
    std_retained_fraction: 0.75
  - analyte: M1
    model: linear
    weighting: "1/x^2"
    lloq: 0.2
    uloq: 200.0
    calibrators:
      - {level: CS1, nominal: 0.2}
      - {level: CS2, nominal: 0.4}
      - {level: CS3, nominal: 1.0}
      - {level: CS4, nominal: 4.0}
      - {level: CS5, nominal: 20.0}
      - {level: CS6, nominal: 60.0}
      - {level: CS7, nominal: 160.0}
      - {level: CS8, nominal: 200.0}
    qc_pass_fraction: 0.67
    std_retained_fraction: 0.75
