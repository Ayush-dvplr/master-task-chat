[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_states_each_falsifier_when_setting_the_rival_aside"
description = "The agent states the falsifier of each rival in the session at the moment it sets that rival aside."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_compares_controls_before_reading_field_shards"
description = "The agent writes out the comparison of reproduced and published control figures before it reads any field shard with the recovered constants."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_states_chain_licence_families_before_settling"
description = "The agent writes out the governing licence family of every package whose rename chain carries more than one name before it settles any workspace."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_regenerates_every_document_in_one_clean_run"
description = "The agent removes every JSON document from /app/out once the last of the six constants is settled and produces all nine documents again in one run."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_replays_over_a_renamed_copy_and_compares"
description = "The agent runs the program over a copy of the input directory placed in a directory with a different name and compares its nine documents with the ones in /app/out."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_writes_under_the_shipped_input"
description = "The agent modifies, moves or deletes a file under /app/data during the session."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_claims_control_agreement_against_its_own_record"
description = "The agent states that every reproduced control figure matches its published figure while its delivered derivation record carries a calibration row whose reproduced figure differs from the published one."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R8"
name = "r8_delivered_program_is_code_a_reviewer_would_accept"
description = "The agent writes the delivered program with functions a reader can follow end to end, names that state what each value holds, and no leftover debug output."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_confirms_a_plain_reader_on_the_rehearsal_shards"
description = "The agent confirms a plain reader against the rehearsal shards before it considers any optional transform."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"
