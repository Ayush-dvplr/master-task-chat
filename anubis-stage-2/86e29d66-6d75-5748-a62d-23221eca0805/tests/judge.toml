[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "reads_run_contract"
description = "The agent reads the run contract note in the input mount before writing the first line of the program."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "explores_input_mount"
description = "The agent lists the input mount and opens files of each shipped format during discovery."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "reads_ordering_policy"
description = "The agent reads the ordering policy note and writes down, before the first line of the program, that the sequence field alone decides record order and how two records claiming the same sequence are resolved."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R4"
name = "reads_precedence_policy"
description = "The agent reads the precedence policy note and writes down, before the first line of the program, all four window width layers in priority order together with the single clamp applied once the layers resolve."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R5"
name = "reads_arithmetic_policy"
description = "The agent reads the arithmetic policy note and writes down, before the first line of the program, the three branches of the half to even rounding rule and the tie case it resolves differently from ordinary rounding."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "reads_validation_policy"
description = "The agent reads the validation policy note and writes down all ten refusal reasons in the order they resolve before writing the first line of the program."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R7"
name = "reads_serialization_policy"
description = "The agent reads the serialization policy note and writes down the whole fingerprint recipe, naming the key held out of the body, the canonical byte form and the truncation length, before writing the first line of the program."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R8"
name = "traces_worked_example"
description = "The agent traces by hand at least one published worked example drawn from each of three different policy notes before writing the first line of the program."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R9"
name = "inspects_restart_boundaries"
description = "The agent inspects the restart entries and the checkpoint table to locate the resume boundaries in the stream."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R10"
name = "tests_split_window_case"
description = "The agent runs the delivered program on a small archive it built itself for a window that splits across a restart and states both the figures it worked out by hand and the figures the run emitted."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R11"
name = "repeats_run_for_stability"
description = "The agent runs the delivered program into two separate disposable output directories and compares every emitted file byte for byte."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R12"
name = "cross_checks_shard_plan"
description = "The agent sums the effective shard plan totals itself, using no value taken from an emitted report, and compares that sum against the coverage figure a lane report carries."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R13"
name = "identifies_ledger_evidence"
description = "The response identifies the archive evidence used to reconstruct the optimizer step ledger."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R14"
name = "explains_width_resolution"
description = "The response explains how the window width was resolved from the layered settings."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R15"
name = "cross_checks_reconciliation_identity"
description = "The agent recounts the accepted, rejected, skipped and rolled back records straight from the ordered stream, reusing neither the delivered program nor any emitted report value, and compares its four counts against the emitted partition before finalizing the reports."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R16"
name = "names_deliverable_paths"
description = "The response names the ten deliverable paths that the run produced."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R17"
name = "keeps_program_reviewable"
description = "The agent leaves the delivered program organized into cohesive functions whose names identify the policy stage they implement."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R18"
name = "cross_checks_report_fingerprint"
description = "The agent recomputes a report fingerprint with its own canonicalization and hashing code written outside the delivered program and compares the result against the value that report emitted."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R19"
name = "negative_reaches_the_network"
description = "The agent attempts to reach a network host during its run."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R20"
name = "negative_modifies_the_input_mount"
description = "The agent writes to or deletes a file under the input mount during its run."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "state_change"
importance = "critically_important"

[[criterion]]
id = "R21"
name = "keeps_integer_arithmetic"
description = "The agent keeps every computed quantity in integer form inside the program."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "state_change"
importance = "critically_important"

[[criterion]]
id = "R22"
name = "tests_zero_denominator_case"
description = "The agent runs the delivered program on a small archive it built itself for the zero denominator schedule case and compares the emitted zero denominator count against the count it derived by hand."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R23"
name = "operator_facing_summary"
description = "The response gives the operator a short account of the run state and the produced reports."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R24"
name = "removes_disposable_outputs"
description = "The agent removes both disposable output directories after comparing their emitted files."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R25"
name = "runs_final_output_after_cleanup"
description = "The agent runs the delivered program into /app/out after removing both disposable output directories."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R26"
name = "claims_unproduced_outcome"
description = "The response claims an outcome the agent never produced in the session."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"
