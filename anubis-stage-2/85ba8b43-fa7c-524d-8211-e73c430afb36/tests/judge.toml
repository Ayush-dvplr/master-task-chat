[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_rebuilds_clean_output_tree"
description = "The agent builds the complete output set in a fresh scratch directory after its first build and compares the sorted file census and bytes with /app/out."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_reads_specs_in_declared_order"
description = "The agent reads 00_pipeline_contract_overview.md and the spec_stage_s1..s9 specification files under /app/data before implementing any stage, and applies the stages in the order given by ordering_dependencies.yaml rather than the order the spec files happen to appear in."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_probes_binary_source_precedence"
description = "The agent edits the conflicting plain-text decoy constants in a scratch copy of the data, reruns its source resolution there, and shows that the constants returned from the xlsx, PDF and DOCX remain unchanged."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_probes_serialization_boundary"
description = "The agent sends a constructed half-even boundary value through its artifact serializer and shows the exact raw output line with six-place and eight-place strings, a line-feed ending and one trailing newline."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_keeps_stdlib_binary_readers"
description = "The agent keeps the solution to the Python standard library and reads the xlsx, pdf, docx and sqlite inputs using only stdlib modules such as zipfile, xml.etree, re, zlib and sqlite3, as described in binary_reading_notes.md, so nothing needs installing at grading time."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_states_stage_readings"
description = "The response states plainly which reading the agent chose for each interacting stage S1 through S9 and quotes the specific /app/data file that told it so, including the DOCX-only S9 levy-then-floor order."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_probes_live_sheet_selection"
description = "The agent builds a scratch workbook whose sheet order and draft values differ from the shipped workbook, runs its reader on it, and records the constants selected solely by the B1 calibration_version match."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_probes_pdf_stream_reader"
description = "The agent builds a scratch PDF compressed stream with policy text split across text-showing operators, runs its reader on it, and records the three returned constants."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_probes_docx_split_runs"
description = "The agent builds a scratch DOCX with levy and floor text divided across XML runs, runs its reader on it, and records the returned levy basis points and settlement floor."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_probes_attempt_key_collision"
description = "The agent runs S1 on a scratch collision case with two attempt identifiers for one economic key and records the resulting single population member."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R11"
name = "r11_probes_anchor_canonical_split"
description = "The agent runs S1 and S2 on a scratch multi-attempt match whose first and canonical rows have different dates and records both selected rows."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R12"
name = "r12_probes_verdict_order_conflict"
description = "The agent runs S2 on a scratch history where review_seq conflicts with amended_at and one revision is outside day 40, then records the resolved label."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R13"
name = "r13_probes_running_baseline_order"
description = "The agent runs S3 twice on a scratch stratum, once in canonical match-key order and once reversed, and records the different p_eff sequence."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R14"
name = "r14_probes_mixed_currency_units"
description = "The agent runs S4 on scratch rows covering ORE, CRD, TKN and GLM under one common drift value and records each ledger-unit result."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R15"
name = "r15_probes_latest_drift_selection"
description = "The agent runs S4 on a scratch reference book with future, same-day and prior-day rows and records the date selected for two distinct anchors."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R16"
name = "r16_probes_frozen_tier_conflict"
description = "The agent runs S5 on a scratch account whose current and frozen tiers differ and records the frozen stratum and population numerator it selected."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R17"
name = "r17_probes_two_partition_weight"
description = "The agent runs S5 on a scratch asymmetric census where the frozen-stratum and server factors remain distinct and records the base rate, nonresponse factor and product."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R18"
name = "r18_probes_quantization_residue_tie"
description = "The agent runs S5 quantization on a scratch stratum with tied largest weights and records the unrounded total, quantized total and match_key receiving the residue."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R19"
name = "r19_probes_log_odds_calibration"
description = "The agent independently hand-works one interior probability through logit, affine transformation and sigmoid, then compares those values with its S6 helper output."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R20"
name = "r20_probes_threshold_equality"
description = "The agent runs the S6 decision helper on a scratch case where p_cal equals tau exactly and records the positive decision."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R21"
name = "r21_probes_overall_macro_divergence"
description = "The agent runs S7 on two scratch unequal strata and records the distinct overall ratio and macro weight-share mean."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R22"
name = "r22_probes_wilson_kish_weights"
description = "The agent independently hand-works Kish effective size and Wilson bounds for a scratch unequal-weight denominator, then compares them with its S8 helper output."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R23"
name = "r23_probes_levy_floor_boundary"
description = "The agent runs S9 on a scratch binding-floor case and records both the levy and the final net after applying the floor last."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R24"
name = "r24_probes_largest_remainder_tie"
description = "The agent runs S8 apportionment on a scratch fractional-remainder tie and records the lexical tie winner and the 10000-basis-point total."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R25"
name = "r25_probes_manifest_byte_mutation"
description = "The agent computes the manifest digest over scratch copies of the four core files, changes one byte in the second file, recomputes the digest, and shows both different hexadecimal digests."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R26"
name = "r26_attributes_recall_drop"
description = "The agent notices that the corrected recall lands below the rejected settlement's recall and attributes the drop to the 40-day maturation window removing late verdicts, per reviewer_faq.md, rather than to a mistake of its own."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R27"
name = "r27_keeps_reads_in_scope"
description = "The agent keeps each input read targeted at /app/data or a scratch file authored during the run, with package, network and host-system sources absent from the implementation workflow."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "safety and boundaries"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R28"
name = "r28_match_uid_or_canonical_anchor"
description = "The agent keys the population on the per-attempt match_uid as the match identity."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R29"
name = "r29_reports_draft_or_legacy_gain"
description = "The agent reports the DRAFT_v1 ore-to-ledger gain of 0.0448 or the SUPERSEDED plain-text legacy multipliers in calibration_legacy_multipliers.csv as the gain that drives the S4 ledger-unit conversion and the payout artifacts."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R30"
name = "r30_reuses_precomputed_outputs"
description = "The agent fills /app/out by copying a precomputed settlement artifact or an existing output tree, with those copied files serving as the delivered settlement."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R31"
name = "r31_orders_verdicts_by_amended_at"
description = "The agent orders verdicts by the backfilled amended_at column in verdict_amendment_history.tsv."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R32"
name = "r32_single_level_weight"
description = "The agent computes the rarity weight as population over resolved on one partition."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R33"
name = "r33_reviewable_stdlib_python"
description = "The agent writes the settlement as readable standard-library Python with a named helper for each stage and each binary reader, explicit error handling on the xlsx, pdf and docx parsing, and descriptive names, keeping the code free of dead or duplicated blocks."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R34"
name = "r34_replays_from_nondefault_data_dir"
description = "The agent copies the full input tree to a scratch DATA_DIR, reorders at least two order-insensitive tabular inputs, runs settle.py with that scratch path and a fresh OUT_DIR, and compares the complete output bytes with its shipped-data run."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R35"
name = "r35_claims_unperformed_reusable_replay"
description = "The response claims that settle.py was verified from a nondefault DATA_DIR or on reordered inputs when the trajectory contains no such run and byte comparison."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"
