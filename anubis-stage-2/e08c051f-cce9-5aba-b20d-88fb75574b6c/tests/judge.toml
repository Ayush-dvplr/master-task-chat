[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_states_blocked_value_usd_cents"
description = "The response states that the collateral blocked events sum to -13292764300 settled USD cents."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "r2_states_blocked_counterparties"
description = "The response states that 164 distinct counterparties had at least one collateral blocked event."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_states_carry_forward_rate_events"
description = "The response states that 395 accepted events took a rate from an earlier date."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_states_day_shift_events"
description = "The response states that 2109 accepted events have a settlement date that differs from the date written in their own trade_ts."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_states_corrected_events"
description = "The response states that 710 distinct event ids had at least one correction applied."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_states_half_cent_events"
description = "The response states that 680 accepted events had a money product that landed exactly on the half cent."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R7"
name = "r7_states_underwater_counterparties"
description = "The response states that 16 counterparties open below their own segment collateral floor."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_states_uncatalogued_stock_grams"
description = "The response states that the inventory rows whose sku is absent from the product catalogue sum to 685349 on hand grams."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_states_stale_link_refunds"
description = "The response states that 105 accepted refunds carry a sale_event_id that names a sales row that was skipped as malformed."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_interleaves_acceptance_with_the_running_balance"
description = "The agent settles each counterparty in one pass that carries the running balance forward while it decides acceptance of each event in turn."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R11"
name = "r11_reads_the_policy_constants_from_the_policy_file"
description = "The agent reads policy.ini and takes its contract constants from that file."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R12"
name = "r12_builds_money_as_one_exact_decimal_expression"
description = "The agent builds each money figure as one exact decimal expression and quantizes it a single time at the final step."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R13"
name = "r13_inspects_every_input_file_before_designing"
description = "The agent inspects every input file in the directory and the written contract before it designs the pipeline."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R14"
name = "r14_runs_the_transform_with_explicit_directories"
description = "The agent runs the transform entry point with an explicit input directory and output directory during the session."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R15"
name = "r15_verifies_against_a_reordered_second_corpus"
description = "The agent verifies the pipeline against a second copy of the book whose rows have been reordered before finishing."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R16"
name = "r16_names_where_each_artifact_was_written"
description = "The response names where each produced artifact was written."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R17"
name = "r17_repeats_one_command_that_returns_the_same_error"
description = "The agent runs one command that returns the same error on three or more consecutive turns."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R18"
name = "r18_states_a_closing_figure_that_contradicts_its_own_run"
description = "The agent states a closing report figure that differs from the value its own pipeline produced during the session."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R19"
name = "r19_writes_the_transform_as_reviewable_code"
description = "The agent writes the transform with named helper functions and specific exception types that a Python reviewer would accept."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"
