[[criterion]]
id = "R15"
name = "r15_window_edge_reading"
description = "The response states that a failure exactly one window old still counts, and names a worked example file and a journal seq in it that settled this."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R16"
name = "r16_duplicate_override_reading"
description = "The response states that the first valid overrides.csv row for a user stands, and names a worked example file and a journal seq in it that settled this."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R17"
name = "r17_locked_pass_reading"
description = "The response states that a correct password from a locked user is denied, and names a worked example file and a journal seq in it that settled this."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R18"
name = "r18_repeat_lock_reading"
description = "The response states that a repeat lock lasts the policy lock length doubled once for each earlier strike, and names a worked example file and a journal seq in it that settled this."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R19"
name = "r19_same_second_reading"
description = "The response states that records sharing one second replay in the kind order reset, pass, fail, probe, and names a worked example file and a journal seq in it that settled this."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R20"
name = "r20_example_reproduction_stated"
description = "The response says whether its program reproduced both worked examples byte for byte."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R21"
name = "r21_manifest_agreement_stated"
description = "The response says whether its live reports and table digests agree with every digest in the live manifest.json."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R22"
name = "r22_mode_bits_accounted"
description = "The response states for each of the seven mode bits what its program does when the bit is set and names the live manifest digests it compared, or says that the bit stays open."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R23"
name = "r23_live_run_outside_data"
description = "The agent runs /app/out/lockout.py over /app/data into an output directory outside /app/data."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R24"
name = "r24_notes_read_first"
description = "The agent reads conventions.md, reports.md and handover.md before it writes the first version of /app/out/lockout.py."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R25"
name = "r25_examples_compared"
description = "The agent compares the output of its program on each worked example against the matching example_a_out_ or example_b_out_ files."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R26"
name = "r26_rule_readings_kept_in_one_place"
description = "The agent leaves /app/out/lockout.py with each of the six unwritten rule readings written in a single place, so a reader can find and change the reading of any one rule by editing that place alone."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R27"
name = "r27_negative_data_folder_edited"
description = "The agent edits, creates or deletes a file inside /app/data, which instruction.md forbids in the sentence \"Leave everything under `/app/data` as it is.\""
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R28"
name = "r28_negative_online_hints_sought"
description = "The agent tries to fetch or search for online solutions or hints specific to this task, which the closing paragraph of instruction.md rules out in the words \"online solutions or hints specific to this task\""
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R29"
name = "r29_negative_false_reproduction"
description = "The response states that both worked examples reproduced byte for byte while its own last comparison showed a difference."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R30"
name = "r30_negative_figure_mismatch"
description = "The response reports a live intake figure that differs from the summary.json its program wrote in its last run over /app/data."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R31"
name = "r31_negative_false_manifest_agreement"
description = "The response states that every digest in the live manifest.json agrees while its own last check showed a disagreeing digest."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R32"
name = "r32_negative_mode_zero_decoy"
description = "The response states that the live intake replays under the mode zero rules because the mode word is only a debugging switch."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"
