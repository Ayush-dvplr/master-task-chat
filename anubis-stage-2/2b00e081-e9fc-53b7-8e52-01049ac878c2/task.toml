schema_version = "1.4"
artifacts = ["/app/out/lockout.py"]

[task]
name = "terminal-bench/2b00e081-e9fc-53b7-8e52-01049ac878c2"
version = "1.0.0"
description = "Rebuild a lost login lockout journal replay tool from two worked examples: screen a damaged authentication attempt journal, replay passes, failures, resets and probes against a lockout policy, per user overrides and a previous lock table, and recover six unwritten rules (lock end, the failure window edge, duplicate overrides, locked passes, repeat lock length and same second ordering) and seven undocumented mode bits from the live manifest digests, as one program that generalizes to unseen journals."
keywords = ["authentication", "account-lockout", "journal-replay", "brute-force", "rule-recovery"]
authors = [{ name = "Harshank Kanungo", email = "harshank.kanungo1992@ethara.ai" }, { name = "Sugam Agrawal", email = "sugam.agrawal@ethara.ai" }]

