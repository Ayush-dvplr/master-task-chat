[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_settle_py_stdlib_single_file"
description = "The agent delivers /app/out/settle.py as one self contained file whose imports are drawn from the Python standard library alone."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_two_runs_byte_identical"
description = "The agent runs /app/out/settle.py twice over one data directory and compares the two output directories to confirm the bytes match."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_traps_checklist_walkthrough"
description = "The agent reads /app/data/known_traps_and_footguns.md and works through it as a checklist, confirming its settlement against the entries rather than leaving the file unopened."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_ration_worked_example"
description = "The agent reproduces the four row worked example in /app/data/rationing_iteration_notes.md, reaching the allocation 298, 262, 100 and 40 against a budget of 700, before applying its own ration to the papers."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_closing_note_constant_sources"
description = "The response closing note attributes each operating constant it used to its source, naming the binding workbook sheet with the rule that chose it, the four memo scalars with the stage each one governs, and the directive clause that decides a contested aperture with what it overturns."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_closing_note_counts"
description = "The response closing note reports the pass budget its ration used on the largest aperture period with the derivation of that budget, the count of passes admitted and the count that survived contention."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_workbook_binding_sheet"
description = "The agent opens the binary workbook /app/data/aperture_contract_workbook.xlsx, finds the three revision sheets it holds, and selects REV4_LIVE by applying the binding_status and highest sheet_revision rule that /app/data/workbook_sheet_selection.json states."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R8"
name = "r8_cap_and_budget_from_workbook"
description = "The agent reads per_contact_cap_kib and period_budget_kib out of the binding sheet of /app/data/aperture_contract_workbook.xlsx rather than assuming a value for either."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R9"
name = "r9_commit_lead_from_memo"
description = "The agent extracts the per station commit lead from the binary memo /app/data/network_operations_memo.pdf and places each commit boundary at the scheduled start of the pass less the lead of its own station."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R10"
name = "r10_ration_budget_terms_from_memo"
description = "The agent extracts ration-pass-budget-base and ration-pass-budget-ceiling from /app/data/network_operations_memo.pdf and derives the pass budget of an aperture period as the smaller of the ceiling and the base added to the count of rows that survived contention there."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R11"
name = "r11_directive_clause_two_inversion"
description = "The agent reads clause two of the binary directive /app/data/precedence_directive.docx and states the inversion it creates, which is that a protected pass outranks an unprotected pass carrying a stronger priority class."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R12"
name = "r12_commit_protection_two_facts"
description = "The agent prints the event_recorded_s it read and the authority_grade row it read from the grade_authority table of /app/data/reference_lookups.sqlite, and states that both facts hold for the pass whose commit it protects."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R13"
name = "r13_rate_piece_floors"
description = "The agent prints the eligible interval of a pass split at the rate schedule edges of its aperture together with the floored KiB of each piece, naming the rate_scale_divisor it applied to each piece on its own."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R14"
name = "r14_ration_minimum_movement"
description = "The agent prints the ration row that reaches its demand on a movement of one unit and the share figure of a later pass before and after the pinning that movement triggers."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R15"
name = "r15_ration_fixed_offer_rounds"
description = "The agent states the count of offer rounds the memo terms fix and prints the allocation figure its ration carried at the close of each round."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R16"
name = "r16_opening_backlog_at_stage_nine"
description = "The agent prints the demand figure it drew at stage S09 beside the opening backlog report row it came from, and the acceptance figure at stage S10 beside the falling backlog figure it came from."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R17"
name = "r17_executed_amendment_revision"
description = "The agent prints the revision_seq of each amendment row it read for one contract period from /app/data/contract_terms_amendments.tsv and names the executed row it took as the settled terms."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R18"
name = "r18_open_carry_buckets_only"
description = "The agent lists the buckets it read for one contract from /app/data/prior_period_settlement.json with the bucket_state of each and prints the sum of the open buckets it carried forward."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R19"
name = "r19_accounting_calendar_split"
description = "The agent prints the half open window it folded for one station period from /app/data/station_accounting_calendar.csv and the canonical ledger row it emitted for each period that a boundary crossing pass reaches."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R20"
name = "r20_outage_leaves_utilisation_standing"
description = "The agent leaves the utilisation figures that stage S11 froze standing when stage S13 waives a shortfall for a qualifying outage."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R21"
name = "r21_settle_py_reads_only_data_dir"
description = "The agent confines /app/out/settle.py to reading the directory given by the data flag."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R22"
name = "r22_settle_py_writes_only_out_dir"
description = "The agent confines /app/out/settle.py to writing into the directory given by the out flag."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R23"
name = "r23_settle_py_parameters_per_run"
description = "The agent has /app/out/settle.py read every parameter it needs out of the data directory on each run, including the figures held in the spreadsheet, the memo and the directive."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R24"
name = "r24_closing_note_waived_shortfall"
description = "The response names one contract period whose shortfall the settlement waived and the accepted outage claim whose overlap carried that contract period past the qualifying floor."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R25"
name = "r25_settle_py_code_quality"
description = "The agent leaves /app/out/settle.py as code a reviewer would accept, with names that say what each part is, no dead or commented out blocks, no debug print, and no error silently swallowed."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R26"
name = "r26_writes_under_data_dir"
description = "The agent writes to a file under /app/data during its run."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R27"
name = "r27_double_charged_pass"
description = "The agent charges an accepted pass of a mission holding two contracts to both of them, so one accepted volume draws on two allowances."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R28"
name = "r28_averaged_station_utilisation"
description = "The agent averages the utilisation basis points of the apertures of a station to produce that station figure."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R29"
name = "r29_reported_kib_as_delivered"
description = "The agent reports the reported_kib column of /app/data/downlink_reports.csv as a delivered volume, treating the reporting systems as authoritative over the canonical ledger."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"
