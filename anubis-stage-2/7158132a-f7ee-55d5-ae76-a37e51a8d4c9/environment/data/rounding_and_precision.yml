# precision rule per stage and quantity
# every value is truncated toward negative infinity at the stage
# boundary named here, before the next stage reads it
policy: floor_at_stage_boundary
float_arithmetic: forbidden
stage_rules:
  S01: floor_at_stage_boundary
  S02: floor_at_stage_boundary
  S03: floor_at_stage_boundary
  S04: floor_at_stage_boundary
  S05: floor_at_stage_boundary
  S06: floor_at_stage_boundary
  S07: floor_at_stage_boundary
  S08: floor_at_stage_boundary
  S09: floor_at_stage_boundary
  S10: floor_at_stage_boundary
  S11: floor_at_stage_boundary
  S12: floor_at_stage_boundary
  S13: floor_at_stage_boundary
  S14: floor_at_stage_boundary
quantity_rules:
  S04_eligible_seconds: floor_at_stage_boundary
  S05_raw_capacity_kib: floor_at_stage_boundary
  S05_usable_capacity_kib: floor_at_stage_boundary
  S09_demand_kib: floor_at_stage_boundary
  S09_allocated_kib: floor_at_stage_boundary
  S10_accepted_kib: floor_at_stage_boundary
  S10_deferred_kib: floor_at_stage_boundary
  S10_unused_capacity_kib: floor_at_stage_boundary
  S08_carry_in_kib: floor_at_stage_boundary
  S08_carry_out_kib: floor_at_stage_boundary
  S08_carry_forfeit_kib: floor_at_stage_boundary
  S13_shortfall_kib: floor_at_stage_boundary
  S13_unused_reserved_kib: floor_at_stage_boundary
  S13_shortfall_debit_mcr: floor_at_stage_boundary
  S13_unused_credit_mcr: floor_at_stage_boundary
  S13_outage_credit_mcr: floor_at_stage_boundary
  S13_net_mcr: floor_at_stage_boundary
  S11_utilisation_bp: floor_at_stage_boundary
  S11_occupied_seconds: floor_at_stage_boundary
  S11_available_seconds: floor_at_stage_boundary
