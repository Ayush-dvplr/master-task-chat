# Feature lineage. Each node lists the nodes it is computed from.
# Leaf nodes are the evidence sources an incident can quarantine.
nodes:
  lockbox: []
  card: []
  ledger: []
  returns: []
  leases: []
  relief: []
  bureau_kr: []
  bureau_nd: []
  limits: []
  merges: []
  crm: []
  cash: [lockbox, card, ledger, returns]
  schedule: [leases, relief]
  delinquency: [cash, schedule]
  exposure: [schedule, merges]
characteristics:
  dpd_now: [delinquency]
  max_dpd_12m: [delinquency]
  recent_worst: [delinquency]
  months_on_book: [leases]
  utilisation: [exposure, limits]
  bureau: [bureau_kr, bureau_nd, crm]
  active_leases: [merges]
  sector_class: [crm]
