type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R29"
name = "r29_draft_or_legacy_values"
description = "The agent normalizes with certified values read from the RM_Certified_DRAFT or RM_Legacy_2019 sheet of reference_workbook.xlsx."
