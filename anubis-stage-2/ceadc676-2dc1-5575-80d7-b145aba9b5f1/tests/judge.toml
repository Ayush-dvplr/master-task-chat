[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_pdf_rows_by_y"
description = "The agent rebuilds each table row of governance_memo.pdf from the text objects of one page that share a y coordinate."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "r2_pdf_string_tokenizer"
description = "The agent tokenizes the memo content streams so that BT and ET count as operators only outside string literals."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "r3_pdf_octal_escapes"
description = "The agent decodes a backslash followed by three octal digits inside a memo literal string as one character."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R4"
name = "r4_rich_text_runs"
description = "The agent joins the text of every rich-text run of a shared string item in the workbook."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R5"
name = "r5_sheets_through_rels"
description = "The agent maps each sheet name of reference_workbook.xlsx to its part file through the relationship ids of xl/_rels/workbook.xml.rels."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R6"
name = "r6_reads_table_status"
description = "The agent reads the status at the end of each memo table title before it takes values from that table."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R7"
name = "r7_views_catalog_events"
description = "The agent views the ingest_catalog.json events of the file ma_5gw1.md before it writes its catalog replay."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R8"
name = "r8_views_audit_entries"
description = "The agent views the reintegration_audit.db entries 7157 and 7161 before it writes its revision admission rule."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R9"
name = "r9_views_skip_lines"
description = "The agent views the autosampler_events.txt lines AS-4235 and AS-4238 before it writes its tray mapping."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R10"
name = "r10_views_journal_chain"
description = "The agent views the tray_corrections.ndjson entries 491, 494 and 497 of SQ-2611-06 tray 41 before it writes its journal settlement."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R11"
name = "r11_lists_qcx_rows"
description = "The agent lists every material_alias row of alias_register.sqlite whose token is QCX together with its valid_from date."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R12"
name = "r12_checks_repeated_hour"
description = "The agent checks the xr_07ka.csv times of SQ-2611-07 that fall between 02:00 and 03:00 on 2026-10-25 against the transitions of site_clock.yaml."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R13"
name = "r13_views_pause_rows"
description = "The agent views the PAUSE and RESUME rows that session_events.psv holds for SQ-2611-03."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R14"
name = "r14_lists_linearity_sessions"
description = "The agent lists the linearity sessions with their instrument and local session date before it assigns linearity slopes."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R15"
name = "r15_prints_fit_residuals"
description = "The agent prints the per-point residuals of at least one normalization fit while it develops its screening loop."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R16"
name = "r16_views_session_rulings"
description = "The agent views every memo Table R-1 ruling that targets SQ-2611-16 before it settles the decision of that session."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R17"
name = "r17_drift_material_vs_q1"
description = "The agent checks the profile drift_material against the materials of memo Table Q-1 before it builds the QC acceptance checks."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R18"
name = "r18_rounding_checked_on_h15_examples"
description = "The agent checks its rounding code against the three worked examples of handbook H15, which round 2.0345 and 2.0355 at 3 decimals and the mean of 1.244 and 1.246 at 2 decimals."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R19"
name = "r19_exact_grubbs_compare"
description = "The agent decides each Grubbs removal by an exact comparison of the statistic with the memo Table G-1 value."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R20"
name = "r20_traces_published_defect"
description = "The agent traces at least one published value that differs from its recomputed value back to the input reading or correction stage that moves it."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R21"
name = "r21_variant_batch_run"
description = "The agent runs its program on at least one batch it built by changing a shipped input file such as analysis_profile.yml or site_clock.yaml."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R22"
name = "r22_ran_after_last_edit"
description = "The agent runs /app/out/run_irms.py with /app/data and /app/out after its last edit of the program."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R23"
name = "r23_clean_output_dir"
description = "The agent leaves /app/out holding only run_irms.py and the twenty-two files the instruction names."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R24"
name = "r24_code_error_handling"
description = "The agent writes run_irms.py free of bare except clauses and of except blocks whose body is only pass."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R25"
name = "r25_final_defects_paired"
description = "The response pairs each published-run defect it lists with a handbook rule number or a memo table id."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R26"
name = "r26_final_tables_set_aside"
description = "The response names memo Tables N-1, Q-0 and G-0 as tables it set aside."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R27"
name = "r27_final_draft_sheet"
description = "The response names the hidden RM_Certified_DRAFT sheet of reference_workbook.xlsx as set aside."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R28"
name = "r28_final_files_set_aside"
