[task]
name = "terminal-bench/f5fe93be-3ce1-5eb6-a1f5-8c4a8ea80703"
version = "1.0.0"
description = "Reconcile five broadcast channel weeks frame accurately: convert drop frame and non drop timecode across zones and summer time, decide what went to air from the switcher program bus with failover between two playout chains and a skewed backup clock, resolve copy aliases, apply versioned traffic corrections under a close cutoff, settle three undocumented rules from prior close decisions, then clamp recurring commitments, allocate make-goods into spare break capacity and bill in cents. Ship a fast stdlib reconciler that reproduces the contract on unseen workloads within a time budget."
keywords = ["video-processing", "broadcast-playout", "smpte-timecode", "drop-frame", "as-run-reconciliation", "performance", "stdlib"]
authors = [{ name = "Shubhi Goyal", email = "shubhi.goyal.int@ethara.ai" }, { name = "Sugam Agrawal", email = "sugam.agrawal@ethara.ai" }]
