[task]
name = "terminal-bench/f2d019d0-09e4-59cc-861f-17669833e43e"
version = "1.0.0"
description = "Replay a mixture of experts training run against its written contracts, diagnose the compiled cache storm and the host memory growth the deployed orchestrator produced, recover two sealed policy decisions by enumeration, and settle the capacity and dynamic shape configuration the run should have used."
keywords = [
  "mixture-of-experts",
  "torch-compile",
  "dynamic-shapes",
  "recompilation",
  "cuda-graphs",
  "expert-parallel",
  "capacity-factor",
  "training",
]
authors = [{ name = "Aditya Joshi", email = "aditya.joshi@ethara.ai" },  { name = "Dinshi Jain", email = "dinshi.jain@ethara.ai" }]

[metadata]
category = "Model Training"
platforms = ["linux/amd64", "linux/arm64"]
tags = [
  "model-training",
  "compiler-guards",
  "numerical-contract",
  "settlement",
  "deterministic-replay",
]
estimated_duration_sec = 28800.0
expert_time_estimate_min = 900.0
junior_time_estimate_min = 3000.0
null_floor = 0.0
discrimination_weight = 1.0

[verifier]
timeout_sec = 7200.0
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[agent]
timeout_sec = 28800.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.z.ai"]
user = "1000:1000"

[environment]
build_timeout_sec = 900.0
network_mode = "no-network"
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
mcp_servers = []
