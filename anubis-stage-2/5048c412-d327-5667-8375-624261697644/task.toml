[task]
name = "terminal-bench/5048c412-d327-5667-8375-624261697644"
version = "1.0.0"
description = "Balance the stored water of four closed reservoir basins by an iterative storage balance with damping, patience halving, mass-conserving closure, stall, budget and cycle exits, then account canal conveyance losses by licence segment from the balanced storages. The work is exact integer and rational arithmetic over a station register sharded across sqlite, xml, binary and csv sources with revisions, method constants in xlsx, pdf and docx containers, and a reusable stdlib program that reproduces thirty-one reports on unseen extracts."
keywords = ["hydrology", "reservoir", "iteration", "fixed-point", "rounding", "python", "stdlib"]
authors = [{ name = "Aditya Jain", email = "aditya.jainint17@ethara.ai" }, { name = "Poonam Chourey", email = "poonam.chourey@ethara.ai" }]

