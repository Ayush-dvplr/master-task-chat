[[criterion]]
id = "R29"
name = "figure_loss_outside_north_given"
description = "The response gives the conveyance loss of the net gaugings outside the North basin on the shipped extract, with its parts in the South, West and East basins; this serves instruction.md: \"State the total conveyance loss in kilolitres of the net gaugings outside the North basin, with its part in each of the South, West and East basins, and the difference in megalitres between the largest and the smallest balanced storage of the West basin.\" The values of the figures belong to neg_figure_differs_from_print."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R30"
name = "figure_west_storage_spread_given"
description = "The response gives the difference between the largest and the smallest balanced storage of the West basin on the shipped extract; this serves instruction.md: \"State the total conveyance loss in kilolitres of the net gaugings outside the North basin, with its part in each of the South, West and East basins, and the difference in megalitres between the largest and the smallest balanced storage of the West basin.\" The value of the figure belongs to neg_figure_differs_from_print."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
