[[criterion]]
id = "R24"
name = "figure_above_opening_given"
description = "The response gives the number of reservoirs of the shipped extract whose balanced storage is above their opening storage; this serves instruction.md: \"Then give these figures for the shipped extract\". The value of the figure belongs to neg_figure_differs_from_print."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R25"
name = "figure_public_minus_commercial_given"
description = "The response gives the public segment's conveyance loss minus the commercial segment's on the shipped extract; this serves instruction.md: \"Then give these figures for the shipped extract\". The value of the figure belongs to neg_figure_differs_from_print."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
