[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "ran_on_docx_alternate_or_moved"
description = "The agent runs its program, before finishing, on an extract it built whose sc_k2.docx carries markup-compatibility alternate content (mc:AlternateContent), elements of an ignorable namespace (mc:Ignorable) or tracked moved runs (w:moveFrom and w:moveTo) in its basin operating parameters table, or keeps its main document part under a name other than word/document.xml, forms the shipped document lacks; this serves instruction.md: \"It will also be run on other extracts in the same layout, so nothing in it may depend on this particular season.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "ran_on_reshaped_workbook"
description = "The agent runs its program, before finishing, on an extract it built whose tab_h3.xlsx string items carry phonetic runs (rPh) or whose workbook part has a name other than xl/workbook.xml, forms the shipped workbook lacks; this serves instruction.md: \"It will also be run on other extracts in the same layout, so nothing in it may depend on this particular season.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "ran_on_reshaped_rate_page"
description = "The agent runs its program, before finishing, on an extract it built whose mt_loss.pdf shows its schedule through two content streams of the page or through rows drawn with TJ arrays, forms the shipped page lacks; this serves instruction.md: \"It will also be run on other extracts in the same layout, so nothing in it may depend on this particular season.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R4"
name = "timed_run_at_largest_reach"
description = "The agent times a run of its program on an extract it built with 11 catchments, the largest reach std_pipeline.md states, and the trajectory shows the measured time; this serves instruction.md: \"Each call of the program finishes within 60 seconds.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R5"
name = "enumerated_datums_separately"
description = "The agent enumerates the datum offset assignments that fit sv_survey.csv on the shipped extract by a computation separate from its program, and compares the result with the offsets its program uses; this serves the opening storages every report rests on and the rule that a survey with no fit or two fits stops the program."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R6"
name = "ran_on_dated_and_retired_corrections"
description = "The agent runs its program, before finishing, on an extract it built whose ob_s3.bin, with sv_survey.csv as shipped, holds a correction dated after the survey date or a correction filed under a gauge number that a replacement record retired, cases the shipped meter file lacks; this serves instruction.md: \"It will also be run on other extracts in the same layout, so nothing in it may depend on this particular season.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R7"
name = "ran_on_revisions_past_cutoff"
description = "The agent runs its program, before finishing, on an extract it built whose rv_log.psv holds a revision above the revision cutoff or two applying revisions for one gauging, and compares the net gaugings its program uses with the ones the revision log implies; this serves instruction.md: \"It will also be run on other extracts in the same layout, so nothing in it may depend on this particular season.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R8"
name = "ran_on_meter_rule_break"
description = "The agent runs its program, before finishing, on an extract it built whose ob_s3.bin breaks a meter rule spec_meter.md states (a different magic or version, a checksum that differs from the CRC-32 of the bytes it covers, records that end before or after the checksum, a record of kind 3, a reading or correction with bit 3 set, or a reference past the end of the gauge dictionary as it stands at that record), and the trajectory shows the program's exit status on it; this serves instruction.md: \"When an input breaks a rule the documents state for it, the program stops with an error and writes no report.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R9"
name = "recomputed_figure_independently"
description = "The agent recomputes at least one of the shipped-extract figures the final message reports by a computation separate from its program (a script or command of its own that reads the input files or the program's reports, run apart from the program), and compares the two values; this serves instruction.md: \"Report only figures your own runs printed, and state the size of any check exactly as it printed.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R10"
name = "compared_runs_elsewhere"
description = "The agent runs its final program a second time on the shipped extract or a copy of it (again, from another working directory, on a copy placed in another directory or into another output directory) and compares that run's complete set of reports with the reports of another run byte for byte; this serves instruction.md: \"The reports must be identical across repeated runs, working directories, extract locations and output directories.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R11"
name = "ran_program_alone_in_empty_folder"
description = "The agent copies its program, and no other file, into a newly created empty directory and runs that copy on an extract, and the trajectory shows that run's exit status; this serves instruction.md: \"The program is self-contained and imports nothing from its own folder; only the program and the nine reports named above are collected.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R12"
name = "ran_on_read_only_data"
description = "The agent runs its program on a copy of the extract whose files and directory it has made read-only (for example with chmod), and the trajectory shows that run's exit status; this serves instruction.md: \"The program must leave DATA_DIR untouched, read nothing outside DATA_DIR and its own directory, and write nothing outside OUT_DIR.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R13"
name = "checked_manifest_digests"
description = "The agent computes the SHA-256 digest of at least one text report its program wrote, by a computation separate from its program, and compares it with the digest manifest.json gives for that report; this serves instruction.md: \"Every report follows the layout and form the documents give, exactly: text reports byte for byte, database and workbook reports value for value.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R14"
name = "ran_on_reencoded_meter_file"
description = "The agent runs its program on an extract it built whose ob_s3.bin writes the shipped meter records in other forms spec_meter.md allows (a literal gauge number where the shipped file uses a dictionary reference or the reverse, or an absolute value where it uses a delta or the reverse), and compares those reports with the reports of the shipped run; this serves instruction.md: \"It will also be run on other extracts in the same layout, so nothing in it may depend on this particular season.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R15"
name = "whatif_1_answer_correct"
description = "The response gives what-if 1 (gauging GX51226 with sense nil: the exit and megalitres transferred the East basin reports) the answer: exit stalled, 1276 ML transferred; this serves instruction.md: \"In your final message, give the nine what-if answers.\" Every listed part must be stated with these values; whether the stated value matches what the agent's own run printed belongs solely to neg_figure_differs_from_print."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R16"
name = "whatif_2_answer_correct"
description = "The response gives what-if 2 (gauging GX91323 with sense rev: the exit and megalitres transferred the North basin reports) the answer: exit stalled, 832 ML transferred; this serves instruction.md: \"In your final message, give the nine what-if answers.\" Every listed part must be stated with these values; whether the stated value matches what the agent's own run printed belongs solely to neg_figure_differs_from_print."
