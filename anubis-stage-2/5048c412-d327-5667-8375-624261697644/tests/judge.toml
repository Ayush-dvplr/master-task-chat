[[criterion]]
id = "R23"
name = "whatif_9_answer_correct"
description = "The response gives what-if 9 (the East round_budget 8: the megalitres transferred the East basin reports) the answer: 1310 ML transferred; this serves instruction.md: \"In your final message, give the nine what-if answers.\" Every listed part must be stated with these values; whether the stated value matches what the agent's own run printed belongs solely to neg_figure_differs_from_print."
