name = "whatif_7_answer_correct"
description = "The response gives what-if 7 (every survey row dated in turn from 2026-07-01 to 2026-09-30: the dates of the public segment's smallest conveyance loss, and that loss) the answer: 1027 kL, on every survey date from 2026-08-11 to 2026-08-28 (18 dates); this serves instruction.md: \"In your final message, give the nine what-if answers.\" Every listed part must be stated with these values; whether the stated value matches what the agent's own run printed belongs solely to neg_figure_differs_from_print."
