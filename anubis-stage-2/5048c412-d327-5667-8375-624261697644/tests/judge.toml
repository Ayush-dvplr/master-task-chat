mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R28"
name = "figure_transferred_minus_prior_given"
description = "The response gives the shipped run's total of megalitres transferred minus the figure in the prior balancing summary; this serves instruction.md: \"Then give these figures for the shipped extract\". The value of the figure belongs to neg_figure_differs_from_print."
