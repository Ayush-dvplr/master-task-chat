[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_report_canonical_and_setaside"
description = "The response reports the count of canonical readings and the count of rows set aside under each of the five reasons DR_OUTSIDE_INTERVAL, DR_SESSION_WITHDRAWN, DR_LINK_UNREGISTERED, DR_SELF_LOOP and DR_NO_LOCKED_ATTEMPT."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "r2_report_sheet_key_and_sheet"
description = "The response names the workbook sheet key it matched against the interval header and names the sheet of /app/data/timing_network_workbook.xlsx that carries that key."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "r3_report_tree_edges_order"
description = "The response lists the tree edges of the anchored component in the order they were admitted, each by its link identifier."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R4"
name = "r4_report_cap_values_outcomes"
description = "The response gives the oscillator cap value, the node cap value and the outcome recorded for each of the three capping passes of stage T09."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_report_zero_dispersion_ceiling"
description = "The response names the oscillator whose published dispersion is zero and gives the class ceiling weight it took."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_report_withheld_nodes"
description = "The response names every node whose dissemination was withheld and gives the status recorded for each of them."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_report_excluded_oscillators"
description = "The response lists the oscillators excluded from the ensemble and gives the exclusion reason recorded for each of them."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_report_steering_step_outcome"
description = "The response gives the steering step in atto units and the steering outcome recorded for the interval."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_report_components_role_root"
description = "The response names every component of the link graph with its role and its root node."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_opens_memo_controls"
description = "The agent opens /app/data/network_calibration_memo.pdf and reads OSC_WEIGHT_CAP_NUMERATOR, OSC_WEIGHT_CAP_DENOMINATOR, CAP_SWEEP_BUDGET and HISTORY_MINIMUM_EPOCHS out of it."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R11"
name = "r11_program_code_quality"
description = "The agent writes /app/out/timescale.py as code a reviewer can follow, with errors handled rather than swallowed, names that say what each value holds, and no dead code, duplicated blocks or debug residue left in the file."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R12"
name = "r12_legacy_weight_table"
description = "The agent takes the weight of an oscillator from /app/data/legacy_weight_table.csv, the fixed class scheme the network retired at REG-R09."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R13"
name = "r13_figure_disagrees_artifact"
description = "The response gives a figure for this interval that disagrees with the artifact published under /app/out for that figure."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R14"
name = "r14_false_byte_exact_claim"
description = "The agent claims its delivery is byte exact against a reference publication while its trajectory shows the comparison it names was skipped."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R15"
name = "r15_fills_dead_time"
description = "The agent fills an epoch at which a tree link carries no canonical reading by carrying a reading of that link from another epoch."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R16"
name = "r16_wrong_sheet_value"
description = "The agent reports a control value taken from the workbook sheet whose key cell differs from workbook_sheet_key in /app/data/network_config.json as the value in force for this interval."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "important"
