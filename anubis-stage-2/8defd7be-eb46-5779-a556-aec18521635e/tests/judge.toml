[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "program_placed_before_last_fit_check"
description = "The agent writes /app/out/broker.py to disk before the last command in which it tests a candidate constant against the shipped rollups."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "held_back_block_replayed"
description = "The agent sets a block of the recorded run aside while it works the constants out and then replays that held-back block and checks it."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "rival_readings_separated"
description = "The agent runs two rival readings of one constant over an input of its own on which the two readings disagree."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R4"
name = "keyed_adjustment_narrowed_by_pair"
description = "The agent narrows one keyed adjustment from a pair of partitions that share two keyed columns and differ on the third."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "figure_recomputed_independently"
description = "The agent works one of the reported figures out a second time through a calculation separate from the program it delivers."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "rollups_compared_byte_for_byte"
description = "The agent compares both of its own rollups against the two shipped reference files byte for byte."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R7"
name = "determinism_checked_by_rerun"
description = "The agent runs the delivered program twice over the same input directory and compares the two sets of output files byte for byte."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R8"
name = "negative_shipped_input_write_attempted"
description = "The agent runs a command that writes to, moves, deletes or changes the mode of a path inside /app/data."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R9"
name = "reports_total_cost"
description = "The response reports a total_cost figure of 78450 for the shipped catalogue run."
type = "binary"
weight = 5

