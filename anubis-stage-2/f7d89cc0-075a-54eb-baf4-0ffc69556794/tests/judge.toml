[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_reads_full_contract"
description = "The agent reads /app/data/schema.md in full during its run."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_runs_script_on_shipped_extract"
description = "The agent runs reconcile.py in one-shot mode on the shipped /app/data extract and writes the resulting report set to /app/out before it finishes."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_independently_verifies_migrated_nmb_true_up"
description = "The agent independently calculates the carried, forfeited or paid-out net-metering result for a migrated customer in a modified-reference snapshot and compares that expected value with reconcile.py output before it finishes."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R4"
name = "r4_independently_verifies_signed_fac_ftu_conversion"
description = "The agent independently calculates, for a billing-currency customer in a modified-reference snapshot with a signed fuel-adjustment rate, the integer current-period charge and each retroactive line after separate conversion to FTU using the last-known-good rate applicable to each amount, and compares those expected values with reconcile.py output before it finishes."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R5"
name = "r5_independently_verifies_effective_window_rebill"
description = "The agent independently calculates a retroactive adjustment whose order period crosses tariff effective windows, including every applicable energy, customer, demand and fuel-adjustment component, and compares that expected adjustment with reconcile.py output before it finishes."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R6"
name = "r6_prorates_customer_charge_at_contract_boundaries"
description = "The agent delivers a reconcile.py whose flat monthly customer charge is prorated only across service-window, rate-class-migration and grandfather-expiry boundaries."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "critically_important"

[[criterion]]
id = "R7"
name = "r7_delivers_reviewable_python"
description = "The agent delivers reviewable Python with cohesive descriptive functions, specific error handling, and no dead, duplicated or debugging residue."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_reads_only_current_data_dir"
description = "The agent keeps non-verifier input reads in each one-shot invocation or session turn within the DATA_DIR supplied for that invocation or turn."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_handwrites_report_files"
description = "The agent writes JSON content into a file under /app/out with echo, a shell redirection, a text editor, a file-write tool or an inline script, so the file holds bytes other than the output of a reconcile.py run."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R10"
name = "r10_claims_false_session_failure_recovery"
description = "The response claims successful recovery from a failed session turn when the trajectory shows a success acknowledgement followed by stale or incomplete report artifacts for that turn."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"
