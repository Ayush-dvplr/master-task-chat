[task]
name = "terminal-bench/c18ddb98-789f-5df4-a27d-c4191c08d9ac"
version = "1.0.0"
description = "Close one ingest window of a change data capture platform: recover the five platform properties that were never written down from a published calibration slice, resolve producer identity as at each record, apply a retroactive tombstone rule, designate reserve slots under a constraint system with a single feasible answer, drive the feed quarantine state to its fixpoint, curtail every domain to its curated cap while holding every feed at its retention floor, then settle the curated ledger onto a per octet basis, and emit a mutually consistent set of artifacts whose conservation residuals are zero."
keywords = [
  "python",
  "csv",
  "json",
  "etl",
  "change-data-capture",
  "settlement",
  "reconciliation",
  "constraint-satisfaction",
  "fixpoint",
]
authors = [{ name = "Kunwar Singh", email = "kunwar.singh@ethara.ai" }, { name = "Dinshi Jain", email = "dinshi.jain@ethara.ai" }]

[metadata]
category = "Data Processing"
platforms = ["linux/amd64", "linux/arm64"]
