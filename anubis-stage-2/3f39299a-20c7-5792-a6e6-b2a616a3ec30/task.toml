[task]
name = "terminal-bench/3f39299a-20c7-5792-a6e6-b2a616a3ec30"
version = "1.0.0"
description = "A highway materials cooperative rationed winter road salt across twelve depots. Replay the season week by week with a reusable program: deduce eleven carriers' weighbridge settings, and on the hidden extracts an unannounced mid-season change to them, from dated ill-conditioned calibration batches by exact search, recover the unwritten whole-unit procedure and review trigger from a previous-season journal, resolve respelled references, aliases, merges and retirements, apply errata, re-keyed loads and void marks across daylight-saving changes, derive deficit status from entitlement bases, and write nine exact reports, including the recovered settings, on this and twenty-two hidden extracts, then report eight counterfactual figures."
keywords = ["data-processing", "allocation", "apportionment", "rationing", "simulation", "temporal-identity", "deduction", "python", "stdlib"]
authors = [{ name = "Aditya Jain", email = "aditya.jainint17@ethara.ai" }, { name = "Poonam Chourey", email = "poonam.chourey@ethara.ai" }]

