[task]
name = "terminal-bench/5b46e176-ff53-5506-9ae6-45b371a9a9f0"
version = "1.0.0"
description = "Clear one revenue epoch of a transit interchange: recover the seven platform properties that were never written down from a published calibration slice, resolve card identity as at each tap, apply a retroactive reversal rule, drive the gate and zone suspension state to its fixpoint, lend revenue cap surplus between zones under a ceiling and curtail what is left while holding a coverage obligation, then cancel the interchange obligations down to a cycle free residual and settle the cleared ledger onto a per distance unit basis, emitting a mutually consistent set of artifacts whose conservation residuals are zero."
keywords = [
  "python",
  "csv",
  "json",
  "settlement",
  "clearing",
  "netting",
  "reconciliation",
  "fixpoint",
  "parameter-recovery",
]
authors = [
    { name = "Kunwar Singh", email = "kunwar.singh@ethara.ai" },
    { name = "Dinshi Jain", email = "dinshi.jain@ethara.ai" },
]
