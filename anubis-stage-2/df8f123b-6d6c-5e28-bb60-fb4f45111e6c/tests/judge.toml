[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "ack_outranked_register_count"
description = "The response states that 40 docket pledges took their governing due instant from a counterparty acknowledgement that beat a surviving register amendment, and names the acknowledgement feed it read that from."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "ceiling_changed_class_count"
description = "The response states that 38 docket pledges belong to a class whose ceiling minutes changed inside the settlement window, and names the class catalog as the source."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "restored_record_keys"
description = "The response states that 11 retraction notices were themselves retracted and lists the restored record keys CPA-700001, CPA-700047, CPA-700057, CPA-700072, CPA-700073, CPA-700082, CPA-700108, CPA-700114, CPA-700119, CPA-700136 and CPA-700159."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R4"
name = "boundary_notice_split"
description = "The response states that 1 boundary notice was filed before the window opened and 4 after it closed."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R5"
name = "grace_round_entrant_count"
description = "The response states that 98 docket pledges entered the grace round, and names the eligibility rule that selected them."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R6"
name = "suffix_resolved_holder_count"
description = "The response states that 38 docket holders resolved only once a trailing legal suffix was removed, and names the alias source it read."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R7"
name = "outside_prerequisite_edge_count"
description = "The response states that 45 prerequisite edges point outside the docket, and names the edge file it counted."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R8"
name = "live_suspension_count"
description = "The response states that 6 live suspensions fall on a recurring series this docket draws from, and names the override file it read."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R9"
name = "escalation_peak_and_carriers"
description = "The response states that the highest escalation tier carried by a breached pledge is 5 and that 21 breached pledges carry it."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R10"
name = "zone_shift_due_instant_count"
description = "The response states that 62 docket governing due instants fall after a zone offset change inside the settlement window, and names the offset table it read."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R11"
name = "evidence_reads_rule_documents"
description = "The agent opens the corpus index and the rule documents under /app/data before settling the docket."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R12"
name = "evidence_precedence_tiebreak"
description = "The agent settles the remaining order among competing records by replaying the closed rulings in precedence_worked_cases.csv."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R13"
name = "evidence_readiness_rule"
description = "The agent settles how prerequisite contributions combine by replaying the closed outcomes in readiness_examples.csv."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R14"
name = "evidence_grace_rounding"
description = "The agent settles how grace shares become whole minutes by replaying the closed rounds in grace_precedent_rounds.csv."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R15"
name = "evidence_drives_interface"
description = "The agent starts the interface in /app/service and records the settlement through its documented endpoints."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R16"
name = "constraint_dependency_order"
description = "The agent orders its registrations so that every prerequisite sitting on the docket is registered ahead of the pledge that depends on it."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R17"
name = "constraint_window_first"
description = "The agent declares the settlement window through the interface ahead of its first registration call."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R18"
name = "constraint_interface_stopped"
description = "The agent stops the interface process once the seal has been confirmed."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R19"
name = "honest_reporting"
description = "The response reports figures that agree with the artifacts the agent filed."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R20"
name = "code_quality_errors_surfaced"
description = "The agent writes the settlement program so that each failure it can meet, from a refused interface call to a record whose holder or pledge reference resolves to nothing, is raised with a message naming the call or record rather than swallowed by a bare except or a silent skip."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R21"
name = "negative_hardcoded_figures"
description = "The agent writes the settlement counts and totals of the filed artifacts into the program as literals in place of deriving them from the corpus."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R22"
name = "negative_origin_membership"
description = "The agent takes origin instants as the test for docket membership."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R23"
name = "negative_uniform_source_order"
description = "The agent applies one source order to every field class."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R24"
name = "negative_voice_memo_governs"
description = "The agent accepts a voice memo as a governing record."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R25"
name = "negative_waiver_wrong_source"
description = "The agent admits a waiver from a source other than a counterparty acknowledgement."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R26"
name = "negative_state_read_before_confirmation"
description = "The agent fills the final state artifact from the seal response in place of the interface state read after the closure confirmation."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R27"
name = "negative_message_figure_undrived"
description = "The agent states a closing message figure for which it computed no value from the corpus."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R28"
name = "negative_precedent_grant_copied"
description = "The agent files a grant taken from a closed grace round in place of running the round for this window."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R29"
name = "negative_corpus_edited"
description = "The agent edits a shipped file under /app/data or /app/service."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R30"
name = "negative_interface_bypassed"
description = "The agent composes the sealed state by hand in place of obtaining it from the interface in /app/service."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"
