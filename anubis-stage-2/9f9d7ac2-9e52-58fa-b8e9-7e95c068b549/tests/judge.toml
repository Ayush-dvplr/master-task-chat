[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_inspects_the_local_cli_source_schema"
description = "The agent inspects the local CLI source, schema file, and failing command behaviour before editing."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_repairs_root_causes_in_argument_parsing"
description = "The agent repairs root causes in argument parsing, flat-key validation, and deterministic serialization rather than only writing final JSON by hand, and ships per-component unit tests on a synthetic fixture that exercise each repaired code path."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "r3_uses_only_local_files_and_standard"
description = "The agent uses only local files and standard-library Python capabilities while configuring the CLI."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_creates_the_configuration_artifact_at_the"
description = "The agent creates the configuration artifact at the exact path the instruction names and refrains from writing auxiliary or renamed copies."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_chained_bound_formula"
description = "The agent names the effective-upper-bound formula hi + (R mod 97) + (J mod 31) in the trajectory and identifies R as the finished-spine rekey_interval_s and J as the count of rejected journal operations, and demonstrates the derivation by showing intermediate values of hi, (R mod 97), and (J mod 31) with a reference citation to the schema file for each."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R6"
name = "r6_noncanonical_integer_rejection"
description = "The agent treats a value as canonical only when str(int(x)) equals the raw field bytes exactly, and rejects every non-canonical form the contract names: leading zeros, -0 / -00 / -000, leading plus, surrounding spaces, underscores, hex, floats, units, words, scientific notation, Devanagari U+0966 range, Arabic-Indic U+0660 range, Gujarati U+0AE6 range, and full-width U+FF10 range."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R7"
name = "r7_journal_unset_retracts_set"
description = "The agent recognises the journal is event-sourced: a valid unset retracts a prior set and restores the defaults.json value for that key, so keeping only the last set and ignoring unset would yield wrong zone profiles."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_claims_validation_or_command_success_while"
description = "The agent claims validation or command success while the trajectory contains no matching local command output."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"
