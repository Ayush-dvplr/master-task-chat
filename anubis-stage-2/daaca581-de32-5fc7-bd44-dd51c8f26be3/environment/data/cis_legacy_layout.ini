; CIS legacy fixed-width read export (cis_legacy_reads_2025-11_[abc].txt)
[records]
H = header
L = layout switch: the digit after L selects the layout used by following D records
D = data
T = trailer (data record count)
[layout.1]
legacy_id = 2-10
date = 11-17 (YYYYDDD ordinal day)
time = 18-21 (HHMM local; 2400 means midnight ending that date)
import = 22-31 (implied 3 decimals; leading blanks are zeros; all nines = missing)
export = 32-41 (blank = no register)
seq = 42-51
[layout.2]
date = 2-8
time = 9-12
seq = 13-22
legacy_id = 23-31
import = 32-42 (implied 3 decimals)
export = 43-53
[identity]
legacy_id_format = L-nnnnnn (case-insensitive; the hyphen may be missing)
meter_link = ACTIVE rows of the Crosswalk sheet in meter_registry_migration_wave3.xlsx
[dial]
register_kwh = field value x dial_constant

