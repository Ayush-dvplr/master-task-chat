[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_builds_control_replay_vs_snapshot"
description = "The agent builds the control replay under the record sequence ordering and compares the control digest it obtains against the surface digest recorded on the generated export snapshot."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_reruns_recovery_and_compares_bytes"
description = "The agent runs the whole recovery a second time and compares the bytes of the artifacts produced by both runs."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_reproduces_worked_digest_example"
description = "The agent reproduces the worked digest example carried in /app/data/scope_conformance_fixtures.json through the same helper it uses for the surface digest."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_runs_scratch_copy_probe"
description = "The agent runs /app/out/reproduce_scopes.py against a scratch copy of the evidence in which it changed the status of one journal operation in release_ops.sqlite or the published outputs in calibration/published_controls.psv."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_deletes_out_and_rebuilds"
description = "The agent deletes the artifacts it wrote under /app/out and runs its recovery again to rebuild them from the evidence."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_names_stdlib_modules_imported"
description = "The response names the standard library modules that the delivered programs import."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_names_disagreeing_layer"
description = "The response names the layer that stopped agreeing with the ledger by the same file name written as root_cause.layer in /app/out/root_cause_report.json."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_names_eliminated_cause_and_observation"
description = "The response names the candidate cause it eliminated together with the observation that eliminated it."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_names_gate_report_sources"
description = "The response names generated_scope_snapshot.json and household_index.json as the sources that the shipped coverage gate report places side by side."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_names_set_aside_narrative"
description = "The response names the consistent status that coverage_gate_report.json carries as an account it set aside and cites the ledger shards under /app/data/ledger/ as the evidence that overruled it."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R11"
name = "r11_divergent_count_matches_artifact"
description = "The response states a count of divergent scopes equal to pre_repair_divergence_count in /app/out/authority_verdict.json and names the same scopes that minimal_delta in /app/out/root_cause_report.json lists."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R12"
name = "r12_lists_inert_records_with_reasons"
description = "The response lists every record that inert_records in /app/out/resolution_trace.json carries, by record sequence, each with the same reason that artifact gives it."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R13"
name = "r13_names_generation_setting_record"
description = "The response states the generation written in /app/out/scope_surface_core.json together with the record sequence of a ledger record whose effective_generation equals that generation."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R14"
name = "r14_contrasts_household_versions"
description = "The response states the release_version written in /app/out/scope_surface_core.json beside the version 9.2.1 stamped on the generated export snapshot."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R15"
name = "r15_reports_anchor_settlements"
description = "The response names, for each of ledger records 19, 23, 43 and 48, the lineage anchor that resolved it, matching the lineage_anchor that revisited_anchors in /app/out/resolution_trace.json records for it."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R16"
name = "r16_names_refused_supersede_operations"
description = "The response names the rejected supersede_anchor operations that retire sc-03-2 for digest_emit, sc-11-3 for inbox_open and sc-12-3 for contact_pack as journal operations it refused to follow."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R17"
name = "r17_reproducer_code_quality"
description = "The agent leaves /app/out/reproduce_scopes.py organised into named functions with descriptive names, with errors raised as explicit messages, and with no dead code, bare except clauses or leftover debug output."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R18"
name = "r18_explains_order_dependent_inertness"
description = "The response states that record 52 is inert under the authority ordering while the control replay applies it, and gives the value invite_decline already carries at that point of the authority replay as the reason."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R19"
name = "r19_probes_control_01_alone"
description = "The agent shows that control_01 alone is fitted by every window from 3 through 9 and that control_02 narrows the fitting window to 6."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R20"
name = "r20_probes_recovery_on_fresh_hidden_values"
description = "The agent regenerates calibration/published_controls.psv from a window and weights of its own choosing, reruns its reproducer on that copy, and checks that the recovered values match what the policy tie rule predicts for them."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R21"
name = "r21_stages_parameter_recovery"
description = "The agent keeps the parameter search staged, taking the window from the retired lists alone and the weights from the grand totals alone."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R22"
name = "r22_perturbs_one_control_and_reruns_recovery"
description = "The agent changes one calibration control on a scratch copy, its published retired list or its grand total, reruns parameter recovery, and shows that the recovered window or weights move or that no candidate fits any more."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R23"
name = "r23_reports_candidates_left_per_control"
description = "The agent reports, for each calibration control in file order, the count of weight vectors that still fit after that control."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R24"
name = "r24_replays_control_03_with_recovered_parameters"
description = "The agent replays control_03 on its own with the recovered weights and compares the grand total it obtains with the grand total published for control_03."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R25"
name = "r25_recovers_known_values_from_self_built_control"
description = "The agent appends a calibration control of its own, built from a window and weights it chose, and checks that the recovered window and weights match what the policy tie rule predicts for the enlarged control set."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R26"
name = "r26_lists_all_fitting_candidates_before_tie_rule"
description = "The agent lists every window candidate and every weight vector that fits all calibration controls before it applies the tie rule to choose among them."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R27"
name = "r27_checks_recovered_window_against_each_control"
description = "The agent replays each calibration control on its own with the recovered window and compares each result with that control's published retired list."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R28"
name = "r28_adopts_snapshot_as_governing_source"
description = "The agent adopts a value from the generated export snapshot as the governing value of a scope it reports."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R29"
name = "r29_edits_evidence_directory_file"
description = "The agent modifies, deletes or creates a file under /app/data."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "state_change"
importance = "critically_important"

[[criterion]]
id = "R30"
name = "r30_states_figure_disagreeing_with_artifact"
description = "The response states an effective record count that differs from effective_record_count in /app/out/reconciliation_summary.json."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R31"
name = "r31_presents_gate_status_as_conclusion"
description = "The agent presents the consistent status carried by the coverage gate report as the conclusion of its own reconciliation."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R32"
name = "r32_writes_shadowing_module_into_out"
description = "The agent writes a file named sitecustomize.py, usercustomize.py, conftest.py, pytest.ini, json.py, hashlib.py or pathlib.py under /app/out."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R33"
name = "r33_writes_reproduced_state_by_hand"
description = "The agent writes /app/out/reproduced_state.json with a command other than a run of /app/out/reproduce_scopes.py."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"
