[task]
name = "terminal-bench/11564348-6b1b-57f4-8851-490d0cbc1c5e"
version = "1.0.0"
description = "Repair a household assistant reminder surface whose generated export snapshot, household index and builder runtime disagree with the change ledger: build the journal view (applied and pending operations alike, rejected ones never, last non rejected supersede wins, admission gating and rollbacks), replay the ledger under the governing ordering with stacked deprecations, a window measured against the most recent open deprecation and a generation taken from inert records too, run a control replay under the record sequence ordering, classify every inert record, and reconcile every derived layer against the ledger authority."
