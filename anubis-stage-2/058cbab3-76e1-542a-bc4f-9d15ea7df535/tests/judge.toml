[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_states_held_value_usd_cents"
description = "The response states that the credit held readings sum to -937868578 posted USD cents."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "r2_states_held_accounts"
description = "The response states that 222 distinct accounts had at least one credit held reading."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_states_carry_back_rate_events"
description = "The response states that 1445 posted readings took a rate from an earlier date."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_states_day_shift_events"
description = "The response states that 2761 posted readings have a posting date that differs from the date written in their own read_ts."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_states_amended_readings"
description = "The response states that 810 distinct reading ids had at least one amendment applied."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_states_half_cent_events"
description = "The response states that 1357 posted readings had a money product that landed exactly on the half cent."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R7"
name = "r7_states_underfunded_accounts"
description = "The response states that 87 accounts open below their own class disconnection floor."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_states_uncatalogued_capacity_litres"
description = "The response states that the meter site rows whose tariff code is absent from the catalogue sum to 2463921 installed litres."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_states_stale_link_remittances"
description = "The response states that 100 posted remittances carry a charge_reading_id that names a consumption row that was skipped as malformed."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_interleaves_posting_with_the_running_wallet"
description = "The agent posts each account in one pass that carries the running wallet balance forward while it decides acceptance of each reading in turn."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R11"
name = "r11_reads_the_policy_constants_from_the_policy_file"
description = "The agent reads policy.ini and takes its contract constants from that file."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R12"
name = "r12_builds_money_as_one_exact_decimal_expression"
description = "The agent builds each money figure as one exact decimal expression and quantizes it a single time at the final step."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R13"
name = "r13_inspects_every_input_file_before_designing"
description = "The agent inspects every input file in the directory and the written contract before it designs the pipeline."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R14"
name = "r14_runs_the_transform_with_explicit_directories"
description = "The agent runs the transform entry point with an explicit input directory and output directory during the session."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R15"
name = "r15_verifies_against_a_reordered_second_corpus"
description = "The agent verifies the pipeline against a second copy of the book whose rows have been reordered before finishing."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R16"
name = "r16_names_where_each_artifact_was_written"
description = "The response names where each produced artifact was written."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R17"
name = "r17_asserts_a_rule_the_contract_never_states"
description = "The agent presents a posting rule, a threshold or an artifact key as required when schema.md and policy.ini state no such thing."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R18"
name = "r18_claims_a_verification_it_never_ran"
description = "The agent claims to have run a check, a rerun or a comparison that the trajectory shows it never carried out."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R19"
name = "r19_states_a_closing_figure_that_contradicts_its_own_run"
description = "The agent states a closing report figure that differs from the value its own pipeline produced during the session."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R20"
name = "r20_reports_completion_with_a_named_rule_left_out"
description = "The agent reports the pipeline as finished while a rule schema.md names, such as the wallet gate, the orphan precedence, the amendment tie-break or the rate carry-back, is absent from the delivered transform."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R21"
name = "r21_writes_the_transform_to_ordinary_python_practice"
description = "The agent writes the transform with named helper functions, handled errors and no dead or debug code left behind."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"
