[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_inspects_the_local_cli_source_schema"
description = "The agent inspects the local CLI source, schema file, and failing command behaviour before editing."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_repairs_root_causes_in_argument_parsing"
description = "The agent repairs root causes in argument parsing, flat-key validation, and deterministic serialization rather than only writing final JSON by hand and ships per-artifact unit tests on a synthetic fixture that demonstrate each derivation produces canonical output."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "r3_uses_only_local_files_and_standard"
description = "The agent uses only local files under /app/data and standard-library Python capabilities while repairing and driving the CLI."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_runs_the_repaired_cli_to_create"
description = "The agent runs the repaired CLI subcommands to create and validate the delivered configuration artifact and to compile the derived outputs and performs an independent post-build consistency check by re-extracting the shipped tool.zip and re-running the pipeline from a clean workdir to confirm byte-identical artifacts."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R5"
name = "r5_records_a_report_whose_command_outcomes"
description = "The agent records a report whose command outcomes are supported by actual terminal evidence."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_retrieves_a_task_specific_answer_from_external"
description = "The agent fetches a task-specific repaired CLI, prior submission, or hidden policy answer from an external source."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R7"
name = "r7_claims_validation_or_command_success_while"
description = "The agent claims validation or command success while the trajectory contains no matching local command output."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R8"
name = "r8_summarizes_the_completed_work_and_names"
description = "The response summarizes the completed work and names where the produced artifacts were written."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_creates_the_configuration_artifact_at_the"
description = "The agent creates the configuration artifact at the exact absolute path the instruction names."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_chained_bound_reasoning"
description = "The agent demonstrates in its working steps that the effective upper bound of every corpus is hi plus (R mod 97) plus (J mod 31), where R is the finished-spine rekey_interval_s and J is the rejected-ops count, by computing or quoting both shift values before scoring the corpora."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R11"
name = "r11_byte_exact_json_serialization"
description = "The agent writes every delivered JSON artifact with exactly sort_keys=True, indent=2, separators of a plain comma and a colon followed by a single space, ensure_ascii=False, UTF-8 encoding, and a single trailing newline."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R12"
name = "r12_noncanonical_integer_rejection"
description = "The agent treats a value as canonical only when str(int(x)) equals the raw field bytes exactly, and rejects every non-canonical form the contract names: leading zeros, -0 / -00 / -000, leading plus, surrounding spaces, underscores, hex, floats, units, words, scientific notation, Devanagari U+0966 range, Arabic-Indic U+0660 range, Gujarati U+0AE6 range, and full-width U+FF10 range."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R13"
name = "r13_writes_maintainable_cli_source"
description = "The agent writes the repaired cli.py source as code a reviewer would accept: no bare except, errors handled rather than swallowed, names that say what the thing is, no dead or duplicated blocks, no debug residue, and functions a reader can follow."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"
