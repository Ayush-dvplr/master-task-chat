[task]
name = "terminal-bench/d7898e6d-ea74-503d-bfcc-0cc85775b6cd"
version = "1.0.0"
description = "Rebuild a lost backup snapshot retention pruner from two worked examples: screen a damaged snapshot catalogue, apply hourly, daily, weekly and monthly retention per host and volume, honour legal holds and parent chains, and recover six unwritten rules and seven mode bits about bucket members, week start, hold expiry, partial snapshots, republished records and clocks, as one program that generalizes to unseen catalogues."
keywords = ["backup-retention", "snapshots", "time-buckets", "legal-hold", "rule-recovery"]
authors = [{ name = "Aniket Datta", email = "aniket.dattaint17@ethara.ai" }, { name = "Dinshi Jain", email = "dinshi.jain@ethara.ai" }]

