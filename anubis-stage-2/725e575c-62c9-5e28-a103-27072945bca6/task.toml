[task]
name = "terminal-bench/725e575c-62c9-5e28-a103-27072945bca6"
version = "1.0.0"
description = "Repair a broken Python 3.12 run-ledger package so it follows an approved reconciliation specification, its incorporated documents and errata, then use it to rebuild the stage-1 shard, step, mixture, checkpoint, reconciliation and resume-state outputs of a pretraining feed full of decoys and conflicting sources. The repaired package is also run on a hidden later-stage feed opened from the agent's own resume state."
keywords = ["python", "packaging", "debugging", "data-reconciliation", "pretraining", "specification-compliance"]
authors = [{ name = "Aditya Patel", email = "aditya.patelint17@ethara.ai" }, { name = "Dinshi Jain", email = "dinshi.jain@ethara.ai" }]

