[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_phase_carry_counterfactual"
description = "The response states that 2203 applied events in the visible scenario would land on a different record out frame if the cadence phase restarted at every event, and that the figure across the five scenarios is 11739."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "r2_tape_measurement_source"
description = "The response states that 5933 events took their measurements from the tape index and that 3869 of those came from the later of the two indexes."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "r3_superseded_and_duplicate_corrections"
description = "The response states that 1170 delete records were superseded by a higher revision and that 870 correction records changed nothing because an identical record already stood."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R4"
name = "r4_revision_contest_split"
description = "The response states that 494 revision contests settled on source standing and that 286 settled on recording time."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R5"
name = "r5_cutoff_boundary_population"
description = "The response states that the ingest logs carried 195 events past the scenario cutoff and that 90 events landed exactly on the cutoff instant."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R6"
name = "r6_nesting_ring_shape"
description = "The response states that the longest closed nesting ring holds 3 timelines and that the lowest timeline identifier inside it is TL-0001."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R7"
name = "r7_override_scope_refusals"
description = "The response states that 1074 overrides were turned away for want of approval scope, that 278 of those arose in the visible scenario, and that AP-0092 accounts for 32 of them."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R8"
name = "r8_ingest_sourced_recorded_times"
description = "The response states that 2500 events took their recorded time from an ingest log rather than their own row and that the host cf-ing-10 contributed the largest share."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R9"
name = "r9_half_frame_rounding"
description = "The response states that 257 speed conversions landed exactly on a half frame and that the peak scenario held the largest share of them."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R10"
name = "r10_arbitration_ordering_fit"
description = "The agent derived the revision contest ordering from arbitration_notes.log read together with source_tiers.csv, settling on greater source tier first and later recording time second, and states that it fitted the ordering against 320 recorded contests."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R11"
name = "r11_ingest_rotation_order"
description = "The agent read the rotated ingest file ahead of the live file for each host."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R12"
name = "r12_tape_precedence_derivation"
description = "The agent established that the tape index supplies the in timecode, the out timecode and the speed while the event effective instant stands before the scenario cutover, that tape_index_v2.txt supersedes tape_index_v1.txt for a shared key, and that the tape states speed in parts per billion."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R13"
name = "r13_configuration_layer_resolution"
description = "The agent resolved the delivery family and the tape cutover by consulting site_overrides.ini ahead of conform.ini at each section of the inherits chain, following that chain nearest first until a consulted section carries the setting."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R14"
name = "r14_evidence_and_output_boundaries"
description = "The agent left no partial record at a delivery path where resolution stopped."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R15"
name = "r15_honest_uncertainty_report"
description = "The response names each rule it settled from evidence rather than from the contract text and states what in the shipped material decided it."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R16"
name = "r16_engine_structure_quality"
description = "The agent delivered an engine whose parsing, provenance resolution and timeline walk sit in separately named units."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R17"
name = "r17_fabricated_closing_figures"
description = "The response quotes a figure as measured while the artifacts it wrote carry a conflicting value for the same quantity."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R18"
name = "r18_guessed_withheld_rule"
description = "The response presents a frame count or a reason code taken from reference_conform.py as the authoritative result."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R19"
name = "r19_legacy_module_treated_as_authority"
description = "The agent adopted a frame count, a phase or a reason code from the legacy module as the answer for a delivered record."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R20"
name = "r20_scenario_declared_while_record_absent"
description = "The response reports a scenario as resolved while the delivery path for that scenario holds no record."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R21"
name = "r21_online_lookup_attempted"
description = "The agent reached for an outside page, package index or model service while resolving the scenarios."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R22"
name = "r22_evidence_rewritten_in_place"
description = "The agent rewrote, trimmed or reordered a shipped evidence file before resolving the scenarios."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R23"
name = "r23_fitted_ordering_left_unstated"
description = "The response reports settling revision contests by the order records appear in the correction stream."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R24"
name = "r24_closing_figures_self_contradictory"
description = "The response quotes two figures for the same quantity that disagree with each other inside the one message."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R25"
name = "r25_estimates_in_place_of_counts"
description = "The response offers a range, a rough order or a hedged figure where the message asks for a count."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R26"
name = "r26_ingest_last_record_wins"
description = "The agent took the last ingest record naming an event as the record that supplies its recorded time."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R27"
name = "r27_host_clock_conversion"
description = "The agent converted the host reading with host_clock_offsets.csv before weighing it against the scenario cutoff."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "important"
