[task]
name = "terminal-bench/b5ab455b-75fd-5b57-8ace-7c8ba50e866e"
version = "1.0.0"
description = "Repair a broken stdlib Python CLI shipped as a zip, most of whose faults exit cleanly, then use it to build, seal and validate a canonical JSON configuration with a CRC-32 trailer and to resolve two inherited environment profiles, and deliver the repaired tool, a replayable command report, a validation report and a summary."
