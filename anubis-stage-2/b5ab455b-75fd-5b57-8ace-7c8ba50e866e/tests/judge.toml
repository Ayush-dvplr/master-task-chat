[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_inspects_unrepaired_init_output"
description = "The agent runs the unrepaired init subcommand and inspects the document it writes before editing cmd_init."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_reproduces_set_failure"
description = "The agent runs the set subcommand while cmd_set is still unedited and inspects the document that run writes."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_runs_repaired_validate_successfully"
description = "The agent runs the repaired validate subcommand against /app/out/config.json and receives exit status zero."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R4"
name = "r4_reproduces_export_report_failure"
description = "The agent runs the export-report subcommand while cmd_report is still unedited and inspects the report that run writes."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_names_the_cause_of_each_fault"
description = "The agent writes a /app/out/report.json whose repairs list names the cause of each fault the agent repaired in the tool outside cmd_report and its options."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "state_change"
importance = "critically_important"

[[criterion]]
id = "R6"
name = "r6_repaired_code_meets_ordinary_practice"
description = "The agent writes the repaired cli.py to the ordinary standard of the surrounding code, keeping descriptive names, surfaced errors and no leftover debug code."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_extracts_archive_to_named_location"
description = "The agent extracts the source archive to /app/tool."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_uses_third_party_package"
description = "The agent imports or installs a third-party Python package in a helper script or command it runs outside the delivered cli.py."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_checks_the_file_on_disk"
description = "The agent reads /app/out/config.json back from disk after the repaired CLI writes it, before writing /app/out/report.json."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_retrieves_the_answer_externally"
description = "The agent retrieves a repaired version of the tool or the configuration policy from a source outside the container."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R11"
name = "r11_claims_success_against_its_own_output"
description = "The agent states that a command succeeded while its own run of that command exited non-zero."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R12"
name = "r12_names_where_each_artifact_landed"
description = "The response names the path each produced artifact was written to."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R13"
name = "r13_hand_writes_main_config"
description = "The agent authors the contents of /app/out/config.json itself, with a file write or code of its own, rather than generating them with the repaired CLI's init, set and seal subcommands."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R14"
name = "r14_reads_raw_input_bytes"
description = "The agent reads the raw bytes of the input files under /app/data, with a hex dump or a bytes-level read, before using values parsed from them."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R15"
name = "r15_calibrates_against_history"
description = "The agent reproduces a trailer recorded in /app/data/history_2026-07.jsonl with the repaired tool's encoding and digest before writing /app/out/config.json."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R16"
name = "r16_probes_unrepaired_validate"
description = "The agent runs the unrepaired validate subcommand on a document that breaks a published validate rule and inspects the verdict it prints."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R17"
name = "r17_hand_writes_report"
description = "The agent authors the contents of /app/out/report.json itself, with a file write or code of its own, rather than generating them with the repaired CLI's export-report subcommand."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R18"
name = "r18_runs_the_archive_on_its_own"
description = "The agent unpacks /app/out/tool.zip into a fresh directory away from /app/data and runs its init, set, seal and validate subcommands there on inputs of its own before finishing."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R19"
name = "r19_probes_missing_options_per_subcommand"
description = "The agent runs the repaired CLI once for each of the six subcommands with one of that subcommand's required options left out before delivering, and checks that each run exits with status 2."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R20"
name = "r20_repairs_cover_every_cmd_report_fault"
description = "The agent writes a /app/out/report.json whose repairs list names every fault of the shipped cmd_report and its options: ok always true, argv taken from sys.argv, config_path stored as given, the digest taken over a re-encoding rather than the file bytes, and --commands and --repairs left optional."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "state_change"
importance = "critically_important"
