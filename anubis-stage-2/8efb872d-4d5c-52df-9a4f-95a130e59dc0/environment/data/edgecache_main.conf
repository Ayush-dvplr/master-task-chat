# edge cache tiering configuration; a later setting overrides an earlier one
# ---- global ----
refresh weekly;
versions 2;
store-compressed on;
codec gzip;
# raised for the 2024 tiering review
refresh daily;
versions 3;
hot-raw off;

class edge {
    location /img/t/ {
        refresh weekly;
        codec-level 9;
        store-compressed on;
        versions 12;
        stale-if-error 600;
    }
    location /static/js/ {
        store-compressed on;
        versions 2;
        codec-level 9;
        refresh weekly;
    }
    location /static/css/ {
        refresh daily;
        codec zstd;
        codec-level 19;
        store-compressed on;
        hot-raw on;
        versions 12;
    }
    location /static/fonts/ {
        refresh daily;
        codec brotli;
        codec-level 11;
        versions 4;
    }
    location /p/ {
        versions 1;
        refresh daily;
    }
    location /api/v2/ {
        versions 8;
        store-compressed on;
        refresh hourly;
    }
}

class video {
    location /v/seg/ {
        versions 8;
        codec br;
        codec-level 11;
        refresh hourly;
        hot-raw on;
    }
    location /v/m3u8/ {
        versions 10;
        refresh daily;
    }
    location /v/mpd/ {
        versions 2;
        refresh daily;
    }
    location /img/t/ {
        versions 12;
        refresh daily;
        hot-raw off;
        store-compressed off;
    }
    location /a/aac/ {
        hot-raw off;
        codec-level 9;
        store-compressed off;
        refresh daily;
        versions 10;
    }
    location /api/v2/ {
        refresh weekly;
        store-compressed on;
        versions 4;
    }
}

class image {
    location /img/t/ {
        versions 3;
        refresh daily;
        store-compressed off;
        stale-if-error 600;
    }
    location /img/f/ {
        hot-raw on;
        refresh daily;
        versions 1;
    }
    location /u/av/ {
        store-compressed on;
        versions 6;
        refresh hourly;
        codec zstd;
        codec-level 19;
    }
    location /tiles/ {
        hot-raw on;
        refresh daily;
        store-compressed on;
        versions 8;
    }
    location /static/fonts/ {
        refresh daily;
        hot-raw off;
        store-compressed on;
        versions 10;
        codec zstd;
    }
    location /static/css/ {
        refresh daily;
        store-compressed on;
        versions 4;
    }
}

class api {
    location /api/v2/ {
        versions 3;
        store-compressed on;
        refresh daily;
    }
    location /p/ {
        store-compressed on;
        versions 12;
        codec zstd;
        refresh daily;
    }
    location /static/js/ {
        versions 5;
        refresh daily;
        store-compressed off;
    }
    location /u/av/ {
        refresh daily;
        versions 5;
    }
    location /docs/ {
        versions 3;
        hot-raw on;
        store-compressed on;
        refresh weekly;
        codec zstd;
        codec-level 19;
        stale-if-error 600;
    }
}

class dl {
    location /dl/inst/ {
        hot-raw on;
        store-compressed on;
        versions 8;
        refresh daily;
        slice 1m;
    }
    location /dl/patch/ {
        refresh weekly;
        versions 6;
        store-compressed on;
    }
    location /pkg/ {
        store-compressed on;
        refresh weekly;
        versions 3;
        stale-if-error 600;
    }
    location /sw/ {
        store-compressed on;
        refresh daily;
        versions 3;
    }
    location /docs/ {
        store-compressed on;
        hot-raw off;
        versions 12;
        refresh daily;
    }
}

class live {
    location /live/seg/ {
        refresh daily;
        versions 6;
        store-compressed on;
    }
    location /v/m3u8/ {
        hot-raw off;
        versions 10;
        refresh hourly;
        store-compressed on;
        min-uses 2;
    }
    location /v/mpd/ {
        versions 6;
        refresh daily;
        hot-raw on;
        store-compressed on;
    }
    location /a/aac/ {
        refresh daily;
        store-compressed on;
        versions 8;
        hot-raw on;
    }
    location /api/v2/ {
        refresh hourly;
        hot-raw on;
        versions 12;
        slice 1m;
    }
}

class store {
