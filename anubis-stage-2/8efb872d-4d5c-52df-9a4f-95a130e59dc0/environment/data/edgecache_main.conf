        codec-level 9;
        refresh daily;
    }
    location /static/js/ {
        store-compressed on;
        refresh weekly;
        versions 3;
        hot-raw off;
    }
    location /api/v2/ {
        versions 5;
        hot-raw on;
        refresh weekly;
        codec br;
        store-compressed off;
        lock on;
    }
    location /game/ {
        refresh daily;
        store-compressed on;
        versions 1;
    }
    location /p/ {
        codec brotli;
        codec-level 11;
        store-compressed on;
        refresh hourly;
        versions 10;
    }
}

