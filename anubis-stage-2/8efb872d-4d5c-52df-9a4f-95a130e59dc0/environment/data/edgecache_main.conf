        refresh hourly;
        codec zstd;
        codec-level 19;
        versions 6;
    }
    location /dl/patch/ {
        refresh daily;
        versions 6;
    }
    location /img/f/ {
        hot-raw on;
        versions 8;
        store-compressed on;
        refresh daily;
    }
    location /sw/ {
        store-compressed off;
        codec-level 9;
        versions 10;
        refresh hourly;
    }
    location /tiles/ {
        versions 2;
        hot-raw on;
        refresh daily;
        codec zstd;
        codec-level 19;
        store-compressed on;
        min-uses 2;
    }
}

