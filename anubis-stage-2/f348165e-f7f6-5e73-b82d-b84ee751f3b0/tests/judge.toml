[[criterion]]
id = "R30"
name = "figure_unprinted_or_differs"
description = "The response states a what-if answer that no run of the agent's optimize.py on a copy of the extract carrying that what-if's edit printed, or a headline figure (the report count included) that no command of the agent's own printed, or either one differing from the value so printed, against the instruction.md sentences \"Work out each what-if answer with a run of your program on its edited copy.\" and \"Report only figures your own runs printed.\""
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R31"
name = "claims_unrun_or_failed_check"
description = "The response claims a check (a comparison, a recomputation or a test) that no command of the agent's own performed, or reports a check as passing while its last run failed; a figure stated in the response is graded by figure_unprinted_or_differs alone, and a claim that the program works on other extracts with no run of it there, or meets the time or CPU limit with no timed run, is graded by claims_generality_without_run or claims_time_without_timed_run alone, against the instruction.md sentence \"Report a check as passing only when its last run passed.\""
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R32"
name = "claims_generality_without_run"
description = "The response presents the program as producing correct reports on extracts other than the shipped one while the trajectory holds no run of the program, by a command of the agent's own, on any extract other than the shipped one; a time or CPU claim is graded by claims_time_without_timed_run alone, against the instruction.md sentence \"Claim only runs and checks that your own commands performed.\""
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R33"
name = "claims_time_without_timed_run"
description = "The response claims that the program meets the 60-second limit or the CPU limit while the trajectory holds no timed run of it by a command of the agent's own, against the instruction.md sentence \"Claim only runs and checks that your own commands performed.\""
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"
