[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "runs_moved_run_or_part_extract"
description = "The agent runs its program on an extract it built in which the pool profiles document holds a cell whose current value is a moved-to run (w:moveTo) beside a moved-away run (w:moveFrom) in the same paragraph, or a cell whose moved-away paragraph (w:moveFrom) sits before the moved-to paragraph (w:moveTo), or whose main document part is reached through the package relationships while a stale part sits at word/document.xml, a step toward the instruction.md sentence \"It will also be run on other extracts in the same layout, so nothing in it may depend on this particular period.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "runs_math_choice_alternate_content"
description = "The agent runs its program on an extract it built in which an Office Open XML document the program reads holds a cell whose text sits in markup compatibility alternate content whose Choice requires the ECMA-376 math namespace (mc:Choice Requires=\"m\") and whose Fallback holds another value, a step toward the ct_svc.md sentence \"A document is read as a consumer that understands every namespace ECMA-376 defines and no other.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "runs_revised_or_second_catalog_meter_pdf"
description = "The agent runs its program on an extract it built whose meter sheet PDF carries a later revision appended after the first end-of-file marker, or a second, unreferenced catalog after the one the trailer names, a step toward the instruction.md sentence \"It will also be run on other extracts in the same layout, so nothing in it may depend on this particular period.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R4"
name = "timed_run_at_eleven_joint_pools"
description = "The agent times a run of its program on an extract it built in which 11 pools appear only in meter readings that also name another pool, the reach ct_svc.md states, a step toward the instruction.md sentence \"Each call finishes within 60 seconds.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R5"
name = "enumerates_meter_assignment_unique"
description = "The agent runs a separate enumeration, apart from its program, over the candidate units per RU of the pools that shows exactly one assignment matches every reading of the shipped meter sheet, a step toward the st_demand.md rule \"The units per RU of the pools are the admissible values (gl_00.md) that meet every reading of the sheet together\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R6"
name = "runs_object_stream_page_meter_pdf"
description = "The agent runs its program on an extract it built whose meter sheet PDF keeps its page object inside an object stream named by a cross-reference stream, a step toward the instruction.md sentence \"It will also be run on other extracts in the same layout, so nothing in it may depend on this particular period.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R7"
name = "runs_rates_sheet_behind_workbook_rels"
description = "The agent runs its program on an extract it built whose rate card workbook stores another sheet as the first worksheet part, so the rates sheet is found only through the workbook relationships, a step toward the instruction.md sentence \"It will also be run on other extracts in the same layout, so nothing in it may depend on this particular period.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R8"
name = "runs_phonetic_shared_string_workbook"
description = "The agent runs its program on an extract it built whose rate card workbook holds a text cell, shared or inline, made of runs together with a phonetic reading (rPh), a step toward the instruction.md sentence \"It will also be run on other extracts in the same layout, so nothing in it may depend on this particular period.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R9"
name = "cross_checks_settlement_with_second_implementation"
description = "The agent writes a second implementation of the settlement loop, apart from its program, and compares the settled reservations of every member it gives with those of its program on the shipped extract, a step toward the instruction.md sentence \"Every report follows the layout and form the documents give, exactly: text reports byte for byte, database and workbook reports value for value.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R10"
name = "writes_readable_code"
description = "The agent leaves an optimize.py whose names say what each value holds, whose functions each do one job a reader can follow, and that carries no dead code, duplicated blocks or debug output"
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "important"

