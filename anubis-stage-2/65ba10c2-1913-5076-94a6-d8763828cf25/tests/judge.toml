[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_reads_the_opening_papers_first"
description = "The agent opens /app/data/readme_first.txt and /app/data/terminal_contract_overview.md before it opens any register of the shift."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"
# residue = "A delivery derived in the right order and one that stumbled into it leave the same documents."
# contract_sentence = "Start at /app/data/readme_first.txt, then /app/data/terminal_contract_overview.md, which names the fourteen stages and their specifications."
# contract_file = "instruction.md"

[[criterion]]
id = "R2"
name = "r2_works_the_stages_in_order"
description = "The agent works the fourteen stages in the order /app/data/terminal_contract_overview.md lists them, and its trajectory shows the move admission settled after the opening yard was materialised."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"
# residue = "A publication reached by working the stages out of order can still land on the same bytes."
# contract_sentence = "Work the fourteen stages in order."
# contract_file = "instruction.md"

[[criterion]]
id = "R3"
name = "r3_program_restricted_to_the_standard_library"
description = "The agent restricts /app/out/yardledger.py to the Python standard library."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"
# residue = "The verifier container happens to carry the third party packages a delivered program might import."
# contract_sentence = "Restrict it to the Python standard library and have it read all three office papers."
# contract_file = "instruction.md"

[[criterion]]
id = "R4"
name = "r4_implements_the_unreached_branches"
description = "The agent reads /app/data/corpus_sentinel_note.txt and states that it implemented the outcomes that paper names as unreached from the stage specifications that describe them."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"
# residue = "A branch no graded shift reaches leaves no trace in any delivered document."
# contract_sentence = "This shift leaves some documented branches unreached; implement those from their specifications."
# contract_file = "instruction.md"

[[criterion]]
id = "R5"
name = "r5_reports_the_live_sheet_key"
description = "The response reports the live workbook sheet key together with the sheet name it took that key from."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "critically_important"
# residue = "The delivered documents carry the sheet name without saying which key chose it."
# contract_sentence = "Report, in your final message, the canonical event count and the orders set aside under each rung, the live sheet key with the sheet you took it from, the components the cycle breaking touched with the edge removed from each, the moves the reserved rung bound, the boxes whose mass was never declared, the vessels with no applicable call, the ration outcome of every slot and berth pairing with its pass count, and the boxes the load deferred with the charge each was republished at."
# contract_file = "instruction.md"

[[criterion]]
id = "R6"
name = "r6_reports_the_ration_outcome_per_pairing"
description = "The response reports the ration outcome of every slot and berth pairing together with the number of passes that pairing ran to."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "critically_important"
# residue = "The ration trace holds the passes without the agent ever reporting them."
# contract_sentence = "Report, in your final message, the canonical event count and the orders set aside under each rung, the live sheet key with the sheet you took it from, the components the cycle breaking touched with the edge removed from each, the moves the reserved rung bound, the boxes whose mass was never declared, the vessels with no applicable call, the ration outcome of every slot and berth pairing with its pass count, and the boxes the load deferred with the charge each was republished at."
# contract_file = "instruction.md"

[[criterion]]
id = "R7"
name = "r7_reports_the_set_aside_counts"
description = "The response reports the count of orders set aside under each of the six rung codes printed in /app/data/move_admission_ladder.txt."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "critically_important"
# residue = "The rejection documents carry the counts without the agent ever reporting them."
# contract_sentence = "Report, in your final message, the canonical event count and the orders set aside under each rung, the live sheet key with the sheet you took it from, the components the cycle breaking touched with the edge removed from each, the moves the reserved rung bound, the boxes whose mass was never declared, the vessels with no applicable call, the ration outcome of every slot and berth pairing with its pass count, and the boxes the load deferred with the charge each was republished at."
# contract_file = "instruction.md"

[[criterion]]
id = "R8"
name = "r8_reports_the_undeclared_masses"
description = "The response reports the boxes whose mass was never declared."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "important"
# residue = "The dimensions document marks them without the agent ever reporting them."
# contract_sentence = "Report, in your final message, the canonical event count and the orders set aside under each rung, the live sheet key with the sheet you took it from, the components the cycle breaking touched with the edge removed from each, the moves the reserved rung bound, the boxes whose mass was never declared, the vessels with no applicable call, the ration outcome of every slot and berth pairing with its pass count, and the boxes the load deferred with the charge each was republished at."
# contract_file = "instruction.md"

[[criterion]]
id = "R9"
name = "r9_program_carries_fourteen_named_steps"
description = "The agent leaves /app/out/yardledger.py carrying the fourteen stages as fourteen separately named steps in the order /app/data/terminal_contract_overview.md lists them."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "state_change"
importance = "important"
# residue = "A program that folds the stages into one step produces the same thirty nine documents."
# contract_sentence = "The fourteen stages appear in the program as fourteen separately named steps, in the order terminal_contract_overview.md lists them, so a reader can put a published figure back to the stage that derived it."
# contract_file = "environment/data/yardledger_program_contract.md"

[[criterion]]
id = "R10"
name = "r10_reads_the_workbook_as_a_zip"
description = "The agent opens /app/data/quay_capacity_workbook.xlsx as a zip archive, reads its worksheet and shared string parts, and shows the cell it took the ration damping numerator and denominator from."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"
# residue = "The damping fraction reaches the ration trace whichever way it was obtained."
# contract_sentence = "Restrict it to the Python standard library and have it read all three office papers."
# contract_file = "instruction.md"

[[criterion]]
id = "R11"
name = "r11_reads_the_memorandum"
description = "The agent extracts the text of /app/data/berth_operations_memo.pdf and shows the ration pass budget, the ration minimum step and the dependency protection depth it read there."
