[[criterion]]
id = "R35"
name = "r35_edits_the_shipped_papers_by_hand"
description = "The agent edits a shipped paper of /app/data by hand, with a file editor or a shell rewrite it issues itself, apart from running the program it delivers."
type = "binary"
