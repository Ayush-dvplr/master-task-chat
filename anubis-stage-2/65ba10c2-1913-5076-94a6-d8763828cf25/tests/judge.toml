type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"
# residue = "The reservation document can carry the right total while the admission used the wrong one."
# serves = "The not supplied marker means the whole block is withheld, never nothing."

[[criterion]]
id = "R37"
name = "r37_counts_the_first_placement_as_a_rehandle"
description = "The agent counts every admitted move of a box as a rehandle, including the move that puts a box on the yard for the first time from off the yard."
