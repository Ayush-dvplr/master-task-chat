weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"
# residue = "The three controls reach the publication whichever way they were obtained."
# contract_sentence = "Restrict it to the Python standard library and have it read all three office papers."
# contract_file = "instruction.md"

[[criterion]]
id = "R12"
name = "r12_reads_the_directive"
description = "The agent opens /app/data/stowage_ordering_directive.docx and shows the four stowage ordering keys in their key positions together with the class rank it read for each box class."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"
# residue = "The ordering keys reach the load sequence whichever way they were obtained."
# contract_sentence = "Restrict it to the Python standard library and have it read all three office papers."
# contract_file = "instruction.md"

[[criterion]]
id = "R13"
name = "r13_takes_the_blocks_in_force_from_the_topology"
description = "The agent takes the blocks in force from /app/data/yard_topology.xml and says that a block carrying a current geometry row is out of force when the topology omits it."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"
# residue = "The yard documents simply lack the block, which a delivery could reach by accident."
# contract_sentence = "yard_topology.xml names the blocks in force for this shift."
# contract_file = "environment/data/spec_stage_y04_opening_yard.md"

[[criterion]]
id = "R14"
name = "r14_takes_the_reporting_berths_from_the_roster"
description = "The agent takes the reporting berths from /app/data/berth_reporting_roster.conf."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"
# residue = "The three berth reports can be named from the berth window register instead and still land correctly."
# contract_sentence = "One report is published for each berth of berth_reporting_roster.conf"
# contract_file = "environment/data/spec_stage_y14_terminal_accounts.md"

[[criterion]]
id = "R15"
name = "r15_withholds_the_reserved_credit_first"
description = "The agent shows that at the reserved capacity rung it withheld the standing reservation credit before counting free capacity, and names one move order that the reserved credit bound together with the block it was bound in."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"
# residue = "A delivery that got the admission right by another route leaves the same eligibility document."
# serves = "Settling reserved capacity before free capacity is the decision the stage turns on."

[[criterion]]
id = "R16"
name = "r16_stops_the_ration_at_the_pass_budget"
description = "The agent treats the quay ration as a damped iterate that stops when the pass budget of /app/data/berth_operations_memo.pdf is spent, and states the share of at least one vessel that stands short of its declared demand at the moment the budget runs out."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"
# residue = "The ration trace records the final shares without showing why the iterate stopped."
# serves = "The budget, and never convergence, is what ends the iterate."

[[criterion]]
id = "R17"
name = "r17_rounds_the_ration_every_pass"
description = "The agent shows the ration rounding to whole crane minutes at the end of every pass, and shows one pass opening from the rounded share the pass before it left."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"
# residue = "Rounding once at the end can reach the same published minutes on an easy pairing."
# serves = "Per pass rounding is what makes the iterate reproducible in exact arithmetic."

[[criterion]]
id = "R18"
name = "r18_redistributes_inside_the_cell"
description = "The agent redistributes what a ceiling freed inside the cross classification of berth and service group, and names the service group cell it redistributed within for one slot and berth pairing."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"
# residue = "A pairing with one service group redistributes identically either way."
# serves = "The cell, and never the whole pairing, is the scope the policy sets."

[[criterion]]
id = "R19"
name = "r19_picks_the_canonical_member_from_the_standing_orders"
description = "The agent picks the canonical member of a cluster from among the orders the earlier rungs left standing, and names one cluster whose first listed member an earlier rung had already caught."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"
# residue = "Most clusters have no caught member, so the two readings agree on them."
# serves = "The canonical member is chosen after the ladder has run, never before."

[[criterion]]
id = "R20"
name = "r20_places_the_boundary_minute_in_the_closing_slot"
description = "The agent places a raised minute that falls exactly on a slot boundary in the slot that is closing, and names one order it placed that way together with the slot code it gave it."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"
# residue = "Only a handful of orders land exactly on a boundary, so the convention is invisible elsewhere."
# serves = "The boundary convention is stated once and governs every stage that slots a minute."

[[criterion]]
id = "R21"
name = "r21_charges_the_surcharge_against_the_prior_tier"
description = "The agent reads the rehandle surcharge against the tier the box stood at before the move, and shows one rehandle with the tier depth it charged."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"
# residue = "The ledger carries the charge without showing which tier it was read against."
# serves = "The surcharge ladder is read against the state before the move, never after it."

[[criterion]]
id = "R22"
name = "r22_takes_the_surviving_lower_revision"
description = "The agent identifies the vessel in /app/data/vessel_call_register.csv whose highest revision sequence is a withdrawn one and which still carries a surviving lower revision, and states which lower revision it took as the applicable call."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"
# residue = "The obligation document carries the result without naming the revision it came from."
# serves = "Revision precedence is the paper that settles which call applies."

[[criterion]]
id = "R23"
name = "r23_takes_the_mass_from_the_filed_row"
description = "The agent identifies a box in /app/data/mass_declaration_returns.psv whose superseded row carries a higher declaration sequence than its filed row, and states which of the two rows it took the mass from."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"
# residue = "The dimensions document carries the mass without naming its row."
