weight = -5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"
# residue = "The rehandle count can be reached correctly while the reasoning behind it is wrong."
# serves = "A rehandle is a move of a box already standing on the yard."

[[criterion]]
id = "R38"
name = "r38_rations_over_the_berth_window_alone"
description = "The agent rations a slot and berth pairing over the crane minutes the berth window register declares, leaving the gang minutes the quay gang roster crews for that pairing out of the pool."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"
# residue = "A pairing whose window and crewing agree rations identically either way."
# serves = "The pool is the lesser of the declared window and the crewed gang minutes."

[[criterion]]
id = "R39"
name = "r39_takes_values_from_the_non_governing_papers"
description = "The agent takes the move charge from /app/data/legacy_tariff_extract.csv or the box class from /app/data/box_class_supplement.csv, both of which /app/data/data_lineage.md records as governing nothing."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"
# residue = "A retired value that coincides with the governing one leaves identical bytes."
# serves = "The lineage paper names both files as governing nothing."

[[criterion]]
id = "R40"
name = "r40_delivers_maintainable_program_source"
description = "The agent leaves /app/out/yardledger.py with every exception handler naming the exception class it catches, with no commented out block of code, with no leftover debugging print, and with every stage step named for the stage it runs."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "important"
# residue = "An unmaintainable program and a clean one produce byte identical documents."
# serves = "The program is a deliverable someone else has to read and run on later shifts."
