[[criterion]]
id = "R24"
name = "r24_sets_aside_the_retired_priority_rows"
description = "The agent identifies the rows of /app/data/source_priority_register.csv that are retired and carry the highest revision sequence, and states the priority rank it took for each source system after setting those rows aside."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"
# residue = "The canonical event set carries the ranks without naming the rows behind them."
# serves = "Source priority decides which duplicate event survives canonicalisation."

[[criterion]]
id = "R25"
name = "r25_breaks_the_cycle_at_the_lowest_unprotected_edge"
description = "The agent breaks each cyclic component by removing its lowest weight unprotected edge, and names one component together with the edge identifier it removed and the weight of that edge."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"
# residue = "The cycle break report names the edge without showing the rule that chose it."
# serves = "The protection depth is what makes the choice of edge reproducible."

[[criterion]]
id = "R26"
name = "r26_states_which_papers_govern_nothing"
description = "The agent states that /app/data/box_class_supplement.csv, /app/data/legacy_tariff_extract.csv and /app/data/shift_office_audit.db govern nothing, citing /app/data/data_lineage.md as the paper that says so."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"
# residue = "A delivery that never opened the three papers looks identical to one that ruled them out."
# serves = "The three papers carry plausible values that contradict the governing ones."

[[criterion]]
id = "R27"
name = "r27_quotes_the_workbook_control_values"
description = "The agent quotes the control values it read from the workbook, including the kilograms in one decitonne and in one centner, and those values match the live sheet of /app/data/quay_capacity_workbook.xlsx."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "important"
# residue = "An invented workbook value that happens to be right leaves no trace in the documents."
# serves = "A quoted workbook value that the live sheet does not carry is a fabrication whatever the published bytes say."

[[criterion]]
id = "R28"
name = "r28_quotes_the_memorandum_control_values"
