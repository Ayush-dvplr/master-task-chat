weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "important"
# residue = "An invented memorandum value that happens to be right leaves no trace in the documents."
# serves = "A quoted pass budget, minimum step or protection depth that the memorandum does not carry is a fabrication whatever the published bytes say."

[[criterion]]
id = "R29"
name = "r29_quotes_the_directive_control_values"
description = "The agent quotes the ordering keys and the class ranks it read from the directive, and those values match the text of /app/data/stowage_ordering_directive.docx."
