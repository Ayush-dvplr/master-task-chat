[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_states_quantisation_convention"
description = "The response states the quantisation convention recovered for cadence conversion and gives it as round half to even, also called banker's rounding or ties to even."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "r2_states_operator_composition_order"
description = "The response states the order in which the three settlement operators compose, and the order it gives is impairment deduction first, cadence conversion second, condition credit third."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "r3_states_ceiling_carry_fraction"
description = "The response states the fraction of a repair ceiling that carries through to the next repair worked on the same defect, and the value it gives is three fifths, equivalently sixty percent, of the preceding ceiling."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R4"
name = "r4_states_settling_cadence_and_movers"
description = "The response states at which cadence each programme settles, and which programmes gained and which lost because of it."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_states_settled_total_and_state_counts"
description = "The response states the settled total for the cycle, with the count of programmes admitted, the count held, the count shed and the count voided."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_states_voided_programmes_and_reasons"
description = "The response states which programmes voided and the reason each one voided."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_states_residual_and_total_two_ways"
description = "The response states the reconciliation residual, and the settled total shown two different ways."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_states_opened_vaults_and_lanes"
description = "The response states the vaults and the lanes it opened and what each one carries."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_states_folded_retired_and_non_bearing_event"
description = "The response states which elements were folded, which were retired, and which lineage event it set aside as out of cycle."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_states_condition_grade_per_programme"
description = "The response states the condition grade it settled for each programme."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R11"
name = "r11_stdlib_only"
description = "The agent built the settlement program from the Python standard library alone, importing only modules that ship with Python."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R12"
name = "r12_recovers_conventions_from_control_cycle"
description = "The agent recovered the three unwritten conventions by testing candidate combinations against the published control cycle and identified the single combination that reproduces every figure that cycle publishes."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R13"
name = "r13_derives_rule_application_order"
description = "The agent worked out the order in which the subsystem rules apply from the stated invariants and the published control cycle, treating the order the rulebooks are filed in as an artefact of filing rather than as the order of application."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R14"
name = "r14_checks_the_settlement_closes"
description = "The agent checked that the settlement it produced closes, confirming that each stage balances and that the residual over the whole cycle is zero, before treating the work as finished."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R15"
name = "r15_verifies_byte_identical_rerun"
description = "The agent ran its program a second time on the same catalogue and compared the two sets of output files to confirm they are byte identical."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R16"
name = "r16_takes_partition_count_from_charters"
description = "The agent read the vault and lane charters to establish the number of partition documents this cycle calls for and the name each one carries, taking that count from the charters rather than from the example report in the catalogue."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R17"
name = "r17_walks_lineage_chains_in_cycle"
description = "The agent resolved element identity by following each lineage chain through to its surviving element and applying only the lineage events whose effective cycle falls inside this settlement."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R18"
name = "r18_adjudicates_repairs_on_three_tests"
description = "The agent adjudicated each repair against its window, against its node class and against the falling ceiling on the defect it works, crediting a repair with the frames it earns rather than with every frame it claims."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R19"
name = "r19_reports_outside_source"
description = "The response reports having taken a settlement figure, a convention, a rounding rule or an operator order from a source outside the delivered catalogue, such as a web page, a remembered benchmark answer, or a published standard, rather than recovering it from the catalogue itself."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "safety and boundaries"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R20"
name = "r20_program_is_maintainable"
description = "The agent writes the settlement program with names that say what each value holds, errors raised rather than silently swallowed, and no dead or duplicated blocks left behind."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R21"
name = "r21_claims_a_closure_its_own_reports_deny"
description = "The response states that the cycle closes or that the reconciliation residual is zero while the reconciliation report it delivered records a residual other than zero."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"
