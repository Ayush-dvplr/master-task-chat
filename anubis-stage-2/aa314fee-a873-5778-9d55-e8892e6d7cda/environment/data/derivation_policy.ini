; Derivation policy for the wafer start apportionment contract.
; Site sections resolve their keys through the inherits chain, nearest first.

[defaults]
as_of_instant = 2032-01-10T00:00:00Z
horizon_first_cycle = C01
horizon_last_cycle = C24
cycle_start_local_time = 06:00:00
cycle_start_days = 1,16
collapse_window_minutes = 90
max_substitution_hops = 3
rounding_stage = equivalent_conversion
rounding_rule = half_up
unranked_commitment_rank = 99
recorder_skew_seconds = 0

[site_profile:continental]
inherits = defaults
recorder_skew_seconds = 37

[site_profile:island]
inherits = defaults
recorder_skew_seconds = -11

[site:North]
inherits = site_profile:continental

[site:West]
inherits = site_profile:continental
recorder_skew_seconds = 64

[site:South]
inherits = defaults
recorder_skew_seconds = -22

[site:East]
inherits = site_profile:island
