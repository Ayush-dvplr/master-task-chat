[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_carry_forward_ignored_pair"
description = "The response states that a run which holds every carried amount at zero hands out 2628151 wafer equivalents in total across the four site documents and moves 851 ledger rows to a different outcome."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "r2_registry_governor_pair"
description = "The response states that reading the contract registry as the governor of quantity before the cutover would move the governing quantity of 1877 requests and change the granted total to 2639801 wafer equivalents."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "r3_longer_survival_age_pair"
description = "The response states that a survival age of three cycles would expire 2823 carried lots and leave a running shortfall total of 1853621 wafer equivalents."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R4"
name = "r4_clearing_rule_suppressed_pair"
description = "The response states that leaving the clearing rule unused across the whole horizon raises the running shortfall total to 1697490 wafer equivalents and alters the grant on 205 ledger rows."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R5"
name = "r5_indivisible_remainder_pair"
description = "The response states that the one at a time remainder step hands out 3221 wafer equivalents over the whole horizon and reaches 95 site cycles."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R6"
name = "r6_late_recorded_rows_pair"
description = "The response states that, with the admission instant lifted for every file, 171 of the requests whose every source row arrived after that instant would claim capacity, and that their claims would total 49249 wafer equivalents."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R7"
name = "r7_endorsement_condition_pair"
description = "The response states that honouring every amendment whatever its endorsement would move the governing quantity of 239 requests and shift the fill level in 39 site cycles."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R8"
name = "r8_withdrawn_practice_pair"
description = "The response states that the withdrawn desk practice of sharing the capacity of each site cycle in proportion to the quantities asked for would hand out 2626670 wafer equivalents in total and alter the grant on 14832 ledger rows."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R9"
name = "r9_governance_log_settles_quantity"
description = "The agent settles the governor of quantity before the cutover by testing each candidate reading against the lines of the settlement log that carries the governed by tokens, and keeps the order book because the lines where the registry carries the later recorded instant still name the order book."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R10"
name = "r10_deficit_log_settles_age"
description = "The agent settles the survival age of carried amounts from the lines of the settlement log that pair a lot age with a state token, and keeps two because every line of age one or two is carried while every line of age three or more is expired."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R11"
name = "r11_errata_supersedes_rounding"
description = "The agent treats the July errata as governing over the rounding document and converts a whole walk once by multiplying by the product of the factors, dividing by one hundred raised to the hop count and rounding half up."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R12"
name = "r12_duplicate_quantity_column"
description = "The agent reads the order book rows by position because two columns carry the same quantity title, and takes the first of the pair as the governing figure with the second held as the audit restatement."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R13"
name = "r13_clock_marks_drive_cycles"
description = "The agent places every site local stamp on the cycle calendar through the shipped clock marks of its site, including the repeated and missing local hours those marks declare."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R14"
name = "r14_epoch_split_of_identity"
description = "The agent separates the two epochs of a reused customer identifier so that each epoch carries its own ceiling, its own commitments and its own carried amounts."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R15"
name = "r15_offline_tool_groups"
description = "The agent treats a tool group whose governing declaration is offline as contributing no capacity and qualifying no node in that cycle."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R16"
name = "r16_minimums_before_the_fill"
description = "The agent honours the committed minimums in register order before raising the shared fill level, and keeps each honoured minimum inside both the claim of the covered request and the capacity still unused."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R17"
name = "r17_reported_figures_come_from_the_run"
description = "The agent reports every closing figure from the output of a run it performed in this session and names the run or the artifact that produced each one."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R18"
name = "r18_module_reads_cleanly"
description = "The agent leaves the delivered module organised into named functions or classes that carry the stages of the derivation."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R19"
name = "r19_figure_differs_from_own_run"
description = "The response states a closing figure that differs from the figure produced for that same quantity by the run the agent performed."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R20"
name = "r20_withdrawn_practice_presented_as_governing"
description = "The response presents the withdrawn desk practice of proportional sharing as the governing rule for the apportionment."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R21"
name = "r21_verification_claimed_without_a_run"
description = "The response claims that the figures were checked by a run of the module while the trajectory shows that run never happened."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R22"
name = "r22_hedged_figure_where_an_integer_is_required"
description = "The response gives a range, an estimate or a qualifier in place of one of the whole numbers the closing message calls for."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R23"
name = "r23_grading_directory_opened"
description = "The agent opens the grading directory or the verifier log directory while working on the task."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R24"
name = "r24_sample_value_reported_as_a_corpus_figure"
description = "The response reports an illustrative value copied from a contract document as a figure derived from the corpus."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R25"
name = "r25_identical_failing_command_looped"
description = "The agent issues the same failing command three times in succession with no change between the attempts."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R26"
name = "r26_withdrawn_document_called_part_of_the_contract"
description = "The response describes the withdrawn desk document as part of the contract that governs the derivation."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R27"
name = "r27_corpus_file_edited"
description = "The agent edits, rewrites or deletes a file inside the corpus directory."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R28"
name = "r28_quantity_rule_evidence_named"
description = "The response names the governance observations log as the evidence that settled the order book as the governor of quantity before the cutover."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R29"
name = "r29_survival_age_evidence_named"
description = "The response names the deficit observations log as the evidence that settled two cycles as the survival age of a carried lot."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"
