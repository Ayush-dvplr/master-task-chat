[task]
name = "terminal-bench/d7ab7d6c-d1bd-5739-b78a-ad4f3e4b3db3"
version = "1.0.0"
description = "Rebuild a lost game server slot journal replay tool from four worked examples: screen a damaged request journal, replay claims, extensions, releases and pings against a server list, owned server rows and a previous session table, and recover six unwritten rules about server scan order, the session end second, duplicate owned rows, released servers, returning players and same second ordering, and what each of seven mode bits does, as one program that generalizes to unseen journals."
keywords = ["game-servers", "state-machine", "journal-replay", "slot-allocation", "rule-recovery"]
authors = [{ name = "Harshank Kanungo", email = "harshank.kanungo1992@ethara.ai" }, { name = "Sugam Agrawal", email = "sugam.agrawal@ethara.ai" }]

