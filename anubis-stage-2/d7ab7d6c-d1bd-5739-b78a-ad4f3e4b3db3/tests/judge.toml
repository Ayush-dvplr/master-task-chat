type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_retransmitted_figure"
description = "The response reports a retransmitted figure of 9 for the live intake."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_active_figure"
description = "The response reports an active figure of 3 for the live intake."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_table_digest_as_written"
description = "The response reports the full table_digest held by the summary.json from its last run over /app/data."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_server_scan_evidence"
description = "The response names a worked example file and a journal seq in it whose outcome shows which free server is offered first when a claim names no usable server, such as example_a_ seq 9, example_b_ seq 8, example_c_ seq 24 or example_d_ seq 14."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_session_end_evidence"
description = "The response names a worked example file and a journal seq in it whose outcome shows whether a session is still live during the second it ends, such as example_a_ seq 9 or example_c_ seq 5."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R11"
name = "r11_duplicate_owned_evidence"
description = "The response names a worked example file and a journal seq in it whose outcome shows which of more than one valid owned.csv row for one player stands, such as example_a_ seq 1, example_b_ seq 16, example_c_ seq 24 or example_d_ seq 27."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R12"
name = "r12_released_server_evidence"
description = "The response names a worked example file and a journal seq in it whose outcome shows whether a released server can be claimed again before the released session would have ended, such as example_a_ seq 14, example_b_ seq 21, example_c_ seq 2 or example_d_ seq 13."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R13"
name = "r13_returning_player_evidence"
description = "The response names a worked example file and a journal seq in it whose outcome shows which server a player who claimed before is offered when they claim again, such as example_a_ seq 7 or example_b_ seq 3."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R14"
name = "r14_same_second_order_evidence"
description = "The response names a worked example file and a journal seq in it whose outcome shows the order of records that share one second, such as example_a_ seq 18 ahead of seq 16, example_b_ seq 21 ahead of seq 5 or example_d_ seq 23 ahead of seq 10."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R15"
name = "r15_server_scan_reading"
description = "The response states that the server scan offers the free server with the most slots first, with ties going to the server name that sorts first."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R16"
name = "r16_session_end_reading"
description = "The response states that a session ends at the second its until arrives, so its server is free for another claim at that second."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R17"
name = "r17_duplicate_owned_reading"
description = "The response states that when a player has more than one counted owned.csv row, the first such row stands."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R18"
name = "r18_released_server_reading"
description = "The response states that a released server cools down until the second the released session would have ended."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R19"
name = "r19_returning_player_reading"
description = "The response states that a player who claimed before is offered the server of their latest session again ahead of the server scan."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R20"
name = "r20_same_second_order_reading"
description = "The response states that records sharing one second replay releases first, then extends, then claims, then pings, in seq order within each kind."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R21"
name = "r21_states_example_reproduction"
description = "The response says whether its program reproduced all four worked examples byte for byte."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R22"
name = "r22_runs_over_live_intake"
description = "The agent runs /app/out/arena.py over /app/data into an output directory outside /app/data."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R23"
name = "r23_reads_notes_first"
description = "The agent reads conventions.md, reports.md and handover.md before it writes the first version of /app/out/arena.py."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R24"
name = "r24_compares_against_examples"
description = "The agent compares the output of its program on each of the four worked examples against the matching example_a_out_, example_b_out_, example_c_out_ or example_d_out_ files."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R25"
name = "r25_writes_named_functions"
description = "The agent writes /app/out/arena.py as named functions."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
