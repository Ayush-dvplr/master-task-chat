[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_claims_figure"
description = "The response reports a claims figure of 32 for the live intake."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_extends_figure"
description = "The response reports an extends figure of 2 for the live intake."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_releases_figure"
description = "The response reports a releases figure of 4 for the live intake."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_refusals_figure"
description = "The response reports a refusals figure of 22 for the live intake."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
