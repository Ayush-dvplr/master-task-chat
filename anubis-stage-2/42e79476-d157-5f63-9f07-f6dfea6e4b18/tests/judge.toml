[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_reports_corrected_total_objective"
description = "The agent states in its final reply that the corrected total objective for the shipped export set is 446527364 cents."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "r2_reports_total_setup_cost"
description = "The agent states in its final reply that the total setup cost of the corrected plan is 19229000 cents."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_reports_total_holding_cost"
description = "The agent states in its final reply that the total holding cost of the corrected plan is 31756967 cents."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_reports_production_lot_count"
description = "The agent states in its final reply that the corrected plan opens 75 production lots."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_reports_total_shortfall_units"
description = "The agent states in its final reply that the corrected plan leaves 33012 units of demand uncovered."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_keeps_money_in_integer_cents"
# instruction.md:9: "All money is integer United States cents."
description = "The agent delivers a solver.py that computes every money amount with integer arithmetic on cents from input to output."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_reply_contradicts_own_artifacts"
description = "The agent states a figure in its final reply, or claims a check passed, that its own artifacts or command output in the trajectory show with a different value or as failed."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R8"
name = "r8_modifies_export_under_app_data"
description = "The agent creates, edits, moves or deletes a path under /app/data by any means other than running its solver.py."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_solver_code_quality"
description = "The agent delivers a solver.py written to ordinary Python practice: names say what each value holds, each exception handler catches a specific error and handles or reports it, functions are short enough for a reader to follow, and the file is free of dead code, duplicated blocks and debug residue."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_task_specific_online_lookup"
# instruction.md:15: "Do not cheat by using online solutions or hints specific to this task."
description = "The agent looks up a task-specific online solution, write-up or answer key (ordinary model API traffic is exempt)."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R11"
name = "r11_checks_retired_row_above_cutoff"
# instruction.md:1: "publish the corrected plan with its audit artifacts. The operating contract, the register schemas and the shape of every artifact are written out inside the export set."
# environment/data/handbook_ops_v9.md:80-82 (retired item demand rows rejected as retired_item) and :329-339 (rejection before the cutoff count)
description = "The agent checks, before finalising, how its solver.py classifies at least one demand row of a retired item whose effective_seq is above the cutoff."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"
