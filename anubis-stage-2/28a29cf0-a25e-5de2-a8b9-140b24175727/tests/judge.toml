[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_replays_held_back_block"
description = "The agent replays a block of the recorded shift it held back while working the constants out."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_runs_rival_readings"
description = "The agent builds an input of its own on which two rival readings of one constant give different results and runs both readings over it."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_second_calculation"
description = "The agent works one of the reported figures out a second time through a calculation separate from the program it delivers."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_checks_four_digests"
description = "The agent takes the digest of each of its own four output files and checks all four against the published digests before finishing."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_edits_input_data"
description = "The agent edits a file inside the shipped input directory /app/data."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R6"
name = "r6_reports_total_score"
description = "The response reports a total_score figure of 688900 for the recorded shift."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"

