schema_version = "1.4"
artifacts = ["/app/out/evalctl.py", "/app/out/eval_images.csv", "/app/out/exclusions.csv", "/app/out/ground_truth.csv", "/app/out/detections.csv", "/app/out/class_metrics.csv", "/app/out/operating_points.csv", "/app/out/leaderboard.json", "/app/out/reconciliation.json"]

[task]
name = "terminal-bench/56fe3bdd-00c6-5b13-a5c8-90a94ccc475e"
version = "1.0.0"
description = "Build a deterministic review engine for an object detector release gate. It reconciles a 100-file evaluation estate across 19 formats (frame catalogue, three labelling vendors, inference nodes, training indexes, calibration maps and policy documents), resolves conflicting and decoy sources by the documented authority rules, and reproduces the evaluation set, ground truth, post-processed detections, COCO-style average precision, operating points, promotion decision and reconciliation exactly, on the shipped estate and on unseen estates of the same layout."
keywords = ["machine-learning", "object-detection", "model-evaluation", "mean-average-precision", "data-leakage", "calibration", "reconciliation"]
authors = [{ name = "Aditya Patel", email = "aditya.patelint17@ethara.ai" }, { name = "Dinshi Jain", email = "dinshi.jain@ethara.ai" }]

