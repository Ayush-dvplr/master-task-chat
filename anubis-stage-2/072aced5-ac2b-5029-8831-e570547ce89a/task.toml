[task]
name = "terminal-bench/072aced5-ac2b-5029-8831-e570547ce89a"
version = "1.0.0"
description = "Repair a keyframe interval ledger whose generated interval snapshot, interval index, and encoder runtime disagree, then regenerate, restart, replay the encode journal, and reconcile every layer against the interval authority."
keywords = ["keyframe-interval", "timeline", "reconciliation", "encode-journal", "stdlib"]
authors = [
    { name = "Kunwar Singh", email = "kunwar.singh@ethara.ai" },
    { name = "Dinshi Jain", email = "dinshi.jain@ethara.ai" },
]
[metadata]
category = "Data Processing"
platforms = ["linux/amd64", "linux/arm64"]
tags = ["keyframe-interval", "timeline", "reconciliation", "encode-journal", "stdlib"]
estimated_duration_sec = 7200
expert_time_estimate_min = 480
junior_time_estimate_min = 1440
null_floor = 0.0
discrimination_weight = 1.0

[verifier]
timeout_sec = 2700
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com", "host.docker.internal"]

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com", "host.docker.internal"]

[agent]
timeout_sec = 7200
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.z.ai"]
user = "1000:1000"

[environment]
build_timeout_sec = 900
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 8192
gpus = 0
mcp_servers = []
