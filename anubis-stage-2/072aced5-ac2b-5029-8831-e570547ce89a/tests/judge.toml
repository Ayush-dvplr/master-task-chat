[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_candidate_map_rows_shown"
description = "The agent shows the candidate generation map rows it compared for the record it rewrote and the published value each of those rows yields."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "r2_rewritten_record_identity"
description = "The response states the sequence number of the authority record it rewrote together with the published value it settled for that record."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "r3_reference_domain_conversion"
description = "The response names the reference domain the rewritten record carried and the reference domain the contract requires, and says why the recorded domain forces a conversion through the generation map."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R4"
name = "r4_recovery_transition_order"
description = "The agent runs the recovery transitions in the order correct_interval_record, regenerate_interval_snapshot, rebuild_interval_index, restart_encoder_runtime, replay_encode_journal, reconcile_interval_layers."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_state_digest_reported"
description = "The response reports the state digest it reached."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_divergence_count_and_names"
description = "The response reports the count of render tracks that diverged from the keyframe interval ledger before the repair and names each of them."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R7"
name = "r7_divergent_layer_and_value"
description = "The response names, for each render track it reports as diverged, the derived layer that disagreed with the ledger and the value that layer carried."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R8"
name = "r8_repaired_track_weighted_and_rank"
description = "The response reports the weighted contribution and the rank it recorded for the render track it repaired."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_preserved_records_reason_and_value"
description = "The response names each record it preserved unchanged, with the reason that record was preserved and the value it kept."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_changed_record_count"
description = "The response reports the count of authority records it changed."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R11"
name = "r11_reproducer_described"
description = "The response describes the reproducer it shipped as a standard library program that takes an input directory and an output directory and writes reproduced_state.json."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R12"
name = "r12_abandoned_account_named"
description = "The response states which causal account it abandoned and which recovery transition invalidated it."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R13"
name = "r13_account_covers_late_evidence"
description = "The response explains how its final account covers both the evidence available at the start and the evidence that appeared after the encode operations journal replay."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R14"
name = "r14_digest_before_and_after_replay"
description = "The agent shows the state digest it holds before the encode operations journal replay and the digest it recomputes after that replay."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R15"
name = "r15_anchor_settlement_justified"
description = "The response justifies selecting the lineage anchor ln-12-1 over the superseded anchor ln-12-2 by citing the settlement rule of the interval authority policy."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R16"
name = "r16_index_rebuild_value_invariant"
description = "The response states that rebuilding the interval index leaves every canonical authority value unchanged, which is why the stale index account survives the rebuild until the journal replay falsifies it."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R17"
name = "r17_rollback_position_resolved"
description = "The agent counts the positions of the surviving authority record set that the encode operations journal rollback addresses and resolves target position 11 to main-program."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R18"
name = "r18_compiler_notes_read_for_compile_pass"
description = "The agent reads generated_interval_snapshot_compiler_notes.md and uses the compile pass it describes to account for the generated interval snapshot carrying the recorded alternate key."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R19"
name = "r19_single_record_sufficiency_argued"
description = "The response argues from the evidence why rewriting one authority record brings every layer into agreement with the keyframe interval ledger."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R20"
name = "r20_competing_amendment_evidence"
description = "The agent shows both generation 44 authority records for credits-roll and the evidence it uses to choose which one the durable state carries."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R21"
name = "r21_durable_state_sourced_from_authority"
description = "The agent sources every published value in the durable state from the keyframe interval ledger and the maps it reads."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R22"
name = "r22_reproducer_names_absent_input"
description = "The agent ships a reproducer that names which input file is absent when the directory given by --input lacks a file the resolution reads."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R23"
name = "r23_negative_digest_mismatch"
description = "The response reports a state digest that differs from the digest value present in the metrics artifact it wrote."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R24"
name = "r24_negative_reconciliation_verdict_as_proof"
description = "The response presents the agreement verdict of the interval reconciliation report as confirmation that the system is repaired."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R25"
name = "r25_negative_cohort_digest_as_proof"
description = "The response presents the interval conformance fixtures cohort digest as confirmation of the thumb-strip published value."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R26"
name = "r26_reproducer_code_quality"
description = "The agent writes the shipped reproducer as code a reviewer would accept, with named helpers, errors surfaced to the caller, and every block doing work the program uses."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R27"
name = "r27_out_directory_confined"
description = "The agent leaves /app/out holding only the fourteen artifacts the instruction names."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "state_change"
importance = "important"
