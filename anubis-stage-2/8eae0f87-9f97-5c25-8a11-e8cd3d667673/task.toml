[task]
name = "terminal-bench/8eae0f87-9f97-5c25-8a11-e8cd3d667673"
version = "1.0.0"
description = "Build a reusable standard-library program that meters a multi-region SQL query fleet for one billing period. It resolves each node's clock against the reference node from the stage transfer journal, orders every query by its billing instant, applies daily free scan allowances, rate windows, rate cards, tenant merges and late corrections in integer micro-units, and writes a canonical query ledger, a reconciliation summary, a data-quality report and roll-ups by product, region and tenant segment. The same program must produce exact reports for other extracts in the same layout, and the final message answers a set of what-if questions."
keywords = ["query-metering", "clock-offset", "billing", "data-pipeline", "stdlib"]
authors = [{ name = "Aditya Jain", email = "aditya.jainint17@ethara.ai" }, { name = "Poonam Chourey", email = "poonam.chourey@ethara.ai" }]

