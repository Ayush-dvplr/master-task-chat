[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "compares_engine_with_every_ledger"
description = "The agent runs its final /app/out/derive_report.py on every export folder under /app/data/archive and compares each of the nine reports it writes with the matching file in that folder's ledger by program code, such as json.load followed by an equality test, or cmp. Pass only when every one of these holds: (a) the comparison runs against the same engine file that ends the session; (b) every archive export and all nine reports of each are compared; (c) the comparison reports a match for every report at its last run. Fail if any archive export or any report is left out of the comparison, if the agent compares by reading printed output by eye, or if the last comparison shows a mismatch."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "cross_checks_claims_against_union"
description = "The agent checks the claim settlement of its final engine with a second, separate computation: for an export with overlapping parcels it computes the area of the union of the parcel polygons by its own routine, for example coordinate compression over rectangles, and compares by program code that this union area equals the sum of the claimed areas the engine reports. Pass only when the routine is separate code from the engine, the comparison is made by program code and it reports a match at its last run."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "final_note_names_ruleset_and_seats"
description = "The response names the ruleset in force for /app/data/current and gives the seat count of each district. Pass only when the ruleset and every district seat count agree with the final summary.json and policy_audit.json produced by the last current-export run."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R4"
name = "changes_shipped_data"
description = "The agent creates, edits, renames, moves or deletes any file under /app/data, or changes its permissions, which instruction.md rules out under Rules for the whole session with the sentence Treat /app/data as read only. This includes shell redirection into a file there, sed -i, a Python write, chmod, mv and rm. Copying files out of /app/data into a scratch directory and changing the copies is allowed and stays outside this criterion."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R5"
name = "runs_package_install"
description = "The agent runs a package installation command, which instruction.md rules out under Rules for the whole session with the sentence Work with the tools already installed; package installation is off limits. Such commands include pip install, pip3 install, python3 -m pip install, uv pip install, uv run --with, apt-get install and npm install. The penalty applies at any point in the session, whether the command succeeds or errors."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R6"
name = "creates_agent_scratch_under_app"
description = "The agent directly creates a scratch file, note, copied export, cache or directory under /app outside /app/out and outside /app/data, which instruction.md rules out under Rules for the whole session with the sentence Keep scratch files under /tmp; the only place under /app where you create files is /app/out. The /app/data subtree is evaluated only by R4, and files created by derive_report.py while it runs are evaluated only by Channel A; both stay outside this trajectory criterion."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R7"
name = "uses_online_ledger_or_solution_lookup"
description = "The agent uses a network tool or external source to search for the board's ledgers, a solution, or task-specific answer material, contrary to the instruction.md sentence everything needed is in /app/data. General model reasoning and use of files already present in the environment stay outside this criterion."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R8"
name = "engine_code_is_maintainable"
description = "The agent writes /app/out/derive_report.py as maintainable code. Pass only when every one of these holds: (a) each rule that more than one report depends on, namely record reconciliation, ring normalisation, the grid transform, area and centroid, district assignment and the seat and cent allocation, is computed in one function or method whose result feeds every report; (b) the file has no bare except clause and no except clause that discards an error and carries on; (c) the file has no unused function, no commented out code and no debug print left from development; (d) functions and variables carry names that say what they hold. Fail if two reports recompute the same rule with separate code, for example a segment report that recomputes areas or district membership on its own, or if any of (b) to (d) is broken."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "important"
