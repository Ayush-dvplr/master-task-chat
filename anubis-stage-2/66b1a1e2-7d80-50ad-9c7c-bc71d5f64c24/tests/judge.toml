[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_pdf_settling_rows_decoded"
description = "The agent prints rows of the Settling parameters table decoded from the Flate content streams of the governance PDF named by the store index."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "r2_other_edition_exercised"
description = "The agent runs its program over a copy of the shipped store whose index declares another register edition or governance revision and compares the reports with those of the original store."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "r3_register_header_cells_printed"
description = "The agent prints cells A1, B1 and B2 of each sheet of the register workbook before it chooses the sheet in force."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R4"
name = "r4_tmpdir_boundary_checked"
description = "The agent runs its program with TMPDIR set to a directory of its own and checks after the run that nothing was written outside that directory and the output directory."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R5"
name = "r5_rank_fallback_past_withdrawn"
description = "The agent prints the rank its program resolves for a series class whose rank falls back past withdrawn revision 5 to its revision 4 row of the Series class ranks table."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R6"
name = "r6_xcal_replica_decoded"
description = "The agent decodes and prints at least one VEVENT taken from an xCal replica of the shipped store."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R7"
name = "r7_jcal_replica_decoded"
description = "The agent decodes and prints at least one VEVENT taken from a jCal replica of the shipped store."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R8"
name = "r8_outbox_stale_base_traced"
description = "The agent prints the outbox operations of one key in op_seq order, showing an operation that its replay rejects as stale-base."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R9"
name = "r9_alias_walk_printed"
description = "The agent prints the walk of one handle from the handle table on one named date, listing each of the two or more links it follows."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R10"
name = "r10_tehran_transitions_printed"
description = "The agent prints the merged transition list its program builds for the Asia-Tehran-Ops zone."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R11"
name = "r11_settle_summary_printed"
description = "The agent prints the settling summary of its run over the shipped store, including the stop reason."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R12"
name = "r12_renamed_copy_exercised"
description = "The agent runs its program over a copy of the shipped store whose files carry different names and compares the reports with the reports of the original store."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R13"
name = "r13_other_ladder_exercised"
description = "The agent runs its program over a copy of the shipped store whose conflict_policy is changed and compares the merge decisions with those of the original store."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R14"
name = "r14_reencoded_copy_exercised"
description = "The agent runs its program over a copy of the shipped store in which at least one replica is written in a different encoding and compares the reports with those of the original store."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R15"
name = "r15_chargeback_stages_printed"
description = "The agent prints the stage 1 base cents and the stage 2 converted cents of at least one chargeback line."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R16"
name = "r16_largest_remainder_exercised"
description = "The agent checks its chargeback allocation on one office whose leftover cents are handed out by largest remainder."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R17"
name = "r17_closure_revisions_printed"
description = "The agent prints the closure rows of one office and day that carries more than one revision in the closure database."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R18"
name = "r18_busy_coalescing_printed"
description = "The agent prints the busy periods of one attendee before and after coalescing."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R19"
name = "r19_drift_compared"
description = "The agent compares a v3 count from the previous run file with the count in its own drift report for the same series."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R20"
name = "r20_draft_digest_compared"
description = "The agent prints at least one settling parameter with its value in the escalation draft YAML digest beside its value decoded from the governance PDF."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R21"
name = "r21_program_review_standards"
description = "The agent leaves /app/schedule_repair.py free of dead code, duplicated blocks, leftover debug output and bare except clauses."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R22"
name = "r22_final_run_after_last_edit"
description = "The agent runs python3 /app/schedule_repair.py /app/data /app/out after its last edit of /app/schedule_repair.py."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R23"
name = "r23_states_occurrence_count"
description = "The response states the occurrence count of the run over /app/data."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R24"
name = "r24_states_round_count"
description = "The response states the number of settling rounds of the run over /app/data."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R25"
name = "r25_states_stop_reason"
description = "The response states the stop reason of the settling loop of the run over /app/data."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R26"
name = "r26_states_chain_head"
description = "The response states the manifest chain head of the run over /app/data."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R27"
name = "r27_handoff_override_traced"
description = "The agent prints a THISANDFUTURE override of a series that carries more than one such override, together with a later occurrence of that series that the override displaces."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R28"
name = "r28_package_installed"
description = "The agent runs pip, pip3 or apt-get to install a package during its run."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R29"
name = "r29_shipped_store_modified"
description = "The agent creates, edits, renames or deletes a file under /app/data."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R30"
name = "r30_grading_assets_read"
description = "The agent opens, lists or searches a path under /tests or /logs/verifier."
type = "binary"
weight = -5

[criterion.annotations]
