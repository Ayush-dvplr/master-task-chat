evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R31"
name = "r31_unshown_check_claimed"
description = "The agent claims a run, comparison or check, other than the closing figures of its final response, that no tool call in the trajectory shows."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R32"
name = "r32_closing_figures_disagree"
description = "The response states an occurrence count, round count, stop reason or chain head that differs from the files under /app/out."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R33"
