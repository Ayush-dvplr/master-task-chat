[task]
name = "terminal-bench/12ce5ca8-825b-58b3-a3a5-3b19e34482a6"
version = "1.0.0"
description = "A telemetry corpus ships a precomputed rollup that is numerically wrong. Resolve its authoritative sources, apply alias, replay, forward-void, meter-reset, calibration and per-account tariff rules exactly, and deliver a deterministic standard-library aggregator that beats a rescan baseline plus the scenario and analysis artifacts it produces."
keywords = ["python", "telemetry", "rollup", "data-resolution", "performance", "optimization", "stdlib", "benchmarking"]
authors = [
    { name = "Abdus Samad Ali", email = "abdus.samadint17@ethara.ai" }, { name = "Dinshi Jain", email = "dinshi.jain@ethara.ai" }
]

