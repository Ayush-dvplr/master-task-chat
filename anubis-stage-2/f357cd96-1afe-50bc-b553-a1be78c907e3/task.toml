[task]
name = "terminal-bench/f357cd96-1afe-50bc-b553-a1be78c907e3"
version = "1.0.0"
description = "Derive an exact multi-epoch scheduling report for an HTTP/3 reverse-proxy fleet under coupled fair-share, migration, preemption, token-bucket, and latency-SLO constraints, four of whose settlement rules must be recovered by falsification against a set of sealed reference corpora."
keywords = ["optimization", "scheduling", "fair-share", "largest-remainder", "fixed-point", "http3", "reverse-proxy", "withheld-rule-recovery", "sealed-oracle", "medium"]
authors = [
    { name = "Abdus Samad Ali", email = "abdus.samadint17@ethara.ai" },
    { name = "Dinshi Jain", email = "dinshi.jain@ethara.ai" },
]

[metadata]
category = "Optimization"
platforms = ["linux/amd64", "linux/arm64"]
tags = ["optimization", "scheduling", "fair-share", "http3", "medium"]
estimated_duration_sec = 12600.0
expert_time_estimate_min = 210.0
