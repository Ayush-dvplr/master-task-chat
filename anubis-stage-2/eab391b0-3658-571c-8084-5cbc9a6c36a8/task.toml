[task]
name = "terminal-bench/eab391b0-3658-571c-8084-5cbc9a6c36a8"
version = "1.0.0"
description = "Rebuild a lost monorepo dependency resolver from two worked examples and the digests of a live intake: screen a damaged package index feed, resolve version ranges with caret, tilde and OR groups through a first in first out queue, honour pins and a previous lock, record conflicts and unresolved requirements, recover six unwritten rules about republished copies, release candidates, yank timing, sticky picks, queue order and repeated pins, and work out what each of seven undocumented mode word bits changes, as one program that generalizes to unseen intakes."
keywords = ["dependency-resolution", "semver", "lockfile", "monorepo", "rule-recovery"]
authors = [{ name = "Harshank Kanungo", email = "harshank.kanungo1992@ethara.ai" }, { name = "Sugam Agrawal", email = "sugam.agrawal@ethara.ai" }]

