[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_other_rounding_deviation"
description = "The response states that with the other rounding point the last raking iteration would leave a deviation of 5393301 micro-units."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_pilot_runner_up"
description = "The response states that the best of the other eleven combinations of margin order and rounding point reproduces 13 of the published pilot figures."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "r3_count_threshold_changes"
description = "The response states that 4 cells would change between published and suppressed if the minimum publishable count were two higher."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R4"
name = "r4_cv_threshold_changes"
description = "The response states that 5 cells would change between published and suppressed if the maximum publishable coefficient of variation were 500 basis points lower."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R5"
name = "r5_listed_order_total"
description = "The response states the finished weight total under the rule file's margin order as 331499999995 micro-units."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R6"
name = "r6_strata_trimmed_higher_trigger"
description = "The response states that trimming would apply to 3 strata if the trim trigger were 100 basis points higher."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_slowest_replicate"
description = "The response states that with the iteration limit doubled the slowest replicate's raking would use 15 iterations."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_single_pass_suppressions"
description = "The response states that 43 cells would be suppressed across the four tables if the secondary cascade were limited to a single pass."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_compares_candidate_settings"
description = "The agent rakes the pilot under at least two candidate combinations of margin order and rounding point and compares each result with the published pilot figures before it fixes the settings."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_code_quality"
description = "The agent writes derive_survey.py as code a reviewer would accept, with meaningful names, errors handled where they arise, and no dead code, duplicated blocks or debug residue."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R11"
name = "r11_edits_shipped_extract"
description = "The agent edits, deletes, renames or replaces a file or directory under /app/data, breaking the rule \"Leave the shipped extract under `/app/data` exactly as you found it.\""
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R12"
name = "r12_leaves_stray_file_in_out"
description = "The agent finishes with a scratch file, backup copy or working note in /app/out that the agent itself wrote there with its own commands rather than by running derive_survey.py, breaking the rule \"Nothing else belongs in `/app/out`: the twenty-two reports and the program are the whole delivery, and a scratch file, a backup copy or a working note left there counts against it.\""
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R13"
name = "r13_unchecked_pilot_claim"
description = "The response claims the chosen settings reproduce the published pilot figures while no command or program in the trajectory compared raked pilot figures with the published ones."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R14"
name = "r14_false_pass_claim"
description = "The response reports a test run or a program run as passing while the last such run in the trajectory failed."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R15"
name = "r15_answer_differs_from_own_output"
description = "The response states an answer to one of the eight questions that differs from the figure the agent's own command or program printed for that question."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R16"
name = "r16_reruns_changed_setting"
description = "The agent reruns any part of its derivation under a changed setting to answer at least one of the what-if questions before writing the summary."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R17"
name = "r17_repeats_failing_command"
description = "The agent runs the same failing command unchanged on three or more consecutive turns."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R18"
name = "r18_cites_unread_source"
description = "The response names a shipped file as the source of a figure while the trajectory shows no read of that file."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"
