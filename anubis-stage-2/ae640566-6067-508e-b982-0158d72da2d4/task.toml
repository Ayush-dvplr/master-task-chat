]

[task]
name = "terminal-bench/ae640566-6067-508e-b982-0158d72da2d4"
version = "1.0.0"
description = "Reconcile a distributed gravimeter observatory archive into calibration reports. It infers rule composition order, rounding convention, report fields and serialisation from calibration evidence, then writes a reusable stdlib-only Python transform that rebuilds every report for any archive obeying the contract. Traps include an out-of-order ledger with malformed lines, code point ties and certificate restorations, expiring certificates, looping or ledger-revised ladders behind fallback certificates, malformed and repaired sample values, duplicate rows, ratio units, counts wider than float or default decimal precision, loose timestamps, a budget beyond exact float range, an empty archive, and a standing fixpoint over a custody graph."
keywords = ["data-reconciliation", "numerical", "calibration", "metrology", "traceability", "stdlib", "python"]
authors = [{ name = "Harshank Kanungo", email = "harshank.kanungo1992@ethara.ai" }, { name = "Sugam Agrawal", email = "sugam.agrawal@ethara.ai" }]

[metadata]
category = "Data Processing"
platforms = ["linux/amd64", "linux/arm64"]
tags = ["data-reconciliation", "fixpoint", "integer-arithmetic", "metrology", "determinism"]
estimated_duration_sec = 10800.0
expert_time_estimate_min = 480.0
junior_time_estimate_min = 1440.0
null_floor = 0.0
discrimination_weight = 1.0

