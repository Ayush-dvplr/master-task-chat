[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_compares_control_outcomes_with_the_worked_example"
description = "The agent runs its derivation on the calibration control records and compares the outcomes it gets with the outcomes recorded in calibration_slice.json or calibration_example.json."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_hand_rounds_one_half_nanounit_case"
description = "The agent works through one calibration control quantity that lands exactly on a half nanounit, rounds it by hand, and compares the result with the figure in calibration_example.json."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_program_reconciles_its_own_reports"
description = "The agent writes derive_report.py so that it re-reads the reports it has just written, checks them against one another, and exits with a nonzero status on a disagreement, following the instruction sentence that the program itself re-reads the reports it has just written, checks that they agree with one another, and exits with a nonzero status when they disagree."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_prints_raw_amendment_ledger_lines"
description = "The agent prints raw lines of /app/data/amendments.jsonl, a damaged line that json.loads rejects among them, before it writes its ledger replay code."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_hand_traces_one_reporting_round"
description = "The agent works out by hand the reporting round of one channel from its qualifying count, the threshold bands and its custody holder, and compares that round with reporting_round_by_array in the policy audit its program wrote."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R6"
name = "r6_hand_sums_one_ladder_correction"
description = "The agent sums the ratios on one certificate's traceability path toward the primary standard by hand and compares the total with ladder_ppm_by_certificate in the policy audit its program wrote."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_runs_the_program_on_an_archive_it_altered"
description = "The agent builds a second archive by changing a copy of /app/data, runs derive_report.py on it into a separate output location, and reads the reports that run produced."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_delivers_reviewable_derivation_code"
description = "The agent leaves /app/out/derive_report.py as reviewable code, with function names that describe their job, except clauses that each name an exception class, and no dead code or leftover debug print."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_negative_edits_the_shipped_archive"
description = "The agent changes, renames or deletes a file under /app/data during the session, which the instruction sentence listing what the agent must avoid forbids by naming editing inputs."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R10"
name = "r10_negative_claims_success_its_last_comparison_contradicts"
description = "The response states that the reports reconcile with the calibration control while the last comparison of the two in the trajectory shows a mismatch."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R11"
name = "r11_negative_claims_a_check_absent_from_the_session"
description = "The response claims a derive_report.py run or a check that appears nowhere in the trajectory."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R12"
name = "r12_negative_reruns_an_identical_failing_command"
description = "The agent runs the same failing command unchanged on three or more consecutive turns."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"
