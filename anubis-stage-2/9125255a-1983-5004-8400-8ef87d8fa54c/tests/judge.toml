[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_reads_authority_first"
description = "The agent opens certification_policy.md and source_conventions.md before it writes the code that resolves conflicting result rows."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_checks_control_figures"
description = "The agent compares its reconstructed per-job result counts or totals with control_totals.html before it finishes."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "r3_keeps_contradicted_rule"
description = "The agent keeps using an interpretation after its own check against the shipped data shows a mismatch."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_documented_precedence"
description = "The agent reads field_precedence.html and applies its per-field winners to jobs whose results appear in two sources."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R5"
name = "r5_partial_authority"
description = "The agent takes from a partly authoritative export only the part the policy names, such as the presentation field of the rescored judge export."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_named_functions"
description = "The agent's certify.py puts parsing, rule resolution and metric computation in separate named functions."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_explicit_error_handling"
description = "The agent's certify.py handles a missing or unparseable input with an explicit check or an except clause that names a specific exception type."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_reports_reconciliation"
description = "The response lists the outputs whose figures differ from the published control figures, or states that every output matched them."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_opens_grading_material"
description = "The agent opens a file under /tests, /solution or /logs/verifier during its run."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R10"
name = "r10_edits_input_data"
description = "The agent edits, moves or deletes a file under /app/data during its run."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R11"
name = "r11_repeats_failing_command"
description = "The agent runs the same failing command unchanged on three or more consecutive turns."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"
