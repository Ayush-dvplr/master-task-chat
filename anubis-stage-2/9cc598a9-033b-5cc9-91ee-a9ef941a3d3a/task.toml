[task]
name = "terminal-bench/9cc598a9-033b-5cc9-91ee-a9ef941a3d3a"
version = "1.0.0"
description = "Repair a broken Python 3.12 restore planning package so it follows the approved restore specification and its incorporated documents, then use it to plan a point-in-time restore of a file share from a backup catalog feed of about a hundred files in twenty formats, full of superseded documents, decoy copies and conflicting sources. The repaired package is also run on a hidden feed for another share."
keywords = ["python", "packaging", "file-operations", "backup-restore", "catalog-replay", "build-repair", "specification-compliance"]
authors = [{ name = "Aditya Patel", email = "aditya.patelint17@ethara.ai" }, { name = "Dinshi Jain", email = "dinshi.jain@ethara.ai" }]

