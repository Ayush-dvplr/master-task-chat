[features]
numeric = ["amount_usd_cents", "account_age_days", "txn_count_24h", "amount_sum_7d_usd_cents", "merchant_cb_rate_bps", "ip_risk_score", "kyc_tier"]
categorical = ["entry_mode", "mcc_risk_group", "issuer_group"]

[[feature]]
name = "amount_usd_cents"
definition = "event amount converted to USD cents (currency handbook)"

[[feature]]
name = "account_age_days"
definition = "floor((event_time - account created_at) / 86400)"

[[feature]]
name = "txn_count_24h"
definition = "number of other kept events of the canonical account with event_time in [t - 86400, t)"

[[feature]]
name = "amount_sum_7d_usd_cents"
definition = "sum of amount_usd_cents of kept events of the account with event_time in [t - 604800, t)"

[[feature]]
name = "merchant_cb_rate_bps"
definition = "point-in-time merchant risk value (feature availability specification)"

[[feature]]
name = "ip_risk_score"
definition = "point-in-time IP reputation score of the example's IP (missing without IP)"

[[feature]]
name = "kyc_tier"
definition = "tier of the latest counted KYC review effective at or before t, else the default for (segment, region of the postal code) in force at t; reviews with tier 9 or overturned by an appeal decided at or before the label cutoff do not count"

[[feature]]
name = "entry_mode"
definition = "entry_mode token of the entry code (entry mode code list); UNKNOWN when unlisted or missing"

[[feature]]
name = "mcc_risk_group"
definition = "risk group of the merchant's MCC sub-code at t (preprocessing standard); UNMAPPED when unlisted"

[[feature]]
name = "issuer_group"
definition = "issuer_group of the longest bin_prefix in the BIN ranges that is a prefix of the card BIN; UNMAPPED when none"

# kept events: keepers whose status is approved or settled, including lookback context and
# examples later excluded for consent, retraction or labels; replay, voided and duplicate records never count.

