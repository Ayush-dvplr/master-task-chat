[task]
name = "terminal-bench/9f5486ac-ace6-5767-85e3-14ebb268f410"
version = "1.0.0"
description = "Build a point-in-time-correct fraud-model training-set release from 100 conflicting exports (six transaction systems, three chargeback networks, analyst cases, vendor annotations, feature snapshots, registries, policies and look-alike decoys): reconcile lineage controls, deduplicate across systems, resolve labels with maturity censoring, split by device-linked account clusters, fit train-only winsorization, robust scaling, vocabularies and effective-number class weights, score a baseline and measure drift, and ship a deterministic builder that is re-run as a delta release on hidden next-period exports."
keywords = ["machine-learning", "data-pipeline", "training-data", "point-in-time", "leakage", "deduplication", "label-maturity", "multi-format"]
authors = [{ name = "Bhavik Jain", email = "bhavik.jain86@ethara.ai" }, { name = "Poonam Chourey", email = "poonam.chourey@ethara.ai" }]

