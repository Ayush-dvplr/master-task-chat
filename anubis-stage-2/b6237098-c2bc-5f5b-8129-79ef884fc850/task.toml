[task]
name = "terminal-bench/b6237098-c2bc-5f5b-8129-79ef884fc850"
version = "1.0.0"
description = "Replace a crash-dump pipeline's legacy decoder with a spec-exact decoder and a byte-exact encoder for a binary container, reporting record and fault offsets and refusing hand-edited documents. Beyond the documented revision, recover two undocumented field-build lines from forensic evidence and implement a third documented transition line, including changed CRC-32 parameters, folded keystream starts, delta storage, repeat and dictionary rules and selector layouts, then fingerprint a 16,000-capture log."
keywords = ["codec", "crash-dump", "binary-format", "decoder", "encoder", "crc32c", "lfsr", "leb128", "reverse-engineering", "crc-recovery", "python", "stdlib"]
authors = [{ name = "Aditya Patel", email = "aditya.patelint17@ethara.ai" }, { name = "Dinshi Jain", email = "dinshi.jain@ethara.ai" }]

