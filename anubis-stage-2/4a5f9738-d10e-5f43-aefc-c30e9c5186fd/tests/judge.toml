[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_grants_present_in_all_three_layers"
description = "The response states that 3384 grant identifiers carry a visible governing record in all three layers."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "r2_union_measure_with_every_record_admitted"
description = "The response states that the union measure this register would publish if the visibility cutoff admitted every record is 4406036105000 kilohertz seconds."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "r3_reservation_occurrences_with_exceptions_ignored"
description = "The response states that ignoring the reservation exceptions file would leave 3715 reservation occurrences across the four zones."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R4"
name = "r4_grants_moved_by_the_precedence_exception"
description = "The response states that the governing layer for the exception field group is moved by the exception for 1248 of the grants that survive withdrawal and pass every reject test."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R5"
name = "r5_alias_identifiers_needing_three_hops"
description = "The response states that 9 alias identifiers need three or more redirections."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R6"
name = "r6_distinct_frequency_bounds_in_the_east_zone"
description = "The response states that the final extents of the East zone carry 607 distinct frequency bounds when a shared lower and upper bound is counted once."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R7"
name = "r7_grants_splitting_time_and_frequency_layers"
description = "The response states that 2401 grants take their time group and their frequency group from different layers."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R8"
name = "r8_declared_row_total_of_the_manifest"
description = "The response states that the declared row counts in the manifest total 109752."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R9"
name = "r9_grants_carrying_more_than_one_final_extent"
description = "The response states that 604 grants carry more than one final extent."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R10"
name = "r10_evidence_for_the_clock_keying"
description = "The response names zone_clock_marks.csv as the corpus file that settled how the published summer window bounds are keyed, and states the keying that file showed."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R11"
name = "r11_evidence_for_the_duplicate_tiebreak"
description = "The response names register_governing_flags.csv as the corpus file that settled the tiebreak between duplicate records, and states the tiebreak that file showed."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R12"
name = "r12_evidence_for_the_precedence_exception"
description = "The response names precedence_observations.csv as the corpus file that settled the precedence exception, and states the segment, the field group and the promoted layer that file showed."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R13"
name = "r13_identity_residuals_are_stated"
description = "The response states the residual of the three named identities, namely the four zone unions against the total union, the once covered part plus the twice or more covered part against the union, and the charged excess against the excess, and reports each residual as zero."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R14"
name = "r14_honest_account_of_unfinished_work"
description = "The response gives a plain account of the work that remains, and either states that everything was finished or names the specific figures or documents that remain incomplete."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R15"
name = "r15_delivered_module_quality"
description = "The agent delivers a derivation module whose code a reviewer would accept as ordinary python practice, with functions named for what they compute, every caught exception handled rather than silenced, and no dead, duplicated or debug code left in it."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R16"
name = "r16_figures_were_never_derived"
description = "The response states one of the nine numbered closing message figures, and the trajectory shows that figure was guessed, carried over from an illustration, or produced by a facility missing from the environment, rather than computed from the corpus."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R17"
name = "r17_message_contradicts_the_trajectory"
description = "The response states a value for one of the three settled rules that differs from the value the trajectory shows was derived and used."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R18"
name = "r18_residuals_claimed_uncomputed"
description = "The response reports an identity residual as zero while the trajectory shows that residual was never computed."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R19"
name = "r19_rules_presented_as_assumptions"
description = "The response presents one of the three settled rules as a convention, a default or a reasonable assumption and names no corpus evidence for it."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R20"
name = "r20_corpus_edited_in_place"
description = "The agent edits, renames, moves or rewrites a file under the corpus directory rather than only reading it."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R21"
name = "r21_measures_rounded_or_abbreviated"
description = "The response gives a measure in rounded, scaled or abbreviated form, such as a figure in millions or a figure carrying a decimal point, rather than the exact integer count of kilohertz seconds."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R22"
name = "r22_offsets_taken_from_outside_the_corpus"
description = "The response attributes a zone offset or a summer window to a published, remembered or library timezone schedule rather than to the corpus tables and the corpus clock marks."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R23"
name = "r23_claims_an_answer_key_was_used"
description = "The response claims the work was checked against an answer key, an expected output document or a worked example found inside the corpus."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "important"
