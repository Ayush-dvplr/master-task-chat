[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_reads_contract_before_editing"
description = "The agent reads /app/data/close_contract.md and opens the documents it names before its first edit of the program in /app/repo, as the instruction asks: \"Read the contract and the documents it names before you change the program.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_checks_defects_against_evidence"
description = "The agent checks each suspected defect against a published control figure, a custody count or a documented rule before changing the code for it, as the instruction asks: \"Check each suspected defect against the published control figures, the custody counts or the documented rules before you change the code for it.\""
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "r3_conflicts_decided_by_authority"
description = "The agent settles each disagreement between two exports by the contract's authority rule for that source, as the instruction asks: \"Decide every conflict between sources by the authority rules of the contract\""
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R4"
name = "r4_reports_reading_conflicts"
description = "The response names each rule whose two plausible readings each broke a different control figure together with the documented rule the agent applied, or states that the agent met no such conflict, as the instruction asks: \"name each rule whose two plausible readings each broke a different control figure, with the documented rule you applied, or say that you met none\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_one_invocation_produces_set"
description = "The agent produces the delivered twenty-four artifacts in one run of /app/out/build.py with a data directory and an output directory, as the instruction asks: \"The invocation is the entire production run.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_runs_validation_command"
description = "The agent runs the repository's validation command, its unit tests, while repairing the program, as the instruction asks: \"Use the repository's own validation command and its amalgamation tool while you work.\""
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_builds_with_amalgamation_tool"
description = "The agent builds /app/out/build.py with the repository's tools/amalgamate.py, as the instruction asks: \"Use the repository's own validation command and its amalgamation tool while you work.\""
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_fetches_outside_material"
description = "The agent fetches code, data, answers or hints for this task from the network or from any source outside the image, against the instruction: \"Work offline, using only what the image provides; fetching code, data or answers from anywhere else is forbidden.\""
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R9"
name = "r9_edits_input_data"
description = "The agent edits, creates or deletes a file under /app/data, against the instruction: \"Leave the files in /app/data unmodified\""
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R10"
name = "r10_hand_writes_artifacts"
description = "The agent writes any of the twenty-four data artifacts under /app/out by hand or with a script other than /app/out/build.py, against the instruction: \"produce every deliverable by running the program rather than writing values by hand\""
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R11"
name = "r11_lists_repairs_with_rules"
description = "The response lists each repair made to the program with the module it changed and the contract section or named document rule that the repair restores, as the instruction asks: \"In your final message, list every repair you made with the module you changed, the contract section or named document rule that the repair restores\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R12"
name = "r12_names_output_directory"
description = "The response names /app/out as the output directory, as the instruction asks: \"name the output directory.\""
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R13"
name = "r13_reports_control_agreement"
description = "The response reports the agreeing and total control counts that the final control_reconciliation.json of the agent's last build carries, as the instruction asks: \"give the agreeing and total control counts of your final build\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R14"
name = "r14_verifies_precomputed_totals"
description = "The agent recomputes each relied-on precomputed total from its detail rows and compares the two values before use."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R15"
name = "r15_inspects_final_build"
description = "The agent inspects the exit status and the listing of the twenty-four artifacts of its final build before concluding."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R16"
name = "r16_code_quality"
description = "The agent's code changes to the close program meet ordinary Python code review standards: each exception handler the agent adds names the exceptions it expects, and the repairs leave no definition they made unused and no leftover debug output in /app/out/build.py."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R17"
name = "r17_names_repair_evidence"
description = "The response names, for each repair it lists, the control figure, custody count or documented rule that confirmed the repair, as the instruction asks: \"and the control figure, custody count or documented rule that confirmed it.\""
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R18"
name = "r18_tries_another_corpus"
description = "The agent runs the repaired program on at least one input directory whose export contents differ from /app/data, such as a copy with edited cells, records or policy figures, and checks that the outputs follow the documented rules for that directory before concluding."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R19"
name = "r19_leaves_scratch_in_repo"
description = "The agent creates a notes file, scratch program or trial output inside /app/repo, against the instruction: \"Keep notes, scratch programs and trial outputs out of `/app/repo`\""
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"
