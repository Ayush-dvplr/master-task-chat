[task]
name = "terminal-bench/b16427d8-4d52-5797-af20-4f212dd708ac"
version = "1.0.0"
description = "Build release R7 of a post-training human preference corpus from fifty conflicting annotation exports: gate annotators on gold calibration, test verdict admissibility against position bias, window, freeze and amendment rules, resolve each comparison by adjudication or majority, construct chosen and rejected pairs, canonicalise near duplicates, split by prompt family, cap the source mixture, pack sequences and plan the training schedule, then ship the deterministic builder that reproduces the release on a corpus it has never seen."
