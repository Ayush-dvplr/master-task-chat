# daybreak publication form
encoding = "utf-8"
line_ending = "lf"
trailing_newline = "one, on every document that has content"
json_indent = 2
json_sort_keys = "true"
json_ensure_ascii = "true"
jsonl_form = "one compact object per line, keys sorted, separators comma and colon with no spaces"
jsonl_empty_form = "an empty file of zero bytes"
csv_separator = ","
csv_empty_form = "the header line alone"
csv_quoting = "none; no published field carries a comma"
boolean_form = "true and false, lower case"
ratio_form = "twelve decimal places, no negative zero"
manifest_line = "sha256 then two spaces then the file name"
manifest_order = "file name ascending"
manifest_trailers = "core then publication"
core_digest_over = "the bytes of unit_normalization.json, canonical_action_order.json, final_action_order.json, daily_automation_manifest.json and next_state_snapshot.json, concatenated in that order"
publication_digest_over = "the manifest body lines, each followed by one line feed, before the two trailers are appended"
