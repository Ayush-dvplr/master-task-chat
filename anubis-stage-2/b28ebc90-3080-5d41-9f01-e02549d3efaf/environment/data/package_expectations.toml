# what the delivered archive has to contain
archive_root_file = "pyproject.toml"
source_root = "src/daybreak"
tests_root = "tests"
tests_carried_through = "unchanged, module for module"
modules = "__init__.py|__main__.py|cli.py|util.py|loading.py|stages.py|allocate.py|publish.py"
entry_point = "python3 -m daybreak"
options = "--data|--out"
options_order_free = "true"
creates_missing_out = "true"
third_party_imports = "none"
python_series = "3.12"
writes_only_the_derived_documents = "true"
leaves_the_paper_directory_untouched = "true"
document_count = 28
stage_functions = "loading.load_all|stages.stage_r01|stages.stage_r02|stages.stage_r03|stages.stage_r04|stages.stage_r05|stages.stage_r06|stages.stage_r07|stages.stage_r08|stages.stage_r09|allocate.stage_r10|allocate.stage_r11|allocate.stage_r12|allocate.stage_r13|allocate.stage_r14|publish.render"
stage_interface = "every stage function keeps the name, the arguments and the record shapes it shipped with"
