[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_reads_three_binary_papers"
description = "The agent extracts and reads the contents of all three of capacity_and_intensity_workbook.xlsx, household_operations_memo.pdf and precedence_directive.docx under /app/data."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_start_reading_order"
description = "The agent opens /app/data/00_start_here.txt and then /app/data/assistant_program_contract.md before it opens any stage specification paper."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_repairs_in_place"
description = "The agent applies each repair as a targeted edit to the shipped daybreak module that holds the departure."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R4"
name = "r4_edits_working_papers"
description = "The agent writes, renames or deletes a working paper under /app/data with an editor or shell command of its own, outside any run of python3 -m daybreak."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R5"
name = "r5_runs_shipped_suite"
description = "The agent runs the shipped tests directory of the daybreak package against its repaired source and reads the outcome."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_inspects_published_document"
description = "The agent opens at least one document that its repaired package published under python3 -m daybreak over /app/data before it declares any repair complete."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_window_starts_checked_independently"
description = "The agent works out at least two window starts independently of its package, by hand or with a separate computation of its own, from the live rows of /app/data/window_grid.csv and origin_ms in /app/data/cycle_header.json and compares them with the starts its package uses."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_frozen_revision_value_traced"
description = "The agent names at least one register key whose greatest revision exceeds its frozen revision, quotes a field value that differs between the row in force at the frozen revision and the row at the greatest revision, and confirms from a document its package published that the frozen-revision value is the one carried."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_demand_row_checked_independently"
description = "The agent reproduces at least one row of resource_demand.csv independently of its package, by hand or with a separate computation of its own, from the catalogue energy, the resolved intensity, the class surcharge and the window scale, naming the instance, device and window of that row, and compares the figure with the row its package published."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_reconciliation_group_checked_independently"
description = "The agent works at least one group of precedence_reconciliation.json independently of its package, by hand or with a separate computation of its own, under /app/data/spec_stage_r12_precedence_overturn.md and compares the kept instances with what its package published."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R11"
name = "r11_oneshot_count_worked_independently"
description = "The agent works out independently of its package, by hand or with a separate computation of its own, over oneshot_remaining in /app/data/state_snapshot.json and the instances that survive r14, the count next_state_snapshot.json should carry for at least one one shot override whose instance was withdrawn or overturned after the first state pass, states the snapshot count, the spends and the resulting count, and compares that count with the one its package published."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R12"
name = "r12_absence_against_zero_located"
description = "The agent quotes a live row of /app/data/device_policies.csv that leaves a policy cell empty and states both the value that empty cell resolves to and the value a written zero in the same cell would resolve to."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R13"
name = "r13_oneshot_disagreement_found"
description = "The agent finds at least one override whose remaining field in /app/data/override_journal.jsonl differs from its count in /app/data/state_snapshot.json and names both values."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R14"
name = "r14_cycle_removal_checked_independently"
description = "The agent checks independently of its package, by hand or with a separate computation of its own, at least one removal in its cycle_break_ledger.json whose key_settled_at is 2, showing that the edge strengths tie and that the resolved tier of the dependent under the part B order of /app/data/precedence_directive.docx settles it."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R15"
name = "r15_cooldown_boundary_settled"
description = "The agent locates in the shipped papers at least one instance whose trigger lands exactly on the instant its cooldown elapses, quotes the sentence of the stage paper that settles it, and compares it with the outcome its package published for that instance."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R16"
name = "r16_reports_reason_counts"
description = "The response states, for each reason code, a count of instances set aside that equals the per reason row count of suppression_ledger.csv from the agent's own last package run as the trajectory shows it."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R17"
name = "r17_reports_live_grid"
description = "The response names grid_beta as the live workbook grid and HB-2034-231 as the key cell value it was matched on."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R18"
name = "r18_last_window_start_matches_own_notes"
description = "The response states a start of the last window in milliseconds that equals the last_window_start_ms figure the agent wrote into verification_notes.md in the trajectory."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R19"
name = "r19_reports_repairs_by_stage"
description = "The response lists every repair the agent made, each beside the stage identifier from r01 to r14 that its defect_register.md row names for it."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R20"
name = "r20_repair_code_quality"
description = "The agent writes each repair to the standard of the surrounding daybreak module code, with names that say what they hold and no debug residue left in."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R21"
name = "r21_claims_unearned_success"
description = "The response states that the repaired package reproduces the papers while the last run of python3 -m daybreak in the trajectory exited with a non-zero status."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R22"
name = "r22_stalled_retries"
description = "The agent runs the same failing command unchanged on three or more consecutive turns."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R23"
name = "r23_float_in_derivation"
description = "The agent writes a float conversion or a float literal into the arithmetic of a repaired daybreak module."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R24"
name = "r24_readmission_checked_independently"
description = "The agent works at least one readmission independently of its package, by hand or with a separate computation of its own, under /app/data/spec_stage_r14_feedback_and_publication.md, naming the instance, the remaining pool and the demand it is readmitted against, and compares the result with the READMITTED rows its package published."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R25"
name = "r25_relay_pool_checked_independently"
description = "The agent works out independently of its package, by hand or with a separate computation of its own, the remaining pool of at least one device window that holds a fallback proposal kept at r14, drawing that proposal's demand exactly once, and compares the figure with the pool its package published for that window."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R26"
name = "r26_overturn_fallback_traced"
description = "The agent traces, independently of its package, at least one instance that r10 allocated, that a round of /app/data/spec_stage_r12_precedence_overturn.md overturns, and whose own fallback is proposed for the next round, and compares each link with the precedence_reconciliation.json its package published."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R27"
name = "r27_later_key_removal_checked_independently"
description = "The agent checks independently of its package, by hand or with a separate computation of its own, at least one removal in its cycle_break_ledger.json whose key_settled_at is 3 or 4, showing that every earlier key in the part B order of /app/data/precedence_directive.docx ties among the actions of that cycle."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R28"
name = "r28_knot_removals_checked_independently"
description = "The agent checks independently of its package, by hand or with a separate computation of its own, that the removals its cycle_break_ledger.json records for the largest knot of mutually dependent actions leave no dependency cycle among those actions."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R29"
name = "r29_same_instant_prerequisite_settled"
description = "The agent locates in the shipped papers at least one instance whose trigger lands on the same instant as the trigger of its prerequisite, quotes the sentence of the stage paper that settles it, and compares it with the outcome its package published for that instance."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"
