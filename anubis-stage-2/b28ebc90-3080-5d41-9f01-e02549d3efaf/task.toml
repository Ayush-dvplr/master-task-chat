[task]
name = "terminal-bench/b28ebc90-3080-5d41-9f01-e02549d3efaf"
version = "1.0.0"
description = "Repair a stdlib Python CLI package that compiles one routing cycle of a household assistant into an executable automation plan, then republish the cycle. Normalise the recorded units under exact rational arithmetic, bind every alias, expand the recurring routines into occurrences, resolve seven policy layers per instance, screen eligibility against the prior state, settle the dependency cycles, bind the demand against the energy ceilings that live only in the workbook, propose the fallbacks, overturn the binding over the reconciliation rounds the directive allows, carry the state forward and deliver the repaired archive with twenty-eight derived documents."
keywords = ["python", "personal-assistant", "cli", "configuration", "exact-arithmetic", "dependency-resolution", "stdlib"]
authors = [{ name = "Aniket Datta", email = "aniket.dattaint17@ethara.ai" }, { name = "Dinshi Jain", email = "dinshi.jain@ethara.ai" }]

