[task]
name = "terminal-bench/6defadfe-9c50-5aa1-b854-8d5c1718d794"
version = "1.0.0"
description = "Repair the broken trainyard CI ledger package so it installs on Python 3.12 and follows the approved ledger specification, its errata and the governance precedence rules, then rebuild the stage-1 build, module, metrics, dependency, self-test and summary ledger from a 99-file feed in 20 formats and the stage-0 resume state, a feed full of conflicting sources, superseded documents and partially authoritative decoys. The repaired package is also run on a hidden stage-2 feed opened from the agent's own summary."
keywords = ["python", "packaging", "debugging", "ci", "symbolication", "semver", "data-reconciliation"]
authors = [
    { name = "Aditya Patel", email = "aditya.patelint17@ethara.ai" },
    { name = "Dinshi Jain", email = "dinshi.jain@ethara.ai" },
]

