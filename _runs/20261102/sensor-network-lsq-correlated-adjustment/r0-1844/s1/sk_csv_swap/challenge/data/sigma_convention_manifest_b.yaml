# sigma convention manifest (YAML mirror).
rule_authority: sigma_convention_manifest.json
shards:
  - file: obs_source_district_north.csv
    sigma_stored_as: stddev
    length_unit: ft_us
    angle_unit: mgon
  - file: obs_source_district_south.tsv
    sigma_stored_as: variance
    length_unit: m
    angle_unit: gon
  - file: obs_source_district_west.psv
    sigma_stored_as: stddev
    length_unit: chain
    angle_unit: deg
  - file: obs_source_district_east.jsonl
    sigma_stored_as: variance
    length_unit: ft_i
    angle_unit: arcsec
