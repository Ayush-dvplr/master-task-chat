schema_version = "1.4"
artifacts = ["/app/out/optimize.py", "/app/out/scenario_visible.json", "/app/out/scenario_peak.json", "/app/out/scenario_steady.json", "/app/out/scenario_burst.json", "/app/out/scenario_latency.json", "/app/out/perf_report.json", "/app/out/bottleneck_analysis.json", "/app/out/recommendations.json", "/app/out/data_quality.json"]

[task]
name = "terminal-bench/f348165e-f7f6-5e73-b82d-b84ee751f3b0"
version = "1.0.0"
description = "Write a fast, reusable standard-library program that settles reserved throughput quota for the tenant pools of a model-serving platform across five traffic classes: it builds per-tenant inference demand from request logs, settles each pool with an iterative damped rebalancing loop, bills the settled reservations, and writes exact interlocked reports, while running well under a slow reference implementation."
keywords = ["model-serving", "inference", "quota-settlement", "performance", "iterative-settlement"]
authors = [{ name = "Aditya Jain", email = "aditya.jainint17@ethara.ai" }, { name = "Poonam Chourey", email = "poonam.chourey@ethara.ai" }]

[metadata]
category = "Data Processing"
platforms = ["linux/amd64", "linux/arm64"]
tags = ["machine-learning", "inference-serving", "performance", "settlement"]
estimated_duration_sec = 7200.0
expert_time_estimate_min = 600.0
junior_time_estimate_min = 1500.0
null_floor = 0.0
discrimination_weight = 1.0

