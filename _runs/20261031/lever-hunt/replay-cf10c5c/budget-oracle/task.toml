[task]
name = "terminal-bench/43986de8-bb38-5141-98f3-f9f31ce56581"
version = "1.0.0"
description = "Normalize a household budgeting office's transaction exports, sharded across csv, tsv, jsonl, sqlite and xlsx sources with a correction log, into a canonical ledger, then run the month-end envelope sweep that rebalances each household's envelopes by an iterative damped transfer with a balancing adjustment, strike-count halving, stall, budget and cycle exits, and report per household, envelope category and funding segment. The work is a reusable stdlib pipeline with exact whole-dollar arithmetic that reproduces every report on unseen extracts."
keywords = ["envelope-budgeting", "household", "iteration", "data-pipeline", "python", "stdlib"]
