[task]
name = "terminal-bench/98ed74c1-19ac-5ec8-adaf-392a172d4600"
version = "1.0.0"
description = "Recover each sensor unit's logger clock offset from a lossy base-station receipt journal, then derive an exact PM2.5 compliance report for an urban monitoring network: readings placed on true instants, span calibration with errata, maintenance invalidation, hourly and daily means in local standard time, exceedances, rank-table design values and district and operator rollups. Deliver a reusable standard-library program that rebuilds every report from any extract in the same layout, and answer ten what-if scenarios by rerunning it on edited copies."
keywords = ["python", "air-quality", "pm2-5", "clock-offset", "telemetry", "calibration", "exact-arithmetic", "stdlib"]
authors = [{ name = "Harsh Gupta", email = "harsh.gupta14@ethara.ai" }, { name = "Poonam Chourey", email = "poonam.chourey@ethara.ai" }]

