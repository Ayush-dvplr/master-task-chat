[task]
name = "terminal-bench/59417607-2254-5165-b703-0d5a4aeb7367"
version = "1.0.0"
description = "Build a reusable standard-library billing pipeline for a personal-assistant bureau. Handset task closings must be placed on the bureau exchange clock using its traffic register, bucketed into client-local business days, tiered, credited against plan allowances, priced from a dated rate card with amendments applied, and rolled up into normalized records plus service-line, region, segment, summary and data-quality reports that must match exactly on the shipped cycle and on other cycles in the same layout."
keywords = ["billing", "clock-offset", "constraint-search", "allowance", "rate-card", "data-pipeline", "stdlib"]
authors = [{ name = "Aditya Jain", email = "aditya.jainint17@ethara.ai" }, { name = "Poonam Chourey", email = "poonam.chourey@ethara.ai" }]

