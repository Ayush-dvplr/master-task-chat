schema_version = "1.4"
artifacts = ["/app/out/derive_report.py", "/app/out/summary.json", "/app/out/policy_audit.json", "/app/out/data_quality.json", "/app/out/region_North.json", "/app/out/region_South.json", "/app/out/region_West.json", "/app/out/region_East.json", "/app/out/segment_commercial.json", "/app/out/segment_public.json"]

[task]
name = "terminal-bench/hangar-check-replan"
version = "1.0.0"
description = "Replan a season of aircraft heavy maintenance checks across four hangar bases after a disruption notice. The program reads fleet, request, calendar and Word-package inputs, screens bad rows, finds the season plan that is best under a stated three-term order with start and finish tie-breaks, a shared overtime pool and deferral, settles overtime against a fleet allowance, and writes a per-check plan, base and segment reports, a summary and a data-quality file, exact to the field."
keywords = ["python", "csv", "json", "calculation", "stdlib", "scheduling", "maintenance-planning", "optimization", "docx"]
authors = [{ name = "Ayush Sah", email = "ayush.sah@ethara.ai" }]

[metadata]
category = "Optimization"
platforms = ["linux/amd64", "linux/arm64"]
tags = ["python", "csv", "json", "calculation", "stdlib", "scheduling", "maintenance-planning", "optimization", "docx"]
estimated_duration_sec = 7200.0
expert_time_estimate_min = 480.0
junior_time_estimate_min = 1440.0
null_floor = 0.0
discrimination_weight = 1.0

