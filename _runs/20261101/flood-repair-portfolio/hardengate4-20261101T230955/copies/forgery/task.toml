schema_version = "1.4"
artifacts = ["/app/out/derive_report.py", "/app/out/summary.json", "/app/out/policy_audit.json", "/app/out/data_quality.json", "/app/out/region_North.json", "/app/out/region_South.json", "/app/out/region_West.json", "/app/out/region_East.json", "/app/out/segment_commercial.json", "/app/out/segment_public.json"]

[task]
name = "terminal-bench/flood-repair-portfolio"
version = "1.0.0"
description = "Build a reusable program that reads a book of flood repair funding rounds, values each proposal from rate, risk and site premium tables, derives the conflicts between proposals from crews, permits and explicit exclusions, chooses for every round the conflict-free portfolio of greatest total benefit with a stated tie-break, and writes a summary, a policy audit, a data quality report and per-region and per-segment documents computed from the one portfolio chosen for each round."
keywords = ["python", "csv", "json", "calculation", "stdlib"]
authors = [{ name = "Ayush Sah", email = "ayush.sah@ethara.ai" }]

[metadata]
category = "Optimization"
platforms = ["linux/amd64", "linux/arm64"]
tags = ["python", "csv", "json", "calculation", "stdlib"]
estimated_duration_sec = 7200.0
expert_time_estimate_min = 480.0
junior_time_estimate_min = 1440.0
null_floor = 0.0
discrimination_weight = 1.0

[verifier]
timeout_sec = 2700.0
environment_mode = "separate"
network_mode = "public"

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[verifier.environment]
network_mode = "public"

[agent]
timeout_sec = 7200.0
network_mode = "public"
user = "1000:1000"

[environment]
build_timeout_sec = 900.0
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []
