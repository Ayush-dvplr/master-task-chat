name = "format-recovery"
summary = "Implement a decoder and a byte-exact encoder for a seeded binary container format from its complete written specification."
artifacts = ["/app/decode.py", "/app/encode.py", "/app/out/decoded_examples.jsonl", "/app/out/format_report.json", "/app/out/roundtrip_report.json", "/app/out/error_analysis.json"]
min_inputs = 6
min_outputs = 6
default_description = "Implement a decoder and byte-exact encoder for a seeded binary container format from its complete written specification; validated against a hidden capture corpus."
default_keywords = ["python", "binary-format", "decoder", "encoder", "stdlib"]

# specification document (never ablated); the log feeds two report artifacts,
# while most test weight grades the codec on the verifier's hidden corpus.

# Which input files each file needs to be interpreted (documentation of the interlock).
# Input directories under environment/ and where each lands in the agent image
# (QC S4: every one is a COPY source in environment/Dockerfile).
[[inputs]]
dir = "data"
mount = "/app/data"

[dependencies]
"{{FORMAT_TAG}}-capture-log.jsonl" = ["{{FORMAT_TAG}}-container-format.md", "{{FORMAT_TAG}}-error-codes.md", "{{FORMAT_TAG}}-decoder-appendix.md"]
