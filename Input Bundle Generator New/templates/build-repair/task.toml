schema_version = "1.4"
artifacts = {{ARTIFACTS}}

[task]
name = "terminal-bench/{{BUNDLE_NAME}}"
version = "1.0.0"
description = "{{TASK_DESCRIPTION}}"
keywords = {{TASK_KEYWORDS}}
authors = {{AUTHORS}}

[metadata]
category = "{{CATEGORY}}"
platforms = ["linux/amd64", "linux/arm64"]
tags = {{TASK_TAGS}}
estimated_duration_sec = {{ESTIMATED_DURATION_SEC}}
expert_time_estimate_min = {{EXPERT_TIME_MIN}}
junior_time_estimate_min = {{JUNIOR_TIME_MIN}}
null_floor = 0.0
discrimination_weight = 1.0

[verifier]
timeout_sec = {{VERIFIER_TIMEOUT_SEC}}
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[agent]
timeout_sec = {{AGENT_TIMEOUT_SEC}}
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.z.ai"]
user = "1000:1000"

[environment]
build_timeout_sec = {{BUILD_TIMEOUT_SEC}}
network_mode = "no-network"
cpus = {{CPUS}}
memory_mb = {{MEMORY_MB}}
storage_mb = {{STORAGE_MB}}
gpus = 0
mcp_servers = []
