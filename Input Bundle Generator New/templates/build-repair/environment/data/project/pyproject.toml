[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "{{PACKAGE_NAME}}"
version = "0.0.3"
description = "{{FORMAT_TAG}} diagnostics helpers for {{PRODUCER_SYSTEM}} {{CONTAINER_NOUN}} manifests"
requires-python = ">=3.13"
dependencies = []

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["{{PACKAGE_NAME}}_core"]
