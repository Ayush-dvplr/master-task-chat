name = "performance"
summary = "Optimize and analyze stdlib-only event workloads across benchmark scenarios."
artifacts = ["/app/out/optimize.py", "/app/out/scenario_visible.json", "/app/out/scenario_peak.json", "/app/out/scenario_steady.json", "/app/out/scenario_burst.json", "/app/out/scenario_latency.json", "/app/out/perf_report.json", "/app/out/bottleneck_analysis.json", "/app/out/recommendations.json", "/app/out/data_quality.json"]
min_inputs = 10
min_outputs = 10
default_description = "Optimize deterministic Python event aggregation workloads, preserve exact outputs across benchmark scenarios, and document stable relative speedup plus analysis artifacts."
# optimizer on verifier-generated workloads, which no shipped file can affect, so
# deleting one input can cost at most the scenario and summary checks (~0.2-0.3).
default_keywords = ["python", "performance", "optimization", "stdlib", "benchmarking"]

# Which input files each file needs to be interpreted (documentation of the interlock).
# Input directories under environment/ and where each lands in the agent image
# (QC S4: every one is a COPY source in environment/Dockerfile).
[[inputs]]
dir = "data"
mount = "/app/data"

[dependencies]
"events.csv" = ["accounts.csv", "rules.json", "thresholds.json", "baseline_metrics.json", "cost_model.json", "hardware_profile.json", "query_plan.json", "index_config.json"]
"workload_peak.csv" = ["accounts.csv", "rules.json", "thresholds.json", "baseline_metrics.json", "cost_model.json", "hardware_profile.json", "query_plan.json", "index_config.json"]
"workload_steady.csv" = ["accounts.csv", "rules.json", "thresholds.json", "baseline_metrics.json", "cost_model.json", "hardware_profile.json", "query_plan.json", "index_config.json"]
"workload_burst.csv" = ["accounts.csv", "rules.json", "thresholds.json", "baseline_metrics.json", "cost_model.json", "hardware_profile.json", "query_plan.json", "index_config.json"]
"workload_latency.csv" = ["accounts.csv", "rules.json", "thresholds.json", "baseline_metrics.json", "cost_model.json", "hardware_profile.json", "query_plan.json", "index_config.json"]
"rules.json" = ["accounts.csv"]
