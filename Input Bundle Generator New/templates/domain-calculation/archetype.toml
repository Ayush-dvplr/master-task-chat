name = "domain-calculation"
summary = "Derive an exact substantive domain report from flat CSV/JSON records."
artifacts = ["/app/out/derive_report.py", "/app/out/summary.json", "/app/out/policy_audit.json", "/app/out/data_quality.json", "/app/out/region_North.json", "/app/out/region_South.json", "/app/out/region_West.json", "/app/out/region_East.json", "/app/out/segment_commercial.json", "/app/out/segment_public.json"]
min_inputs = 10
min_outputs = 10
default_description = "Compute an exact reconciled domain report from flat CSV and JSON inputs, and provide a reusable deterministic derivation script."
default_keywords = ["python", "csv", "json", "calculation", "stdlib"]

# Which input files each file needs to be interpreted (documentation of the interlock).
# Input directories under environment/ and where each lands in the agent image
# (QC S4: every one is a COPY source in environment/Dockerfile).
[[inputs]]
dir = "data"
mount = "/app/data"

[dependencies]
"transactions.csv" = ["customers.csv", "regions.csv", "tax_rules.json", "rate_table.csv", "fx_rates.csv", "calendar.csv", "thresholds.json", "policy.json"]
"customers.csv" = ["discount_rules.json"]
"tax_rules.json" = ["regions.csv"]
