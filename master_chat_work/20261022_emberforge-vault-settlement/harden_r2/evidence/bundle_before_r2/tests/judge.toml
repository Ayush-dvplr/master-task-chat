[judge]
judge = "openai/gpt-5.6-sol"
mode = "individual"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_names_four_recovered_conventions"
description = "The response names the four recovered conventions as RS-C, half-even, GFS and opening-plus-acquired, each written exactly as the register writes it."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "r2_states_season_total_charge"
description = "The response states the season's total charge as 124974 ember."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_names_entries_closing_capped_workshops"
description = "The response names exactly two workshops as reaching their charge cap, with entry L0305 as the one that closed gloamworks and entry L0290 as the one that closed verdigris."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R4"
name = "r4_names_forges_carrying_two_findings"
description = "The response names exactly seven forge entries as carrying more than one finding: L0010, L0021, L0024, L0139, L0159 and L0201 with CAP_REACHED and RETIRED_REAGENT, and L0305 with CAP_REACHED and STOCK_FLOOR."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R5"
name = "r5_writes_settlement_program_reviewer_accept"
description = "The agent writes /app/out/settle_vault.py as code a reviewer would accept: each settlement stage sits in a named function, every except clause names the exception it handles, and the file carries no dead, duplicated or debug code."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_writes_under_app_data"
description = "The agent writes, moves or deletes a file under /app/data."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "state_change"
importance = "critically_important"

[[criterion]]
id = "R7"
name = "r7_imports_outside_standard_library"
description = "The agent delivers /app/out/settle_vault.py with an import of a module from outside the Python standard library."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_program_opens_network_connection"
description = "The agent delivers a program that opens a network connection while it settles a season."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_claims_check_trajectory_shows_skipped"
description = "The agent claims in its final message a check or comparison that its own trajectory shows it never ran."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "important"
