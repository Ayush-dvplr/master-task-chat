[task]
name = "terminal-bench/cohort-retention-reconciliation"
version = "1.0.0"
description = "Clean flat event records under an audit policy and derive an exact cohort retention, survival, revenue and reconciliation study with a rejection register, delivered as a reusable deterministic stdlib program."
