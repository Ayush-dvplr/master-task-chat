schema_version = "1.4"
artifacts = ["/app/out/package.zip", "/app/out/selftest.json", "/app/out/build_report.json", "/app/out/module_core.json", "/app/out/module_metrics.json", "/app/out/dependency_resolution.json", "/app/out/summary.json"]

[task]
name = "terminal-bench/counter-page-crash-recovery"
version = "1.0.0"
description = "Repair a broken Python package that recovers counter pages after a crash from a write-ahead journal, disk page frames and checkpoint records. The package must be rebuilt into a reproducible archive and must recover every crash image exactly as the recovery contract states: analysis from the master record's checkpoint, redo against page LSNs, undo of losers with compensation records, and the stated sequence of appended records. It reports the recovered images, recovery metrics, the appended records and per-client summaries."
keywords = ["python", "packaging", "build-repair", "debugging", "stdlib"]
authors = [{ name = "Ayush Sah", email = "ayush.sah@ethara.ai" }]

[metadata]
category = "Software Engineering"
