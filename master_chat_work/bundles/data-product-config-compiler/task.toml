schema_version = "1.4"
artifacts = ["/app/out/config.json", "/app/out/report.json", "/app/out/tool.zip", "/app/out/profile_dev.json", "/app/out/profile_prod.json", "/app/out/validation_report.json", "/app/out/summary.json"]

[task]
name = "terminal-bench/data-product-config-compiler"
version = "1.0.0"
description = "Repair a small standard-library command line compiler that turns layered configuration for a catalog of data products into resolved per-product settings, per-environment deployment profiles, a validation report of rejected overrides and per-product quota shares. The rules live in one contract file. The repaired tool is run on the shipped corpus and delivered as a zip archive that must also produce correct results on fresh corpora."
keywords = ["python", "cli", "configuration", "debugging", "stdlib"]
authors = [{ name = "Ayush Sah", email = "ayush.sah@ethara.ai" }]

[metadata]
category = "Software Engineering"
platforms = ["linux/amd64", "linux/arm64"]
tags = ["python", "cli", "configuration", "debugging", "stdlib"]
estimated_duration_sec = 7200.0
expert_time_estimate_min = 480.0
junior_time_estimate_min = 1440.0
null_floor = 0.0
discrimination_weight = 1.0

[verifier]
timeout_sec = 2700.0
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.z.ai"]
user = "1000:1000"

[environment]
build_timeout_sec = 900.0
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []
