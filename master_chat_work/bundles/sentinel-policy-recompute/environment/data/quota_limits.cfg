[quota]
per_tenant = 1000
burst = 200
window_seconds = 60

# each override_allowance value is a whole number from 1 to 6
# override_allowance is keyed by region; the region of a tenant is its region in tenant_catalog.xml
[override_allowance]
r-00 = 2
r-01 = 3
r-02 = 4
r-03 = 5
r-04 = 6
r-05 = 2
r-06 = 3
r-07 = 4
r-08 = 5
r-09 = 6
r-10 = 2
r-11 = 3
r-east = 3
r-north = 5
r-west = 4
