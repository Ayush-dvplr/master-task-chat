schema_version = "1.4"
artifacts = ["/app/out/package.zip", "/app/out/selftest.json", "/app/out/build_report.json", "/app/out/module_core.json", "/app/out/module_metrics.json", "/app/out/dependency_resolution.json", "/app/out/summary.json"]

[task]
name = "terminal-bench/batch-lease-scheduler-replay"
version = "1.0.0"
description = "A zipped Python package replays books of batch scheduler logs: jobs with priorities, pools, dependencies, retry limits and worker leases, driven by submit, heartbeat, fail, cancel, boost and worker events. The shipped package mishandles parts of the replay contract and has parser and packaging faults. The agent repairs it, ships the fixed package as a zip, runs it on the shipped book and reports per-checkpoint job and worker state, work and attempt totals, dependency outcomes and a summary, each graded whole on fresh books."
keywords = ["python", "packaging", "build-repair", "debugging", "stdlib"]
authors = [{ name = "Ayush Sah", email = "ayush.sah@ethara.ai" }]

[metadata]
category = "Software Engineering"
platforms = ["linux/amd64", "linux/arm64"]
tags = ["python", "packaging", "build-repair", "debugging", "stdlib"]
estimated_duration_sec = 7200.0
expert_time_estimate_min = 480.0
junior_time_estimate_min = 1440.0
null_floor = 0.0
discrimination_weight = 1.0

