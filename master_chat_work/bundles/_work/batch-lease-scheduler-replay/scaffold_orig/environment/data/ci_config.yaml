runtime: python3.12
network: disabled
commands:
  - 'python -m unittest discover -s tests -v'
  - 'python -c "import task; print(task.__version__)"'
  - 'python -m compileall -q src'
  - 'python -c "import task; print(sorted(n for n in dir(task) if not n.startswith(''_'')))"'
  - 'python -c "import task.metrics as m; print(m.BUCKET_ORDER)"'
artifact_policy:
  archive: /app/out/package.zip
  report: /app/out/selftest.json
  deterministic_json: true
