schema_version = "1.4"
artifacts = ["/app/out/patched-repo.zip", "/app/out/repair-report.json", "/app/out/module_core.json", "/app/out/module_parser.json", "/app/out/module_report.json", "/app/out/test_fixes.json", "/app/out/summary.json"]

[task]
name = "terminal-bench/schema-migration-plan-repair"
version = "1.0.0"
description = "Repair a stdlib Python repository that upgrades partner records to canonical schemas through a migration graph. The shipped planner, executor, identity, replay and report modules diverge from a written contract: plans must be searched over schema and field state with a lexicographic tie rule on large graphs, explicit nulls must stay distinct from absent fields, corrections must apply mid-path, and replays must be identified on the record as received. Deliver the patched repository and its reports."
keywords = ["python", "repo-patch", "debugging", "source-repair", "stdlib"]
authors = [{ name = "Ayush Sah", email = "ayush.sah@ethara.ai" }]

[metadata]
category = "Data Processing"
platforms = ["linux/amd64", "linux/arm64"]
tags = ["python", "repo-patch", "debugging", "source-repair", "stdlib"]
estimated_duration_sec = 7200.0
expert_time_estimate_min = 480.0
junior_time_estimate_min = 1440.0
null_floor = 0.0
discrimination_weight = 1.0

