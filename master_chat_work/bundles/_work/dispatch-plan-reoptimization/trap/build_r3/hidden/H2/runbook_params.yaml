# planning runbook parameters for the replan cycle
control:
  plan_sequence_cutoff: 8140
  money_unit: integer_usd_cents
  rounding_mode: half_up
  capex_grid_cents: 5000
  default_setup_cents: 96000
  fiscal_year_start_period: P05
  minimum_handling_cents: 1
tie_breaks:
  ledger_row: highest_rev_then_highest_effective_seq
  lot_sizing: earliest_production_period
  sourcing_fill: lowest_rate_then_lowest_plant_code
  item_split: ascending_item_code
  capital_selection: highest_value_then_lowest_capex_then_smallest_indicator
stage_order:
  1: coefficient_rebuild
  2: capital_selection
  3: lot_sizing
  4: sourcing_allocation
coefficient_pipeline:
  1: base_amount_scaled_and_converted
  2: accumulate_amendments
  3: apply_override_if_present
  4: apply_energy_uplift
