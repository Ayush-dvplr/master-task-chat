[task]
name = "terminal-bench/cleanroom-window-schedule"
version = "1.0.0"
description = "Plan each night of a pharmaceutical cleanroom book: choose which fixed-window jobs run and on which qualified bay so the night's net value is maximal, where a family changeover costs a fee and needs the single sterilisation crew for a lead time before the incoming job, and report plans, policy audit, data quality rejections and regional and segment rollups."
keywords = ["python", "csv", "json", "calculation", "stdlib"]
authors = [{ name = "Ayush Sah", email = "ayush.sah@ethara.ai" }]

