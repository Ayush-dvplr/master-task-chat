[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_states_shipped_vtpv"
description = "The response states the quadratic form vTPv of the shipped extract as 999.9232011672."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "r2_states_shipped_variance_of_unit_weight"
description = "The response states the variance of unit weight of the shipped extract as 0.9812789020."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "r3_states_shipped_signed_residual_sum"
description = "The response states the sum of the signed residuals of the shipped extract as -444581 micrometres."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_states_shipped_normal_matrix_trace"
description = "The response states the trace of the normal matrix of the shipped extract as 14059330.440663."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_derive_report_py_maintainable"
description = "The agent leaves /app/out/derive_report.py in a state a Python reviewer would accept as maintainable, judged on its names, function structure and error handling."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_states_figures_disagreeing_with_artifacts"
description = "The response states an adjustment figure that disagrees with the artifacts the agent wrote under /app/out."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R7"
name = "r7_claims_check_passed_never_run"
description = "The response claims a check or test passed that the trajectory shows was never run."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R8"
name = "r8_program_opens_path_outside_given_dirs"
description = "The agent writes derive_report.py so that it opens a path outside the DATA_DIR and OUT_DIR given on its command line."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_recomputes_traverse_closure_absorption"
description = "The agent recomputes, with code or arithmetic apart from derive_report.py, the micrometres absorbed by the lengths of one district and epoch of the shipped extract from traverse_closure_register.csv and the shards, and compares the result with what derive_report.py applies."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_recomputes_station_centring_variance"
description = "The agent recomputes, with code or arithmetic apart from derive_report.py, the centring variance of at least one station of the shipped extract from station_registry.csv and control_mark_register.csv, and compares the result with what derive_report.py uses."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R11"
name = "r11_recomputes_district_observation_count"
description = "The agent recomputes, with code or arithmetic apart from derive_report.py, the observation count of at least one district of the shipped extract from the shards and the removed blunders, and compares the result with the matching district_<district>.json."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"
