schema_version = "1.4"
artifacts = ["/app/out/config.json", "/app/out/report.json", "/app/out/tool.zip", "/app/out/profile_dev.json", "/app/out/profile_prod.json", "/app/out/validation_report.json", "/app/out/summary.json"]

[task]
name = "terminal-bench/warrant-asof-entitlement-compiler"
version = "1.0.0"
description = "Repair warrant-ctl, a stdlib Python access entitlement compiler, so it follows a written security contract: bitemporal visibility, identity resolution across HR, IdP and alias feeds, calendar dates read on several clocks, approval gated grants, on call rotations across daylight transitions, attestation and separation of duties gating. Three gateway conventions must be derived from reviewer observations. Use the repaired tool to compile dev and prod profiles, a validation report and a summary, and deliver the tool for runs on unseen corpora."
keywords = ["security", "access-control", "entitlements", "bitemporal", "python", "cli"]
authors = [{ name = "Shubhi Goyal", email = "shubhi.goyal.int@ethara.ai" }]

[metadata]
category = "Software Engineering"
platforms = ["linux/amd64", "linux/arm64"]
tags = ["security", "access-review", "identity", "time-zones", "repair"]
estimated_duration_sec = 7200.0
expert_time_estimate_min = 480.0
junior_time_estimate_min = 1440.0
null_floor = 0.0
discrimination_weight = 1.0

[verifier]
timeout_sec = 2700.0
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.z.ai"]
user = "1000:1000"

[environment]
build_timeout_sec = 900.0
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []
