schema_version = "1.4"
artifacts = ["/app/out/derive_report.py", "/app/out/summary.json", "/app/out/policy_audit.json", "/app/out/data_quality.json", "/app/out/region_North.json", "/app/out/region_South.json", "/app/out/region_West.json", "/app/out/region_East.json", "/app/out/segment_commercial.json", "/app/out/segment_public.json"]

[task]
name = "terminal-bench/stall-graph-postmortem"
version = "1.0.0"
description = "Recover the withheld wire constants of a thread stall journal, settle the lock class blame assignment to its stable state, and ship a reusable stdlib post mortem program plus a reconciliation and derivation record."
keywords = ["debugging", "post-mortem", "lock-contention", "stall-analysis", "reconciliation", "python", "stdlib"]
authors = [{ name = "Aakarsh Kumar", email = "aakarsh.kumar@ethara.ai" }]

[metadata]
category = "Data Reconstruction"
platforms = ["linux/amd64", "linux/arm64"]
tags = ["debugging", "stall-triage", "blame-attribution", "calibration", "fixpoint", "stdlib"]
estimated_duration_sec = 21600.0
expert_time_estimate_min = 300.0
junior_time_estimate_min = 960.0
null_floor = 0.0
discrimination_weight = 1.0

[verifier]
timeout_sec = 2700.0
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[agent]
timeout_sec = 21600.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.z.ai"]
user = "1000:1000"

[environment]
build_timeout_sec = 1800.0
