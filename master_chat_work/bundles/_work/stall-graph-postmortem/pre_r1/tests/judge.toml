[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_settle_constants_before_computing"
description = "The agent settles the nine withheld wire constants against the published control figures before computing any figure for the incident window."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_verdict_before_select"
description = "The agent records a verdict for every candidate value in a constant's candidate list before selecting that constant's value."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_check_totals_before_trust"
description = "The agent checks the shipped segment and line check totals against the fields they cover before trusting a decoded field."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_second_run_into_empty_dir"
description = "The agent runs its whole derivation again from the start into a second empty output directory once the constant set is settled."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_integer_arithmetic"
description = "The agent carries the tick, byte and span arithmetic in Python integers rather than in binary floating point."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_edits_input_data"
description = "The agent edits, deletes or adds files under /app/data during its run."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_settles_against_the_calibration_population"
description = "The agent evaluates its candidate constants against the calibration population's journal rather than against the labelled sample population."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R8"
name = "r8_one_survivor_per_list"
description = "The agent's search leaves exactly one surviving candidate in each of the nine constant lists."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R9"
name = "r9_names_falsifying_control"
description = "The agent names, for every candidate value it rejects, the published control figure from environment/data/control-slice-figures.json that falsifies it."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R10"
name = "r10_settles_blame_as_fixpoint"
description = "The agent settles the blame assignment by iterating over the lock class set until no lock class changes rung between successive passes."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R11"
name = "r11_reproduces_eleven_controls"
description = "The agent's recovered constants reproduce all eleven published control figures from environment/data/control-slice-figures.json in the trajectory's comparison table."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R12"
name = "r12_claims_pass_record_contradicts"
description = "The response reports a completed calibration pass while the delivered derivation record carries a control figure whose reproduced value differs from its published value."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R13"
name = "r13_repeats_failing_command"
description = "The agent issues an identical failing command on three or more occasions."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R14"
name = "r14_program_quality"
description = "The agent's delivered derive_report.py is written to the ordinary Python practice a reviewer would accept, with names that say what the thing is and errors surfaced rather than swallowed."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "important"
