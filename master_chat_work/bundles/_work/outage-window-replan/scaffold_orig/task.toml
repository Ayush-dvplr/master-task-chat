[task]
name = "terminal-bench/outage-window-replan"
version = "1.0.0"
description = "A transmission operator must replan its season of maintenance outages after a control-room notice removes crews and adds urgent work. Build a reusable program that reads the asset register, requests, customers, load forecast, crew roster, published plan, network constraints, region calendar, risk policy and control-room log, selects the replanned season by the stated objective order, and writes the policy audit, per-region and per-segment reports, a summary and a data-quality report."
keywords = ["python", "csv", "json", "calculation", "stdlib"]
authors = [{ name = "Ayush Sah", email = "ayush.sah@ethara.ai" }]

