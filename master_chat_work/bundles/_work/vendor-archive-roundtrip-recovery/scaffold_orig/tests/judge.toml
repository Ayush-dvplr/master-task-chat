[judge]
judge = "openai/gpt-5.6-sol"
mode = "individual"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_reads_the_complete_app_data_format"
description = "The agent reads the complete /app/data/VARC-container-format.md specification before implementing decode.py or encode.py."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "EFFECT"
evidence = "The commands, file edits and outputs recorded in the trajectory."
residue = "The produced artifacts record the result and leave out how the agent reached it."
kind = "conduct"
category = "agent behavior"
evaluation_target = "trajectory"
importance = "important"
serves = "A correct deliverable is more likely when the agent works this way."

[[criterion]]
id = "R2"
name = "r2_identifies_the_record_modes_key_encodings"
description = "The agent identifies the record modes, key encodings, state and dictionary semantics, and error paths defined in the specification before implementing."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "EFFECT"
evidence = "The commands, file edits and outputs recorded in the trajectory."
residue = "The produced artifacts record the result and leave out how the agent reached it."
kind = "conduct"
category = "agent behavior"
evaluation_target = "trajectory"
importance = "important"
serves = "A correct deliverable is more likely when the agent works this way."

[[criterion]]
id = "R3"
name = "r3_derives_the_decoder_and_byte_exact"
description = "The agent derives the decoder and byte-exact encoder behaviour from the complete written specification and its worked examples."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "EFFECT"
evidence = "The commands, file edits and outputs recorded in the trajectory."
residue = "The produced artifacts record the result and leave out how the agent reached it."
kind = "conduct"
category = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "important"
serves = "A correct deliverable is more likely when the agent works this way."

[[criterion]]
id = "R4"
name = "r4_implements_raw_mode_delta_mode_dictionary"
description = "The agent implements raw mode, delta mode, dictionary mode, and the running-value and state semantics described in sections 4 through 6."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "EFFECT"
evidence = "The commands, file edits and outputs recorded in the trajectory."
residue = "The produced artifacts record the result and leave out how the agent reached it."
kind = "conduct"
category = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"
serves = "A correct deliverable is more likely when the agent works this way."

[[criterion]]
id = "R5"
name = "r5_handles_delta_records_dictionary_records_long"
description = "The agent handles delta records, dictionary records, long UTF-8 keys, and signed i16/i32 boundary values as the specification defines."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "EFFECT"
evidence = "The commands, file edits and outputs recorded in the trajectory."
residue = "The produced artifacts record the result and leave out how the agent reached it."
kind = "outcome"
category = "task completion"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
