evaluation_target = "trajectory"
importance = "critically_important"
serves = "The deliverable is derived from the shipped input by the agent's own work, which the grader rewards."

[[criterion]]
id = "R10"
name = "r10_summarizes_the_completed_work_and_names"
description = "The response summarizes the completed work and names where the produced artifacts were written."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "EFFECT"
evidence = "The final message the agent writes to the user."
residue = "The tests read files on disk and never see the agent's message."
kind = "conduct"
category = "agent behavior"
evaluation_target = "user_facing_message"
importance = "important"
serves = "The person running the task can find and trust the produced artifacts."

[[criterion]]
id = "R11"
name = "r11_implements_exactly_decode_py_and_encode"
description = "The agent implements exactly decode.py and encode.py at the paths the instruction names and adds no auxiliary or renamed modules."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "EFFECT"
evidence = "The commands, file edits and outputs recorded in the trajectory."
residue = "The produced artifacts record the result and leave out how the agent reached it."
kind = "constraint"
category = "instruction following"
evaluation_target = "trajectory"
importance = "important"
contract_sentence = "Only the six artifact paths named above are collected; `/app/decode.py` and `/app/encode.py` cannot import helper modules you write alongside them, and they cannot read `/app/data` while they run. VARC is invented for this task, so there is nothing about it to find elsewhere."
contract_file = "instruction.md"

[[criterion]]
id = "R12"
name = "r12_limits_its_implementation_to_python_standard"
description = "The agent limits its implementation to Python standard-library facilities as the instruction requires, refusing to introduce third-party packages."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "EFFECT"
evidence = "The commands, file edits and outputs recorded in the trajectory."
residue = "The produced artifacts record the result and leave out how the agent reached it."
kind = "constraint"
category = "instruction following"
evaluation_target = "trajectory"
importance = "important"
contract_sentence = "Both programs will be run against captures you have not seen, in a clean Python 3.12 that has only the standard library, so anything you pip install here will not be present at grading time."
contract_file = "instruction.md"
