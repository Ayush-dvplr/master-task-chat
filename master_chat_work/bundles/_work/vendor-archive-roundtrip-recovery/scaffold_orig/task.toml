schema_version = "1.4"
artifacts = ["/app/decode.py", "/app/encode.py", "/app/out/decoded_examples.jsonl", "/app/out/format_report.json", "/app/out/roundtrip_report.json", "/app/out/error_analysis.json"]

[task]
name = "terminal-bench/vendor-archive-roundtrip-recovery"
version = "1.0.0"
description = "Rebuild the codec for VARC1, a stateful binary archive container a vendor batch loader produced before the tool was retired. Read the shipped specification and reference files, then write a decoder and a byte-exact encoder that recover captured frames, carry per-stream dictionary and delta state across segment files, keep opaque extensions and non-shortest integers exactly as captured, apply the documented rejection precedence, and resynchronise after in-band damage. Produce the decoded examples and the format, round-trip and error reports."
keywords = ["python", "binary-format", "decoder", "encoder", "stdlib"]
authors = [{ name = "Ayush Sah", email = "ayush.sah@ethara.ai" }]

