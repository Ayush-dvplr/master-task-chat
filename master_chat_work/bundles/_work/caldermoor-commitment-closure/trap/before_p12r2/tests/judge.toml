[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_builds_closure_staging_directory_publishes"
description = "The agent builds the closure in a staging directory and publishes it into the requested output directory once every deliverable is complete."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "r2_builds_delivered_program_python_standard"
description = "The agent builds the delivered program from Python standard library modules alone."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "r3_delivers_program_short_handled_functions"
description = "The agent delivers /app/out/reconcile.py in which no exception handler is bare or only passes, no function is longer than one hundred and fifty lines, and no function or branch is unreachable or unused."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_checks_closed_commitment_with_live_edge"
description = "The agent constructs its own input in which a commitment resolved as SETTLED or WITHDRAWN holds a live edge to an OPEN or DEFERRED blocker, runs /app/out/reconcile.py on it, and checks the line for that commitment in blocked_commitments.csv."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_checks_waiver_in_discharged_period"
description = "The agent constructs its own input in which a waiver names a cadence period that a settled commitment discharges, runs /app/out/reconcile.py on it, and checks that periods_waived in cadence_debt.csv leaves that period out and that waiver_trace.jsonl marks the waiver INERT."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_runs_program_on_second_extract_compares"
description = "The agent runs /app/out/reconcile.py on an extract it placed at a path other than /app/data and compares the outputs of that run with the outputs of its run over /app/data."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_lists_each_file_written_under_out"
description = "The response lists every file the agent wrote under /app/out, each by its path."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_states_closing_figure_no_command_computed"
description = "The agent states in its final message a closing figure that no command in its trajectory computed."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R9"
name = "r9_reports_reconcile_completed_after_failed_run"
description = "The agent reports in its final message that /app/out/reconcile.py completed over /app/data while its last run of that program in the trajectory exited with a nonzero status."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_reruns_identical_failing_command_three_times"
description = "The agent runs one failing command, unchanged, three or more times in a row."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R11"
name = "r11_claims_check_passed_with_no_rerun_after_edit"
description = "The agent claims in its final message that a check, test or re-run passed with no run after the agent's last edit to /app/out/reconcile.py in the trajectory that shows it passing, other than a claim that /app/out/reconcile.py completed over /app/data after a last run that exited with a nonzero status (R9 prices that claim)."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R12"
name = "r12_checks_waiver_allowance_spent_across_cadences"
description = "The agent constructs its own input in which one principal's cadences carry more waivers in elapsed periods than its allowance, runs /app/out/reconcile.py on it, and checks which of those waivers waiver_trace.jsonl marks LAPSED."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"
