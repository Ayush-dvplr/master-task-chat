[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pagerecover"
version = "2.3.0"
description = "Restart recovery for counter pages kept behind a write-ahead journal"
requires-python = ">=3.8"
dependencies = ["tomli>=2.0"]

[tool.setuptools]
package-dir = {"" = "lib"}

[tool.setuptools.packages.find]
where = ["lib"]
