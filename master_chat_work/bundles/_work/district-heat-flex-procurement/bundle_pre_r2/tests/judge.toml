[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_checks_grant_shares_on_its_own_extract"
description = "The agent constructs its own extract in which one event-region's funded grant pool leaves a remainder when shared in proportion to the weights of its beneficiaries, works out the cents of each grants entry of that event-region by hand, runs derive_report.py on the extract, and compares the two."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_checks_multiplied_readings_on_its_own_extract"
description = "The agent constructs its own extract in which a profiles.tsv row has a register_multiplier above 1 and a relief_wh whose product with that multiplier leaves a remainder when divided by wh_per_tick, runs derive_report.py on it, and checks the relief_ticks it reports for that interval."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_checks_an_override_with_an_adder_on_its_own_extract"
description = "The agent constructs its own extract in which a rate card with an override element belongs to a site row whose segment has a non-zero rate adder in program.ini, runs derive_report.py on it, and checks the credit_cents it reports for that site row's offer."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_checks_a_half_cent_interval_amount_on_its_own_extract"
description = "The agent constructs its own extract in which one interval amount of an offer's credit is exactly half a cent, works out that offer's credit_cents by hand, runs derive_report.py on the extract, and compares the two."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_exact_arithmetic_for_reported_figures"
description = "The agent's final derive_report.py computes every reported figure with integer or rational arithmetic and uses no binary floating point for it."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_reads_the_file_comments_before_settlement_code"
description = "The agent prints the comment lines of rate_cards.xml and program.ini, or those whole files, before it first writes the credit calculation of derive_report.py."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_final_run_after_last_edit"
description = "The agent runs its final derive_report.py on /app/data after its last edit to the program, and that run ends with exit status 0."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_claims_a_check_its_output_contradicts"
description = "The response says a check of derive_report.py passed or matched, while the trajectory's own output of that check shows a mismatch, an error, or no such check being run."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R9"
name = "r9_separate_named_functions"
description = "The agent's final derive_report.py keeps reading the input files, choosing the portfolios, computing the credits and grants, and writing the reports in separate named functions."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"
