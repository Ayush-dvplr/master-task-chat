[[criterion]]
id = "R14"
name = "criterion_14"
description = "The response states the integer 14 as the count of LOB cycles holding a ledger row of a claim that carries an endorsement circular lacking authority-scoped sign-off (seventh counterfactual pair). The number must equal 14 exactly."
