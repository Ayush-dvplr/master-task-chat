description = "The response names a settled discount curve selection (either `flat_10y` or `duration_matched`) that is contradicted by at least one line of `/app/data/treasury_curve_observations.log`."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R30"
