[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "criterion_1"
description = "The response states the integer 2972752 as the total `alae`, in whole dollars, over every ledger row whose claim is absent from `retraction_notices.csv` (first counterfactual pair, carried IBNR held at zero). The number must equal 2972752 exactly."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "criterion_2"
description = "The response states the integer 83 as the count of ledger rows whose governing `want` exceeds their `alae` (first counterfactual pair, carried IBNR held at zero). The number must equal 83 exactly."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "criterion_3"
description = "The response states the integer 114 as the count of ledger rows whose `want` under the rival ALAE allocation convention differs from their governing `want` (second counterfactual pair). The number must equal 114 exactly."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R4"
name = "criterion_4"
description = "The response states the integer 3244705 as the total `want`, in whole dollars, over every row of the ledger rebuilt under the rival ALAE allocation convention (second counterfactual pair). The number must equal 3244705 exactly."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R5"
name = "criterion_5"
description = "The response states the integer 32 as the count of claims absent from `retraction_notices.csv` whose discount factor at their own cycle differs between the shipped curve and the curve extended by one tenor point (third counterfactual pair). The number must equal 32 exactly."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R6"
name = "criterion_6"
description = "The response states the integer 3031591 as the present-valued IBNR at the end of H26 on the shipped discount curve, in whole dollars (third counterfactual pair). The number must equal 3031591 exactly."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

