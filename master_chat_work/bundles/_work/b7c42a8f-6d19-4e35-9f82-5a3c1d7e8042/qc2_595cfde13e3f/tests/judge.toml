[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "criterion_1"
description = "The response states the integer 2972752 as the total ceded recoverable, in whole dollars, under the carried-IBNR-zero counterfactual where every claim's carried IBNR is held at zero. The number must equal 2972752 exactly."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "criterion_2"
description = "The response states the integer 20 as the count of ledger rows whose outcome would change under the carried-IBNR-zero counterfactual. The number must equal 20 exactly."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "criterion_3"
description = "The response states the integer 114 as the count of settled claims whose cession would differ under the rival ALAE allocation convention (excess_only rather than pro_rata). The number must equal 114 exactly."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R4"
name = "criterion_4"
description = "The response states the integer 1294465 as the total ceded recoverable, in whole dollars, under the rival ALAE allocation convention. The number must equal 1294465 exactly."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R5"
name = "criterion_5"
description = "The response states the integer 32 as the count of treaty settlements whose present value would differ when the discount curve tenor is extended by one point. The number must equal 32 exactly."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R6"
name = "criterion_6"
description = "The response states the integer 1830654 as the total present-valued IBNR at the end of H26, in whole dollars, under the tenor-extended discount curve. The number must equal 1830654 exactly."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

