[task]
name = "terminal-bench/sensor-network-lsq-correlated-adjustment"
version = "1.0.0"
description = "Diagnose and correct a faulty least-squares adjustment of a geodetic sensor network with correlated observation sessions: reconstruct the block-diagonal weight matrix from shipped session covariances, run robust reweighting, data-snooping blunder removal with a re-solve, a datum S-transformation, a chi-square model test, and derived-key residual rollups, delivered as a reusable stdlib derivation program."
keywords = ["mathematics", "least-squares", "geodetic-adjustment", "correlated-observations", "blunder-detection", "robust-estimation", "python", "stdlib"]
authors = [{ name = "Ayush Sah", email = "ayush.sah@ethara.ai" }]

