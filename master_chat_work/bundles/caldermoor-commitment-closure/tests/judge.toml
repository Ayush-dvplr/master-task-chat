[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_recomputes_allocation_separate_method"
description = "The agent recomputes the allocated minutes in attention_allocation.csv for at least one principal and month by a method separate from /app/out/reconcile.py and compares the two values."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_recomputes_cadence_debt_separate_method"
description = "The agent recomputes the debt in cadence_debt.csv for at least one cadence by a method separate from /app/out/reconcile.py and compares the two values."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_recomputes_reserve_separate_method"
description = "The agent recomputes the reserve_minutes in month_load_index.csv for at least one principal and month by a method separate from /app/out/reconcile.py and compares the two values."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_recomputes_hop_distances_separate_method"
description = "The agent recomputes the hop distances in blocking_closure.jsonl for at least one blocked commitment by a method separate from /app/out/reconcile.py and compares the two values."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_reruns_altered_copy_shows_line_change"
description = "The agent runs /app/out/reconcile.py on a copy of the shipped extract in which it changed one value that a rule of the protocol reads, and shows that the deliverable line depending on that value changed."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_reruns_relocated_shipped_copy_compares"
description = "The agent runs /app/out/reconcile.py from a directory other than /app/out on a copy of the shipped extract placed at a path other than /app/data, and compares that output with /app/out."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_runs_shared_allowance_input_shows_trace"
description = "The agent runs /app/out/reconcile.py on an input it built in which one principal owns two or more cadences whose waivers in elapsed periods together number more than four, and shows the resulting waiver_trace.jsonl lines for that input."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_runs_shortcut_chain_input_shows_line"
description = "The agent runs /app/out/reconcile.py on an input it built in which a blocked commitment reaches one of its blockers by two chains of blocking edges of different lengths, and shows the resulting blocked_commitments.csv line for that commitment."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_builds_closure_staging_then_publishes"
description = "The agent builds the closure in a staging directory and publishes it into the requested output directory only after every deliverable is complete."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_every_exception_handler_acts_on_error"
description = "The agent leaves /app/out/reconcile.py in which every exception handler acts on the error it catches: it raises, exits non-zero with a message, records the failure in an output, or returns a marker its caller turns into the reject or skip the record layouts state."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "critically_important"

[[criterion]]
id = "R11"
name = "r11_response_lists_every_identity_by_id"
description = "The response lists every identity that the validation report carries, each by its id."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R12"
name = "r12_claims_check_passed_with_no_later_run"
description = "The agent claims in its final message that a check, test or re-run passed with no run after its last edit to /app/out/reconcile.py in the trajectory that shows it passing, other than a claim that /app/out/reconcile.py completed over /app/data (R14 prices that claim)."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R13"
name = "r13_states_figure_differing_from_file"
description = "The response states a figure for a deliverable under /app/out that differs from the value in the delivered file it names."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R14"
name = "r14_reports_completion_after_nonzero_run"
description = "The agent reports in its final message that /app/out/reconcile.py completed over /app/data while its last run of that program in the trajectory exited with a nonzero status."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "important"
