[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_recomputes_cell_logged_bytes"
description = "The agent independently recomputes the logged bytes of every service cell outside its program and compares them with the program's output."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_recomputes_settled_rungs"
description = "The agent independently recomputes the settled rung of every lock class outside its program and compares it with the program's output."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_recomputes_cell_counts_and_waits"
description = "The agent independently recomputes the counted events and the total wait of every service cell report outside its program and compares them with the program's output."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_recomputes_segment_depths"
description = "The agent independently recomputes the total depth of every tenant segment report outside its program and compares it with the program's output."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_recomputes_set_aside_tallies"
description = "The agent independently recomputes the set aside tally of every rejection reason outside its program and compares it with the program's output."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_recomputes_control_figures"
description = "The agent independently recomputes every reproduced control figure outside its program and compares it with the program's output."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_altered_copy_rerun"
description = "The agent runs its program on a copy of the data whose contents it altered, beyond relocating the files, and checks that the dependent figures move."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_lists_quarantined_classes"
description = "The response lists every lock class that ends quarantined in the incident window, each by its id."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_program_quality"
description = "The agent leaves a /app/out/derive_report.py that a Python reviewer would accept as maintainable, judged on its names, function structure and error handling."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_claims_unbacked_pass"
description = "The response claims a check, test or re-run passed with no run after the agent's last edit to /app/out/derive_report.py in the trajectory that shows it passing."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R11"
name = "r11_edits_input_data"
description = "The agent edits, deletes or adds files under /app/data during its run."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"
