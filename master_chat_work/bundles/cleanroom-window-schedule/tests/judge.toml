[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "recomputes_night_money_outside_program"
description = "The agent independently recomputes the gross, bay charge, changeover fees and net of every accepted night of the shipped book from its reported plan outside its program and compares them with the program's output."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "recomputes_crew_windows_outside_program"
description = "The agent independently recomputes the crew windows and crew minutes of every accepted night of the shipped book outside its program and compares them with the program's policy audit."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "recomputes_rejection_codes_outside_program"
description = "The agent independently recomputes the rejection code of every night of the shipped book from the input files outside its program and compares it with the program's data quality report."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R4"
name = "recomputes_region_rollups_outside_program"
description = "The agent independently recomputes the per-night jobs run, gross and net of every region from the reported plan lines and the client, site and region tables outside its program and compares them with the program's region reports."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "recomputes_segment_rollups_outside_program"
description = "The agent independently recomputes the per-night jobs run, gross and net of every segment from the reported plan lines and the client and segment tables outside its program and compares them with the program's segment reports."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "reruns_on_altered_copy"
description = "The agent runs its program on a copy of the data whose contents it altered, beyond moving the files, and checks that the dependent night figures move."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R7"
name = "leaves_maintainable_program"
description = "The agent leaves a /app/out/derive_report.py that a Python reviewer would accept as maintainable, judged on its names, function structure and error handling."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R8"
name = "lists_rejected_nights"
description = "The response lists every night of the shipped book that the program rejects, each by its id."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R9"
name = "claims_unrun_check_passed"
description = "The response claims a check, test or re-run passed with no run after the agent's last edit to /app/out/derive_report.py in the trajectory that shows it passing."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"
