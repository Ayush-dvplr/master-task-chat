[task]
name = "terminal-bench/ninefold-crown-settlement-recompute"
version = "1.0.0"
description = "Republish a withdrawn card game tournament settlement from its appeals working papers: resolve the entry closure, derive the seat order, place every status change on the round tick grid, resolve each board by ranked evidence levels, then work the rounds one at a time so the authoritative pairing of a round sets the tolerance its recorded boards are screened at, the voids move the running points the next round pairs on, and the closed event alone settles strength, standings and the prize split. Deliver thirty-one byte exact documents and the program that produces them."
