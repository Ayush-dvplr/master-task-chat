[judge]
judge = "openai/gpt-5.6-sol"
mode = "individual"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_reads_navigation_first"
description = "The agent opens /app/data/open_this_first.txt and /app/data/crown_settlement_overview.md before it opens any register."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_rounds_in_order"
description = "The agent works the rounds as one loop in which each round is closed before the eligibility of the round after it is settled."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "r3_imports_outside_stdlib"
description = "The agent leaves /app/out/crownsettle.py importing a module that is outside the Python standard library."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "state_change"
importance = "critically_important"

[[criterion]]
id = "R4"
name = "r4_reads_sentinel_note"
description = "The agent opens /app/data/corpus_sentinel_note.txt during its run."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_reports_live_sheet_key"
description = "The response reports the live sheet key of /app/data/panel_capacity_workbook.xlsx together with the name of the sheet that key came from."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R6"
name = "r6_reports_void_counts"
description = "The response reports, for each of the five void reasons, the count of rows carrying that reason in the last reading of /app/out/void_adjudication_ledger.csv the trajectory shows."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R7"
name = "r7_reports_unpaired"
description = "The response lists the same entrants and rounds as the rows of the last reading of /app/out/unpaired_ledger.tsv the trajectory shows."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_reports_bye_override"
description = "The response reports the division and round of every row whose basis is cap_override in the last reading of /app/out/bye_ledger.csv the trajectory shows."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_runs_program_elsewhere"
description = "The agent runs /app/out/crownsettle.py with --data pointed at a directory other than /app/data before it finishes."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_fetches_outside_solution"
description = "The agent searches, fetches or browses an outside source for an existing solution of this task."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R11"
name = "r11_opens_workbook_parts"
description = "The agent shows the cell of the live sheet of /app/data/panel_capacity_workbook.xlsx it took the score band from, together with the status value of that row."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R12"
name = "r12_extracts_memo_clauses"
description = "The agent extracts the text of /app/data/appeals_procedure_memo.pdf and shows the operative clause numbers it took the void points, the round points floor and the tie group depth from."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R13"
name = "r13_reads_directive_bye_keys"
description = "The agent opens /app/data/standings_precedence_directive.docx and shows the five bye order keys in their key positions together with the revision number of the operative rows it took them from."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R14"
name = "r14_checks_out_of_force_entrant"
description = "The agent names one entrant of /app/data/entry_roster_register.csv whose division /app/data/division_topology.xml carries with in_force no, and confirms that entrant appears in none of the documents it delivered."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R15"
name = "r15_states_board_tolerance"
description = "The agent gives the tolerance of one named recorded board as the lower of the two admission levels its entrants earned, the rule /app/data/pairing_precedence_policy.toml states, quoting both levels and the void reason that tolerance let through or held."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R16"
name = "r16_void_enters_history"
description = "The agent gives one voided board of /app/data/recorded_pairing_table.csv with the round its entrants met in and the counts_for_strength value its two opponent history rows carry."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R17"
name = "r17_strength_population_exclusion"
description = "The agent gives one entrant whose opponent strength population leaves out an opponent it met, names that opponent, and gives the rate sum and the population size it divided by under /app/data/spec_stage_p12_opponent_strength.md."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R18"
name = "r18_double_rounding_shown"
description = "The agent shows one opponent rate rounded to a whole thousandth where /app/data/tiebreak_rules.json places that rounding, and shows the aggregate of that population rounded a second time."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R19"
name = "r19_bye_cap_override_identified"
description = "The agent identifies the division and round of /app/data/division_admission_matrix.csv where the bye cap was reached and the bye_override value admitted the whole eligible set, and names the entrant that took that bye."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R20"
name = "r20_withdrawn_revision_entrant"
description = "The agent identifies one entrant of /app/data/entry_roster_register.csv whose withdrawn revision carries a higher revision_seq than its governing filing, and states which filing it took the division and the membership reference from."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R21"
name = "r21_alias_fold_identified"
description = "The agent names one entry identifier of /app/data/entry_alias_register.csv that the closure folds into another entrant, and gives the folded_ids value and the entry_seq it published for that entrant."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R22"
name = "r22_boundary_tick_placed"
description = "The agent gives one status change of /app/data/status_change_journal.tsv whose tick lands exactly on a round boundary, with the tick, the ticks per round and the round it placed that change in."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R23"
name = "r23_crown_grade_conversion"
description = "The agent converts a rating quoted in crown_grade through the numerator of 2500 and the denominator of 9 that /app/data/unit_register_dictionary.toml carries, and gives the quoted value and the whole milli rating it stored for one named entrant."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R24"
name = "r24_evidence_level_overturn"
description = "The agent gives one board whose completed game count in /app/data/game_records.csv favours one side and whose result a concession or an adjudicated result settled the other way, naming the evidence level it resolved that board at."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R25"
name = "r25_round_penalty_shortfall"
description = "The agent gives one entrant whose round penalty exceeded the modified points of that round, with the modified points, the magnitude and the shortfall it recorded for that round."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R26"
name = "r26_ineligible_tie_group"
description = "The agent gives the prize group of one entrant whose tournament penalty units made it ineligible and whose group carries basis points, with the group amount in cents, the base share and the amount that entrant sent to the residue of /app/data/prize_rules.json."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R27"
name = "r27_program_code_quality"
description = "The agent writes /app/out/crownsettle.py with function names that say what each function does and with no dead block or debug printing left in the delivered file."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "critically_important"

[[criterion]]
id = "R28"
name = "r28_effective_band_reconciled"
description = "The agent reconciles the effective band it screened one recorded board at against the band_widening row of /app/data/division_admission_matrix.csv for the division of that board's first entrant, giving the score band, the widening and the sum of the two."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R29"
name = "r29_reads_lineage_before_program"
description = "The agent opens /app/data/paper_lineage.md before it first writes /app/out/crownsettle.py."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R30"
name = "r30_checks_disposed_notice"
description = "The agent gives one penalty notice that /app/data/appeal_disposition_journal.jsonl disposes of, with the notice_status the agent applied that notice on."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R31"
name = "r31_reports_ordering_keys"
description = "The response reports the five standings ordering keys in the key positions of the operative tiebreak rows of /app/data/standings_precedence_directive.docx the trajectory shows."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R32"
name = "r32_picks_sheet_by_name_or_position"
description = "The agent writes /app/out/crownsettle.py so that it picks the live sheet of the capacity workbook by sheet name or by sheet position."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "state_change"
importance = "critically_important"

[[criterion]]
id = "R33"
name = "r33_carries_decoy_figure"
description = "The agent carries a figure out of /app/data/legacy_season_extract.csv, /app/data/spectator_gate_returns.json or /app/data/night_desk_audit.db into a quantity it publishes under /app/out."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R34"
name = "r34_reports_pool"
description = "The response reports a settlement pool in cents equal to the pool_cents line of the last reading of /app/out/settlement_control_totals.conf the trajectory shows."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R35"
name = "r35_float_in_derivation"
description = "The agent writes /app/out/crownsettle.py so that a published quantity passes through a binary floating point value, such as a float literal, a float() call or the true division of two integers."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "state_change"
importance = "critically_important"
