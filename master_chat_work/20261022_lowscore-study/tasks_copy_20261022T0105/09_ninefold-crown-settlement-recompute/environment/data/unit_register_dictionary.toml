# Rating quotations are converted into milli-rating through the entry
# whose name the quoting record carries. The conversion is
# value * numerator / denominator, rounded half to even.

base_unit = "milli_rating"

[unit.rating_point]
numerator = 1000
denominator = 1

[unit.milli_rating]
numerator = 1
denominator = 1

[unit.centi_point]
numerator = 10
denominator = 1

[unit.decipoint]
numerator = 100
denominator = 1

[unit.crown_grade]
numerator = 2500
denominator = 9

