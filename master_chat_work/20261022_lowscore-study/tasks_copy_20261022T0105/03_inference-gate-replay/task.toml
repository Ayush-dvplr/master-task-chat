schema_version = "1.4"
artifacts = ["/app/out/gate.py"]

[task]
name = "terminal-bench/inference-gate-replay"
version = "1.0.0"
description = "Recover the undocumented constants of a lost model serving inference gate from one recorded shift and four digests, then rebuild the gate as a reusable program that reduces any shift in the same schema into four exact reports."
keywords = ["python", "csv", "json", "rule-recovery", "stdlib"]
authors = [
    { name = "Abdus Samad Ali", email = "abdus.samadint17@ethara.ai" },
]

[metadata]
category = "Data Processing"
platforms = ["linux/amd64", "linux/arm64"]
tags = ["python", "csv", "json", "rule-recovery", "stdlib"]
estimated_duration_sec = 2700.0
expert_time_estimate_min = 480.0
junior_time_estimate_min = 1440.0
null_floor = 0.0
discrimination_weight = 1.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.z.ai"]
user = "1000:1000"

[environment]
build_timeout_sec = 900.0
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []
