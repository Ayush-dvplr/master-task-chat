schema_version = "1.4"
artifacts = ["/app/out/triage.py"]

[task]
name = "terminal-bench/assay-plate-triage"
version = "1.0.0"
description = "Rebuild a lost microplate triage engine from one recorded bench run and the outcome that engine produced for it. The stage order and report shapes are documented; every constant the stages apply has to be fitted from the reference outcome. The delivered program is driven over runs it has never seen."
keywords = ["scientific-computing", "rule-recovery", "integer-arithmetic", "carried-state", "stdlib"]
authors = [{ name = "Aakarsh Kumar", email = "aakarsh.kumar@ethara.ai" }]

[metadata]
category = "Scientific Computing"
platforms = ["linux/amd64", "linux/arm64"]
tags = ["assay", "rule-recovery", "carried-state", "aggregation", "determinism"]
estimated_duration_sec = 7200
expert_time_estimate_min = 240
junior_time_estimate_min = 600
null_floor = 0.0
discrimination_weight = 1.0

[verifier]
timeout_sec = 3600
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[agent]
timeout_sec = 5400
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.z.ai"]
user = "1000:1000"

[environment]
build_timeout_sec = 1800
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 8192
gpus = 0
mcp_servers = []
