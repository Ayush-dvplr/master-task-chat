schema_version = "1.4"
artifacts = [
  "/app/out/settle.py",
]

[task]
name = "terminal-bench/grain-intake-settlement"
version = "1.0.0"
description = "Rebuild a lost grain elevator settlement engine from two worked intake shifts and the outcome that engine produced for them. The stage order, the screening of retransmitted, conflicting, re-entered and damaged ticket lines, and the report shapes are documented; every constant the stages apply has to be fitted from the worked outcomes, and a thirteen bit mode word has to be read off the digests the graded manifest carries. The delivered program is driven over intakes it has never seen."
keywords = ["data-processing", "rule-recovery", "integer-arithmetic", "carried-state", "determinism"]
authors = [{ name = "Harshank Kanungo", email = "harshank.kanungo1992@ethara.ai" }]

[metadata]
category = "Data Processing"
platforms = ["linux/amd64", "linux/arm64"]
tags = ["grain", "rule-recovery", "carried-state", "aggregation", "determinism"]
estimated_duration_sec = 7200
expert_time_estimate_min = 240
junior_time_estimate_min = 600
null_floor = 0.0
discrimination_weight = 1.0

[verifier]
timeout_sec = 3600
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[agent]
timeout_sec = 7200
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.z.ai"]
user = "1000:1000"

[environment]
build_timeout_sec = 1800
network_mode = "no-network"
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
mcp_servers = []
