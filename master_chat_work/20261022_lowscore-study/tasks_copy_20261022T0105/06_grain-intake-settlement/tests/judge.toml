importance = "critically_important"

[[criterion]]
id = "R24"
name = "r24_moves_shipped_input"
description = "The agent moves the shipped input directory to another location on the filesystem."
type = "binary"
weight = -1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R25"
name = "r25_recomputes_manifest_digests"
description = "The agent recomputes the bin digests the run notes define from a resolution of its own and compares them against the values the intake manifest carries."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R26"
name = "r26_reproduces_worked_intakes"
description = "The agent reproduces the three shipped output files of both mode zero intakes byte for byte."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R27"
name = "r27_settles_bits_one_at_a_time"
description = "The agent works through the mode word one bit at a time, fixing a reading for each bit before it moves to the next."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R28"
name = "r28_reads_notes_first"
description = "The agent opens the engine note and the report note in the shipped input directory before it writes the settlement program."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R29"
name = "r29_claims_bits_are_documented"
description = "The response presents the meaning of an individual mode bit as something the shipped notes spell out."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R30"
name = "r30_engine_code_quality"
description = "The agent writes /app/out/settle.py as named functions or classes a reader can follow, with its fitted constants and mode bits held in named values, and with no bare except, no dead blocks and no debug prints left in it."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"
