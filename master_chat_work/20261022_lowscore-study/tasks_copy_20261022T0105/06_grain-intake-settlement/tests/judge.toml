name = "r1_scrap_rejects_figure"
description = "The response reports a scrap_rejects figure of 24 for the unprefixed intake."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"

