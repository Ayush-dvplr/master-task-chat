[judge]
judge = "openai/gpt-5.6-sol"
mode = "individual"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_reads_entry_papers_first"
description = "The agent opens /app/data/readme_first.txt and /app/data/terminal_contract_overview.md before it opens any register."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_stage_order"
description = "The agent works the fourteen stages in the order /app/data/terminal_contract_overview.md lists them."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "r3_stdlib_only"
description = "The agent restricts /app/out/reeferdispatch.py to the Python standard library."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "state_change"
importance = "critically_important"

[[criterion]]
id = "R4"
name = "r4_reads_sentinel_note"
description = "The agent reads /app/data/corpus_sentinel_note.txt before it concludes that a documented branch is absent from this operating day."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R5"
name = "r5_reports_live_sheet"
description = "The response gives the live workbook sheet key together with the sheet name that key was taken from."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R6"
name = "r6_reports_pass_count"
description = "The response gives the number of passes the reconciliation ran to together with one reefer whose share was still moving at the last of them."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R7"
name = "r7_reports_rung_counts"
description = "The response gives the count of reefers set aside under each of the six rung codes printed in /app/data/dispatch_admission_ladder.txt."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R8"
name = "r8_reports_empty_returns"
description = "The response names the reefers whose energy return declared nothing."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_reports_objective_order"
description = "The response gives the seven components of the objective vector in the order they are compared."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_out_of_force_feeder"
description = "The agent names a feeder that /app/data/feeder_capacity_register.csv carries a capacity row for and that /app/data/substation_topology.xml omits, and states that the feeder stands out of force."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R11"
name = "r11_reports_crane_clamp"
description = "The response names one feeder and one interval where the crane duty took the adjusted capacity of that feeder to zero."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R12"
name = "r12_fourteen_named_steps"
description = "The agent leaves /app/out/reeferdispatch.py carrying the fourteen stages as fourteen separately named steps in the stage order /app/data/terminal_contract_overview.md prints, as /app/data/reeferdispatch_program_contract.md requires."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R13"
name = "r13_data_untouched"
description = "The agent leaves /app/data byte for byte as it found it."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R14"
name = "r14_workbook_parts"
description = "The agent opens /app/data/substation_capacity_workbook.xlsx as a zip archive, reads its worksheet and shared string parts, and shows the cell it took the reconciliation damping numerator and denominator from."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R15"
name = "r15_memo_text"
description = "The agent extracts the text of /app/data/dispatch_operations_memo.pdf and shows the reconciliation pass budget, the minimum step in watt hours and the dependency protection depth it read there."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R16"
name = "r16_directive_keys"
description = "The agent opens /app/data/priority_ordering_directive.docx and shows the four ordering keys in their key positions together with the class rank it read for each temperature class."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "tool use"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R17"
name = "r17_reserved_capacity"
description = "The agent gives the reserved capacity of one named feeder in one named interval as that feeder nominal capacity for the interval less its standing reserve watts, quoting all three figures."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R18"
name = "r18_budget_truncation"
description = "The agent gives, for one named reefer, its need and its target at the opening of the last reconciliation pass together with the share that pass closed on, and states that the day pool of its feeder still stood unallocated when the budget ran out."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R19"
name = "r19_rounded_pass"
description = "The agent shows one reconciliation share rounded to a whole watt hour at the close of a pass and shows the pass after it opening from that rounded figure."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R20"
name = "r20_unit_conversion"
description = "The agent converts a nameplate quoted in megajoules per hour through the numerator of 2500 and the denominator of 9 that /app/data/unit_register_dictionary.toml carries, and gives the quoted value and the whole watt figure it stored for one named reefer."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R21"
name = "r21_redistribution_cell"
description = "The agent names the substation and service group pairing it redistributed a freed share inside for one feeder, and gives the reefer whose share ceiling freed that mass."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R22"
name = "r22_cluster_rung"
description = "The agent names the reefer that the cluster rung of /app/data/dispatch_admission_ladder.txt caught on the plug four reefers of this operating day share in /app/data/reefer_service_register.csv."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R23"
name = "r23_boundary_disconnect"
description = "The agent gives one reefer whose disconnect minute lands on an interval boundary together with the connect minute, the disconnect minute and the last interval of the lattice it gave that reefer."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R24"
name = "r24_soc_at_reserve"
description = "The agent gives one interval where the closing state of charge equalled the reserve watt hours of /app/data/battery_operating_policy.toml, with the discharge it published for that interval and the limit reason it gave."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R25"
name = "r25_withdrawn_revision"
description = "The agent identifies the vessel in /app/data/vessel_call_register.csv whose highest revision sequence is a withdrawn one, and states which lower revision it took as the applicable call together with the cutoff interval that revision carries."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R26"
name = "r26_superseded_return"
description = "The agent identifies a reefer in /app/data/energy_declaration_returns.psv whose superseded return carries a higher declaration sequence than its filed one, and states which of the two rows it took the declared energy from."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R27"
name = "r27_displaced_placement"
description = "The agent gives one removed placement with the interval it was removed from, the interval it landed in and the reserved capacity of that landing interval."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R28"
name = "r28_no_dead_code"
description = "The agent leaves /app/out/reeferdispatch.py free of dead code, carrying no binding it never reads and no block it never reaches."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R29"
name = "r29_sweep_budget"
description = "The agent reconciles the sweep budget it worked the deadline correction under against the dependency protection depth of /app/data/dispatch_operations_memo.pdf, giving both figures and the addition between them."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R30"
name = "r30_inert_papers"
description = "The agent states that /app/data/reefer_thermal_supplement.csv, /app/data/legacy_tariff_extract.csv and /app/data/night_office_audit.db govern nothing, citing /app/data/data_lineage.md as the paper that says so."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R31"
name = "r31_rerun_compare"
description = "The agent runs its delivered program a second time over one input directory, compares the two outputs byte for byte, and reports the result of that comparison."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R32"
name = "r32_wrong_sheet"
description = "The agent quotes a damping fraction, a maintenance coefficient or a vessel share ceiling taken from a sheet of /app/data/substation_capacity_workbook.xlsx whose key cell carries a day reference other than the one /app/data/substation_topology.xml gives."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R33"
name = "r33_report_contradicts_delivery"
description = "The response states a figure for a published quantity that differs from the figure the document the agent delivered carries for that quantity."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R34"
name = "r34_legacy_tariff"
description = "The agent settles the price of an interval from /app/data/legacy_tariff_extract.csv and carries that price into the tariff charge ledger."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R35"
name = "r35_earlier_day_row"
description = "The agent takes a governing row for this operating day from a register record whose day identifier names one of the earlier operating days the registers carry."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "critically_important"
