schema_version = "1.4"
artifacts = ["/app/out/optimize.py", "/app/out/scenario_visible.json", "/app/out/scenario_peak.json", "/app/out/scenario_steady.json", "/app/out/scenario_burst.json", "/app/out/scenario_latency.json", "/app/out/perf_report.json", "/app/out/bottleneck_analysis.json", "/app/out/recommendations.json", "/app/out/data_quality.json"]

[task]
name = "terminal-bench/registry-lock-footprint-resolution"
version = "1.0.0"
description = "Recover six withheld registry constants from a calibration slice, read binary package index shards through eleven announced transforms, merge rename chains, and settle the smallest valid lock plan of five benchmark workspaces under feature unification, licence and quarantine rules, with a reusable planner and a derivation record."
keywords = ["python", "package-management", "dependency-resolution", "binary-format", "constraint-search", "stdlib"]
authors = [{ name = "Kunwar Singh", email = "kunwar.singh@ethara.ai" }]

[metadata]
category = "Software Engineering"
platforms = ["linux/amd64", "linux/arm64"]
tags = ["python", "package-management", "dependency-resolution", "binary-format", "constraint-search", "stdlib"]
estimated_duration_sec = 10800.0
expert_time_estimate_min = 300.0
junior_time_estimate_min = 900.0
null_floor = 0.0
discrimination_weight = 1.0

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[agent]
timeout_sec = 10800.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.z.ai"]
user = "1000:1000"

[environment]
build_timeout_sec = 900.0
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 8192
gpus = 0
mcp_servers = []
