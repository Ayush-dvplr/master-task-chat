[judge]
judge = "openai/gpt-5.6-sol"
mode = "individual"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_states_half_even_rounding"
description = "The response states that probabilities and report values use round-half-to-even."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_states_unknown_category_zero"
description = "The response states that unknown categories contribute all-zero indicators."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_states_threshold_tie_positive"
description = "The response states that a rounded probability equal to the threshold predicts positive."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_states_state_replayed_in_file_order"
description = "The response states that the running state is replayed over the records in file order."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_checks_state_separates_equal_records"
description = "The agent runs its derivation over two records that share a feature value and shows the running state drives their probabilities apart."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_checks_clipped_hinge_values"
description = "The agent checks a raw value beyond its clip bound against the hinge contributions the declared knots produce."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_checks_calibrated_probability_by_hand"
description = "The agent checks one calibrated score against a hand-computed logistic value before accepting the report."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_reconciles_confusion_cells"
description = "The agent reconciles the four confusion-matrix cells with the record count."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_single_rounding_helper"
description = "The agent writes derive_report.py with one shared half-to-even rounding helper that every rounded report value passes through."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_claims_skipped_validation"
description = "The agent reports a validation or reconciliation in its summary that its trajectory shows it skipped."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R11"
name = "r11_edits_shipped_inputs"
description = "The agent edits any of the six shipped input files under the data directory."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"
