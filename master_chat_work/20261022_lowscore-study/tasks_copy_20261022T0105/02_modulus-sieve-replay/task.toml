schema_version = "1.4"
artifacts = ["/app/out/sieve.py"]

[task]
name = "terminal-bench/modulus-sieve-replay"
version = "1.0.0"
description = "Recover the undocumented constants of a lost modular residue mill from one recorded sieve pass and its two rollups, then rebuild the mill as a reusable program that resolves any pass in the same schema into four exact reports."
keywords = ["python", "modular-arithmetic", "number-theory", "rule-recovery", "stdlib"]
authors = [{ name = "Swati Sharma", email = "swati.sharma@ethara.ai" }]

[metadata]
category = "Mathematics"
platforms = ["linux/amd64", "linux/arm64"]
tags = ["python", "modular-arithmetic", "number-theory", "rule-recovery", "stdlib"]
estimated_duration_sec = 7200.0
expert_time_estimate_min = 480.0
junior_time_estimate_min = 1440.0
null_floor = 0.0
discrimination_weight = 1.0

[verifier]
timeout_sec = 2700.0
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.z.ai"]
user = "1000:1000"

[environment]
build_timeout_sec = 1800.0
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []
