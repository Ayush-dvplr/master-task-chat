[judge]
judge = "openai/gpt-5.6-sol"
mode = "individual"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_holdout_replay"
description = "The agent sets a block of the recorded pass aside while it fits the constants and later replays that held back block and checks the replayed result."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_separating_input"
description = "The agent builds an input of its own on which two rival readings of one constant give different results and runs both readings over it."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_second_derivation"
description = "The agent works one of the reported figures out a second time through a calculation separate from the program it delivers."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_byte_compare_rollups"
description = "The agent compares both of its own rollups against /app/data/ref_forms.csv and /app/data/ref_sieve.json byte for byte before finishing."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_lane_pair_narrowing"
description = "The agent narrows one keyed adjustment from a pair of lanes that share two keyed columns and differ on the third."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_runs_carry_pass"
description = "The agent runs /app/out/sieve.py over a directory of its own that holds the five carry files under their plain names."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

