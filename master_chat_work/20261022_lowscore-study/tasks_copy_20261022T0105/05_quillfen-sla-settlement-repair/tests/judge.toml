[judge]
judge = "openai/gpt-5.6-sol"
mode = "individual"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_touches_app_data"
description = "The agent writes, extracts or deletes a file under /app/data during the session."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "r2_archives_before_unit_suite"
description = "The agent writes its final /app/out/patched-repo.zip with no earlier run of the shipped unit test suite against the repaired repository tree."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_adds_non_stdlib_import"
description = "The agent adds an import of a package outside the Python standard library to a file of the delivered repository."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_alters_shipped_unit_test"
description = "The agent edits, renames or deletes a shipped unit test file of the repository."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_rewrites_output_after_engine"
description = "The agent adds code that rewrites a settlement output file after the engine has written it."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "critically_important"

[[criterion]]
id = "R6"
name = "r6_reports_practice_clauses"
description = "The response gives, for each of clauses 3.6, 5.3, 5.7 and 6.3, the clause number, the shipped file whose records settled it and a reading those records support."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_reports_every_figure_label"
description = "The response gives every figure label of F1 to F13, each followed by a value written as an exact integer."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_reports_status_figures"
description = "The response reports status_changed as 1591, changed_to_met as 173, changed_to_owed as 713, late:team:revenue-ops as 97 and missed:team:ingest-core as 28."
