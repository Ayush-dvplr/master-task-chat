[judge]
judge = "openai/gpt-5.6-sol"
mode = "individual"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_drives_service_both_channels"
description = "The agent starts the shipped service and drives it through its command line channel and through its HTTP interface, making at least one state change on each."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "EFFECT"
evidence = "The trajectory shows the service started and a state change enacted through both the command line channel and the HTTP interface."
residue = "The verifier grades the delivered files, not whether the control plane service was driven, so no test can see this."
kind = "conduct"
category = "agent behavior"
evaluation_target = "trajectory"
importance = "important"
serves = "The instruction says to start the service and enact decisions through both channels, making at least one state change through each."

[[criterion]]
id = "R2"
name = "r2_names_service_channel_per_state_change"
description = "The response names the service channel that carried each state change the run made."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "VALUE"
evidence = "The final message names, for each state change, whether it went through the command line channel or the HTTP interface."
residue = "The channel used for each change lives in the trajectory and the message, which no deterministic test reads."
kind = "outcome"
category = "task completion"
evaluation_target = "final_answer"
importance = "important"

