[task]
name = "terminal-bench/speculative-decode-arbiter"
version = "1.0.0"
description = "Replay a recorded speculative decoding run from a heterogeneous corpus and rebuild the tenant accounting it owes. The replay repairs malformed records, resolves token agreement under an equivalence table, settles a per stream draft width against a moving average that the schedule itself feeds, applies lease preemption and cancellation in the documented order, and closes a five class conservation identity across twenty one deliverables."
keywords = ["speculative-decoding", "replay", "accounting", "fixed-point", "leases", "stdlib"]
authors = [{ name = "Aditya Jain", email = "aditya.jainint17@ethara.ai" }]

[metadata]
category = "Machine Learning"
platforms = ["linux/amd64", "linux/arm64"]
tags = ["speculative-decoding", "inference-serving", "deterministic-replay", "conservation", "fixed-point", "stdlib"]
estimated_duration_sec = 7200.0
expert_time_estimate_min = 480.0
junior_time_estimate_min = 1440.0
null_floor = 0.0
discrimination_weight = 1.0

