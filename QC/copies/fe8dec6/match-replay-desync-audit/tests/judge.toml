[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_enumerates_full_candidate_set_withheld"
description = "The agent writes the full candidate set of every withheld quantity to /app/out/bottleneck_analysis.json before its first write of /app/out/optimize.py."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "r2_establishes_withheld_quantity_against_own"
description = "The agent establishes each withheld quantity against its own published control figure before reporting any figure that depends on that quantity."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_appends_rejected_candidate_together_falsifier"
description = "The agent appends each rejected candidate together with its falsifier at the moment of discard rather than collecting the rejections once the search has ended."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_carries_amount_share_stock_target"
description = "The agent carries every amount, share, stock and target through the decimal or rational facility of the standard library rather than binary floating point."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_empties_report_directory_eight_settlement"
description = "The agent empties the report directory of the eight settlement reports and the record once the last withheld quantity has settled and rebuilds them in one clean run that leaves the program in place."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_writes_file_outside_report_directory"
description = "The agent writes, edits, moves or deletes a file outside the scope of its task, anywhere other than /app/out, during its run."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_builds_input_overrunning_one_allowance"
description = "The agent constructs its own input in which two settled entries of one charter together exceed that charter's allowance inside one live window, runs its program on it, and checks the settled amount it reports for the later entry against the value it expects."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_builds_input_renewing_allowance_at_window"
description = "The agent constructs its own input in which a charter spends its allowance before a live window opens and an entry of that charter settles at or after that window's first tick, and checks the settled amount its program reports for that entry against the value it expects."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_builds_input_cancelling_drawn_entry"
description = "The agent constructs its own input in which every calibration control figure still reproduces while a reversal cancels an entry that would otherwise draw on a charter allowance, and checks the settled amount total its program reports against the value it expects."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R10"
name = "r10_claims_published_control_figure_reproduced"
description = "The response claims every published control figure was reproduced while the delivered record carries a produced figure differing from the published one."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R11"
name = "r11_delivered_program_code_quality"
description = "The agent delivers a /app/out/optimize.py in which no exception handler is bare or only passes, no function is longer than 150 lines, and no function or branch is unreachable or unused."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "state_change"
importance = "important"
