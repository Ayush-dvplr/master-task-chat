[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "recomputes_benefits_outside_program"
description = "The agent independently recomputes the benefit of every proposal in the chosen portfolios and of every VALUE audit row of the shipped book from the rate, risk and site tables outside its program and compares them with the program's output."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R2"
name = "recomputes_pair_sources_outside_program"
description = "The agent independently recomputes the joining sources of every PAIR audit row of the shipped book from the crew, permit and exclusion files outside its program and compares them with the program's policy audit."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R3"
name = "recomputes_rejection_codes_outside_program"
description = "The agent independently recomputes the rejection code, file and row of every round of the shipped book from the input files outside its program and compares them with the program's data quality report."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R4"
name = "recomputes_region_rollups_outside_program"
description = "The agent independently recomputes the selected proposals and benefit of every region for every planned round of the shipped book from the chosen portfolios and the site and region tables outside its program and compares them with the program's region reports."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R5"
name = "recomputes_segment_rollups_outside_program"
description = "The agent independently recomputes the selected proposals and benefit of every segment for every planned round of the shipped book from the chosen portfolios and the segment table outside its program and compares them with the program's segment reports."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "recomputes_small_round_portfolios_outside_program"
description = "The agent independently recomputes the chosen portfolio of every planned round of the shipped book with at most 16 proposals by enumerating its conflict-free portfolios outside its program and compares it with the program's summary."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R7"
name = "reruns_on_altered_copy"
description = "The agent runs its program on a copy of the data whose contents it altered, beyond moving the files, and checks that the dependent round figures move."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R8"
name = "times_program_on_shipped_book"
description = "The agent times a run of its program on the shipped book and compares the wall time with the 20 seconds the contract allows for a book."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R9"
name = "leaves_maintainable_program"
description = "The agent leaves a /app/out/derive_report.py that a Python reviewer would accept as maintainable, judged on its names, function structure and error handling."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R10"
name = "lists_rejected_rounds"
description = "The response lists every round of the shipped book that the program rejects, each by its id."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R11"
name = "claims_unrun_check_passed"
description = "The response claims a check, test or re-run passed with no run after the agent's last edit to /app/out/derive_report.py in the trajectory that shows it passing."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "final_answer"
importance = "critically_important"
