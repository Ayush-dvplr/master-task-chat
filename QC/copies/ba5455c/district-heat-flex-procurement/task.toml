schema_version = "1.4"
artifacts = ["/app/out/derive_report.py", "/app/out/summary.json", "/app/out/policy_audit.json", "/app/out/data_quality.json", "/app/out/region_North.json", "/app/out/region_South.json", "/app/out/region_West.json", "/app/out/region_East.json", "/app/out/segment_commercial.json", "/app/out/segment_public.json"]

[task]
name = "terminal-bench/district-heat-flex-procurement"
version = "1.0.0"
description = "Write a reusable Python standard-library program that reads a district-heating demand-response extract spread over fourteen linked files in seven formats, scales meter register readings, rejects and counts malformed profile and site rows, picks the exact best offer portfolio for every event and region under interval ceilings and one mode per site, settles capped performance credits from rates composed across three files, funds each grant pool after those credits, shares it by largest remainder with doubled weight for waived sites, and writes nine exact JSON reports in integer ticks, cents and basis points."
keywords = ["python", "optimization", "district-heating", "demand-response", "settlement", "largest-remainder", "stdlib"]
authors = [{ name = "Ayush Sah", email = "ayush.sah@ethara.ai" }]

[metadata]
category = "Optimization"
platforms = ["linux/amd64", "linux/arm64"]
tags = ["optimization", "combinatorial-search", "energy", "multi-format-parsing", "exact-arithmetic", "data-joining"]
estimated_duration_sec = 6600.0
expert_time_estimate_min = 360.0
junior_time_estimate_min = 1080.0
null_floor = 0.0
discrimination_weight = 1.0

[verifier]
timeout_sec = 2700.0
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

