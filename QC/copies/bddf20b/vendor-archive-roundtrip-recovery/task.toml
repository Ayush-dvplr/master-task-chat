schema_version = "1.4"
artifacts = ["/app/decode.py", "/app/encode.py", "/app/out/decoded_examples.jsonl", "/app/out/format_report.json", "/app/out/roundtrip_report.json", "/app/out/error_analysis.json"]

[task]
name = "terminal-bench/vendor-archive-roundtrip-recovery"
version = "1.0.0"
description = "Rebuild the codec for VARC1, a stateful binary archive container a retired vendor batch loader produced. Read the shipped specification, tables and captures, then write a decoder and a byte-exact encoder that decode interleaved multi-segment streams with per-run state, resolve short keys through each segment's revision and the stream aliases, keep opaque extensions and overlong deltas exactly as captured, reject bad headers in the documented order, and salvage frames after in-band damage. Produce the decoded examples and the format, round-trip and error reports."
keywords = ["python", "binary-format", "decoder", "encoder", "stdlib"]
authors = [{ name = "Ayush Sah", email = "ayush.sah@ethara.ai" }]

[metadata]
category = "Data Processing"
platforms = ["linux/amd64", "linux/arm64"]
tags = ["python", "binary-format", "decoder", "encoder", "stdlib"]
estimated_duration_sec = 7200.0
expert_time_estimate_min = 480.0
junior_time_estimate_min = 1440.0
null_floor = 0.0
discrimination_weight = 1.0

