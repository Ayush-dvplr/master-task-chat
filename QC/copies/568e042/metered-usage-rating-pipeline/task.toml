[task]
name = "terminal-bench/metered-usage-rating-pipeline"
version = "1.0.0"
description = "A cloud provider bills metered usage gathered by five regional collectors that each write a different file format. Build one reusable program that reads a month of collector extracts with the account list, plan changes, rate card, commitments, product map and collector controls, quarantines malformed records, rates every accepted line, applies each region's commitment credit, and writes normalised lines plus summary, data quality, product, region and segment reports that follow the rating contract exactly on this month and on fresh months."
keywords = ["python", "data-pipeline", "etl", "jsonl", "stdlib"]
authors = [{ name = "Shubhi Goyal", email = "shubhi.goyal.int@ethara.ai" }]

