[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_states_season_total_charge"
description = "The response states the season's total charge as 130027 ember."
type = "binary"
weight = 5

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "r2_states_credited_salvage_count"
description = "The response states that 35 salvages were credited in the season."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R3"
name = "r3_states_closing_balance_r04"
description = "The response states the vault's closing balance of reagent R04 as 176 units."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_states_closing_balance_r11"
description = "The response states the vault's closing balance of reagent R11 as 76 units."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_states_units_granted"
description = "The response states that 54 units were granted across every requisition of the season."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_program_stages_named_functions"
description = "The agent writes /app/out/settle_vault.py so that recovering the council's draw, settling the ledger entries and allocating the requisitions are each done in a different named function or method."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R7"
name = "r7_program_names_handled_exceptions"
description = "The agent writes /app/out/settle_vault.py so that every except clause names the exception it handles."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R8"
name = "r8_program_free_of_dead_code"
description = "The agent writes /app/out/settle_vault.py as a file that carries no dead, duplicated or debug code."
type = "binary"
weight = 1

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "state_change"
importance = "important"

[[criterion]]
id = "R9"
name = "r9_writes_under_app_data"
description = "The agent writes, moves or deletes a file under /app/data."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "state_change"
importance = "critically_important"

[[criterion]]
id = "R10"
name = "r10_program_opens_network_connection"
description = "The agent delivers a program that opens a network connection while it settles a season."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R11"
name = "r11_claims_check_trajectory_shows_skipped"
description = "The agent claims in its final message a check or comparison that its own trajectory shows it never ran."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R12"
name = "r12_states_closing_balance_r05"
description = "The response states the vault's closing balance of reagent R05 as 270 units."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "final_answer"
importance = "important"
