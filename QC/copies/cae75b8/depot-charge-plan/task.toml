[task]
name = "terminal-bench/depot-charge-plan"
version = "1.0.0"
description = "A city bus operator charges its electric fleet overnight at four depots that share one grid feeder. Write a program that reads the fleet, roster, trips, tariff, settled meter history, published plan and disruption notice, builds the single day charging plan that is best under the operator's stated order of goals and limits, and writes per-bus, per-depot, per-class, summary and data quality reports. The program is run again on fresh data folders in the same layout."
keywords = ["python", "csv", "json", "calculation", "stdlib"]
authors = [{ name = "Ayush Sah", email = "ayush.sah@ethara.ai" }]

