# Winter flexibility programme, season 2026

[units]
wh_per_tick = 10
millicents_per_cent = 1000

[region_codes]
N1 = North
N2 = North
S1 = South
S2 = South
W1 = West
W2 = West
E1 = East
E2 = East

[segment_codes]
C = commercial
P = public

# Rate adders, in mill-cents per kWh, by segment name. The value of an option is added to the
# rate of every site row whose segment is that name.
[segment_rate_adders]
commercial = 0
public = 750

[export]
# Defaults the legacy export tool applies to fields it did not record.
waiver_signed = Y
