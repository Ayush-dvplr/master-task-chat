schema_version = "1.4"
artifacts = ["/app/out/config.json", "/app/out/report.json", "/app/out/tool.zip", "/app/out/profile_dev.json", "/app/out/profile_prod.json", "/app/out/validation_report.json", "/app/out/summary.json"]

[task]
name = "terminal-bench/sentinel-policy-recompute"
version = "1.0.0"
description = "Repair a faulty multi-tenant access-control policy compiler, resolve the authoritative policy across a chained reference corpus, and drive the tool to emit deterministic flat security artifacts."
keywords = ["python", "cli", "security", "authorization", "policy", "configuration", "multi-tenant"]
authors = [{ name = "Ayush Sah", email = "ayush.sah@ethara.ai" }]

[metadata]
category = "Debugging"
platforms = ["linux/amd64", "linux/arm64"]
tags = ["python", "cli", "security", "authorization", "policy", "configuration", "multi-tenant"]
estimated_duration_sec = 7200.0
expert_time_estimate_min = 300.0
junior_time_estimate_min = 1440.0
null_floor = 0.0
discrimination_weight = 1.0

[verifier]
timeout_sec = 4200.0
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.z.ai"]
user = "1000:1000"

[environment]
build_timeout_sec = 900.0
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []
