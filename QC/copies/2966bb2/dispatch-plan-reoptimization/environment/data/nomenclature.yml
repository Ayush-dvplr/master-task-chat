# column and token nomenclature shared by every flat register
header_aliases:
  demand_units:
    - units
    - qty
    - planned_units
  demand_units_dozens:
    - units_dz
  item_code:
    - item
    - item_code
    - sku
    - code
  period_code:
    - period
    - period_code
  plant_code:
    - plant
    - plant_code
sentinel_tokens:
  - ''
  - NA
  - -
  - null
  - n/a
  - TBD
ignored_columns:
  - forecast_units
  - unit_cost_cents_legacy
  - capacity_units_legacy
  - week_index
  - source_desk
  - note
  - channel
  - review_desk
scale_tokens:
  kcents: 1000
  cents: 1
  dozens: 12
  pct_to_bps: 100
  bps_denominator: 10000
code_normalisation:
  upper_case: true
  strip_spaces: true
  drop_separators:
    - '-'
    - '_'
  zero_pad_numeric_tail: 2
retired_aliases:
  # column spellings from the pre migration exports; a register carrying one
  # of these carries it as a legacy copy that governs nothing
  - units_legacy
  - qty_old
  - cost_cents_v1
  - capacity_v1
  - rate_v1
  - volume_estimate
  - budget_indicative
  - penalty_legacy
  - surcharge_legacy
  - ordinal_guess
