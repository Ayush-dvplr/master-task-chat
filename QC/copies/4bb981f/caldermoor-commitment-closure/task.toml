[task]
name = "terminal-bench/caldermoor-commitment-closure"
version = "1.0.0"
description = "Close nine months of one household's commitments from eight contradicting local feeds into one deterministic ledger. Resolve principals whose aliases hold only inside their own intervals, resolve each reference at the instant its own rule names, walk project renames at that instant, settle competing rows under a rank order two classes read backwards, take the closure over dependencies that are live only where both parties resolve, and emit twenty-nine exact artifacts bound by five identities."
