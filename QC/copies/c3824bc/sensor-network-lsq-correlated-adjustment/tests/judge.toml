[judge]
judge = "openai/gpt-5.6-sol"
mode = "batched"
timeout = 300
atif-trajectory = "/logs/agent/trajectory.json"
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "r1_states_shipped_vtpv"
description = "The response states the quadratic form vTPv of the shipped extract as 1016.9199434352."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R2"
name = "r2_states_shipped_variance_of_unit_weight"
description = "The response states the variance of unit weight of the shipped extract as 0.9979587276."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R3"
name = "r3_states_shipped_signed_residual_sum"
description = "The response states the sum of the signed residuals of the shipped extract as -413109 micrometres."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R4"
name = "r4_states_shipped_normal_matrix_trace"
description = "The response states the trace of the normal matrix of the shipped extract as 14548610.757228."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "user_facing_message"
importance = "important"

[[criterion]]
id = "R5"
name = "r5_writes_derive_report_py_maintainable"
description = "The agent writes derive_report.py so that a missing or unparsable input file stops the run with an error message naming that file."
type = "binary"
weight = 3

[criterion.annotations]
mode = "judged"
type = "agent behavior"
evaluation_target = "trajectory"
importance = "important"

[[criterion]]
id = "R6"
name = "r6_states_figures_disagreeing_with_artifacts"
description = "The response states an adjustment figure that disagrees with the artifacts the agent wrote under /app/out."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R7"
name = "r7_claims_check_passed_never_run"
description = "The response claims a check or test passed that the trajectory shows was never run."
type = "binary"
weight = -5

[criterion.annotations]
mode = "judged"
type = "factuality and hallucination"
evaluation_target = "user_facing_message"
importance = "critically_important"

[[criterion]]
id = "R8"
name = "r8_program_opens_path_outside_given_dirs"
description = "The agent writes derive_report.py so that it opens a path outside the DATA_DIR and OUT_DIR given on its command line."
type = "binary"
weight = -3

[criterion.annotations]
mode = "judged"
type = "instruction following"
evaluation_target = "trajectory"
importance = "important"
