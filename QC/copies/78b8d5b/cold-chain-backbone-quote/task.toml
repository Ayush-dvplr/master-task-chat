schema_version = "1.4"
artifacts = ["/app/out/patched-repo.zip", "/app/out/repair-report.json", "/app/out/module_core.json", "/app/out/module_parser.json", "/app/out/module_report.json", "/app/out/test_fixes.json", "/app/out/summary.json", "/app/repo/src/task/core.py"]

[task]
name = "terminal-bench/cold-chain-backbone-quote"
version = "1.0.0"
description = "Repair a cold-chain network quoting package so that, for every project in a quote book, it finds the cheapest set of open links connecting the depot and every mandatory cold room, charging link costs plus a one-time activation charge for every site the network touches, and rolls each project's minimum quote into corridor and site totals. Ship the repaired repository as a zip with per-module result documents, the regression outcomes and a repair report."
keywords = ["python", "repo-patch", "debugging", "source-repair", "network-optimization"]
authors = [{ name = "Ayush Sah", email = "ayush.sah@ethara.ai" }]

[metadata]
category = "Optimization"
platforms = ["linux/amd64", "linux/arm64"]
tags = ["python", "repo-patch", "debugging", "source-repair", "network-optimization"]
estimated_duration_sec = 7200.0
expert_time_estimate_min = 480.0
junior_time_estimate_min = 1440.0
null_floor = 0.0
discrimination_weight = 1.0

[verifier]
timeout_sec = 2700.0
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.z.ai"]
user = "1000:1000"

[environment]
